name: Ajustar rodape da roleta

on:
  push:
    paths:
      - 'backend/frontend/roulette207.html'
      - 'backend/frontend/.rodape-roleta-trigger'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar colunas do rodape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/roulette207.html')
          s = p.read_text()
          old = """  grid-template-columns:\n    repeat(3,1fr);"""
          new = """  grid-template-columns:\n    repeat(2,minmax(0,1fr));"""
          if old not in s:
              raise SystemExit('CSS do rodape nao encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('backend/frontend/.rodape-roleta-trigger').unlink(missing_ok=True)
          PY

      - name: Commit ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/roulette207.html backend/frontend/.rodape-roleta-trigger .github/workflows/ajustar-rodape-roleta.yml
          git diff --cached --quiet || git commit -m "Ajustar rodape da roleta para dois itens [skip ci]"
          git push

      - name: Remover workflow temporario
        run: |
          git rm -f .github/workflows/ajustar-rodape-roleta.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remover workflow temporario do rodape [skip ci]" || true
          git push || true
