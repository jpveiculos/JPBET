name: Adjust roulette result notification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Adjust notification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/frontend/roulette207.html')
          text = path.read_text(encoding='utf-8')

          old = """  box.textContent =\n    type === 'win'\n      ? '🎉 Você ganhou ' + valor\n      : 'Você perdeu ' + valor;"""
          new = """  if(type !== 'win'){\n\n    return;\n\n  }\n\n\n  box.textContent =\n    'Você ganhou ' + valor;"""
          if old not in text:
              raise SystemExit('notification text block not found')
          text = text.replace(old, new, 1)

          old = """    if(resultType){\n\n      showSpinResult(\n        resultType,\n        resultAmount\n      );\n\n    }"""
          new = """    if(resultType === 'win'){\n\n      showSpinResult(\n        'win',\n        resultAmount\n      );\n\n    }"""
          if old not in text:
              raise SystemExit('notification call block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/roulette207.html .github/workflows/remove-loss-notification.yml
          git diff --cached --quiet && exit 0
          git commit -m "Show only roulette win notification"
          git rm .github/workflows/remove-loss-notification.yml
          git commit -m "Remove one-time notification workflow"
          git push