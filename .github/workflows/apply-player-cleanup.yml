name: Organizar área do jogador

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'Aplicar limpeza da área do jogador') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar dashboard
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* MYBETS_ROULETTE_CENTER_STYLE */'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start)
              block = s[start:end].replace('\\n', '\n')
              s = s[:start] + block + s[end:]

          s = s.replace('<div class="logo">MyBets</div>', '<a class="logo" href="/" aria-label="MyBets início">MyBets</a>', 1)
          s = re.sub(r'\s*<div class="header-balance" id="headerBalance">.*?</div>', '', s, count=1, flags=re.S)
          s = s.replace('<div class="header-right">\n        <button class="menu-button"', '<div class="header-right">\n        <span id="headerBalance" style="display:none">0,00</span>\n        <button class="menu-button"', 1)
          s = s.replace('<div class="header-right">', '<button class="player-back-button" type="button" onclick="voltarPaginaMyBets()" aria-label="Voltar">←</button>\n\n    <div class="header-right">', 1)
          s = re.sub(r'\s*<p>Bem-vindo ao MyBets\.</p>', '', s, count=1)
          s = re.sub(r'\s*<div class="balance-description">.*?</div>', '', s, count=1, flags=re.S)
          s = re.sub(r'\s*<div class="reserved-box" id="reservedBalanceBox">.*?</div>\s*', '\n', s, count=1, flags=re.S)

          card = '''<section class="balance-card">\n        <div class="balance-summary">\n            <div class="balance-stat"><span>Saldo</span><strong id="mainBalance">0,00</strong></div>\n            <div class="balance-stat bonus-stat"><span>Bônus</span><strong id="bonusBalanceValue">0,00</strong></div>\n        </div>\n        <div class="balance-actions">\n            <button class="primary-button" onclick="abrirDeposito()">+ Depositar</button>\n            <button class="secondary-button" onclick="abrirSaque()">Sacar</button>\n        </div>\n    </section>'''
          s = re.sub(r'<section class="balance-card">.*?</section>', card, s, count=1, flags=re.S)
          s = re.sub(r'\s*<section class="info">.*?</section>', '', s, count=1, flags=re.S)
          s = s.replace('<div class="game-icon">🎡</div>', '<div class="roulette-preview" aria-label="Roleta MyBets"><div class="roulette-preview-wheel"><span>MyBets</span></div></div>', 1)
          s = s.replace('<h3>Roda da Sorte</h3>', '<h3>Roleta MyBets</h3>', 1)
          s = s.replace('<p>Faça sua aposta e gire a roda.</p>', '', 1)

          css = '''\n/* MYBETS_PLAYER_CLEANUP */\n.logo{ text-decoration:none!important; color:var(--gold)!important; font-style:italic; font-weight:1000; letter-spacing:-1px; }\n.player-back-button{ border:1px solid rgba(245,197,66,.22); background:rgba(245,197,66,.06); color:var(--gold2); border-radius:10px; width:38px; height:38px; font-size:22px; font-weight:900; }\n.balance-card{padding:18px}.balance-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.balance-stat{padding:15px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(245,197,66,.18)}.balance-stat span{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.balance-stat strong{display:block;color:var(--gold2);font-size:clamp(25px,7vw,38px);font-weight:1000}.bonus-stat strong{color:#d9ad36}.roulette-preview{display:flex;justify-content:center;align-items:center;margin-bottom:12px}.roulette-preview-wheel{width:118px;height:118px;border-radius:50%;border:7px solid #c99520;background:conic-gradient(#090909 0 22.5deg,#d7a126 22.5deg 45deg,#090909 45deg 67.5deg,#d7a126 67.5deg 90deg,#090909 90deg 112.5deg,#d7a126 112.5deg 135deg,#090909 135deg 157.5deg,#d7a126 157.5deg 180deg,#090909 180deg 202.5deg,#d7a126 202.5deg 225deg,#090909 225deg 247.5deg,#d7a126 247.5deg 270deg,#090909 270deg 292.5deg,#d7a126 292.5deg 315deg,#090909 315deg 337.5deg,#d7a126 337.5deg 360deg);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px #5c3b0b,0 10px 25px rgba(0,0,0,.5)}.roulette-preview-wheel:before{content:"";width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#292929,#050505 72%);border:3px solid #d89a12;position:absolute}.roulette-preview-wheel span{position:relative;z-index:1;color:#f7f7f7;font-style:italic;font-size:12px;font-weight:1000}.games{grid-template-columns:1fr}\n'''
          s = s.replace('</style>', css + '</style>', 1)
          if '<script src="/navigation.js"></script>' not in s:
              s = s.replace('</body>', '  <script src="/navigation.js"></script>\n</body>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Adicionar voltar nas outras páginas
        shell: python
        run: |
          from pathlib import Path
          for p in Path('backend/frontend').glob('*.html'):
              if p.name == 'dashboard.html':
                  continue
              s = p.read_text(encoding='utf-8')
              if '<script src="/navigation.js"></script>' not in s:
                  s = s.replace('</body>', '  <script src="/navigation.js"></script>\n</body>', 1)
                  p.write_text(s, encoding='utf-8')

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar limpeza da área do jogador"
          git push
