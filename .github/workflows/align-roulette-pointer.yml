name: Align roulette pointer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align roulette geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')

          marker = "</script>\n\n</body>"
          code = r'''\nfunction obterGeometriaRoletaPesada(segmentos) {\n    /* Geometria visual: 4 prêmios de 67,5° e 4 blocos amarelos de 22,5°.\n       As 16 posições lógicas permanecem; cada perda ocupa 7,5° dentro do bloco. */\n    const grupos = [\n        { prize: 0, losses: [1, 2, 3], start: 0 },\n        { prize: 4, losses: [5, 6, 7], start: 90 },\n        { prize: 8, losses: [9, 10, 11], start: 180 },\n        { prize: 12, losses: [13, 14, 15], start: 270 }\n    ];\n    const geometria = new Array(16);\n    grupos.forEach(({ prize, losses, start }) => {\n        geometria[prize] = { startDeg: start, endDeg: start + 67.5, centerDeg: start + 33.75 };\n        losses.forEach((index, pos) => {\n            const startDeg = start + 67.5 + pos * 7.5;\n            geometria[index] = { startDeg, endDeg: startDeg + 7.5, centerDeg: startDeg + 3.75 };\n        });\n    });\n    return geometria;\n}\n'''

          if marker not in s:
              raise SystemExit('Marcador final não encontrado; nenhuma alteração feita.')

          if 'startDeg: start + 33.75' in s:
              print('Geometria já corrigida.')
          else:
              s = s.replace(marker, code + "\n</script>\n\n</body>", 1)
              p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          git diff --cached --quiet || git commit -m "Align roulette pointer with prize center"
          git push
