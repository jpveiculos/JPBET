name: Fix roulette pointer mapping for 77 sectors

on:
  issues:
    types: [opened]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix pointer mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/frontend/roulette207.html')
          text = path.read_text(encoding='utf-8')

          start_marker = 'function visualTargetForSector(sector){'
          end_marker = '\n\n\n/* ========================================================='

          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('visualTargetForSector start not found')

          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('visualTargetForSector end not found')

          new_func = '''function visualTargetForSector(sector){

  if(
    !Number.isInteger(sector) ||
    sector < 0 ||
    sector >= TOTAL
  ){

    return 10;

  }


  /*
   * 77 setores lógicos são representados
   * por 18 faixas visuais: 9 douradas
   * (prêmios) e 9 pretas (perdas).
   */
  const prizeIndex =
    PRIZE_INDEXES.indexOf(sector);


  if(prizeIndex >= 0){

    return (
      prizeIndex * 40 +
      10
    );

  }


  let group = -1;

  for(
    let i = 0;
    i < PRIZE_INDEXES.length;
    i++
  ){

    const startPrize =
      PRIZE_INDEXES[i];

    const nextPrize =
      i === PRIZE_INDEXES.length - 1
        ? PRIZE_INDEXES[0] + TOTAL
        : PRIZE_INDEXES[i + 1];

    const logicalSector =
      sector < startPrize
        ? sector + TOTAL
        : sector;

    if(
      logicalSector > startPrize &&
      logicalSector < nextPrize
    ){

      group = i;
      break;

    }

  }


  if(group < 0){

    return 10;

  }


  const startPrize =
    PRIZE_INDEXES[group];

  const nextPrize =
    group === PRIZE_INDEXES.length - 1
      ? PRIZE_INDEXES[0] + TOTAL
      : PRIZE_INDEXES[group + 1];

  const logicalSector =
    sector < startPrize
      ? sector + TOTAL
      : sector;

  const lossCount =
    nextPrize -
    startPrize -
    1;

  const lossPosition =
    logicalSector -
    startPrize -
    1;


  /*
   * Cada faixa preta ocupa 20 graus.
   * Cada setor de perda recebe o centro
   * de uma subdivisão dessa faixa.
   */
  return (
    group * 40 +
    20 +
    (
      lossPosition +
      0.5
    ) *
    (20 / lossCount)
  );

}'''

          path.write_text(
              text[:start] + new_func + text[end:],
              encoding='utf-8'
          )
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/roulette207.html
          git commit -m "Align roulette pointer with 77 sectors"
          git rm .github/workflows/fix-roulette-pointer-mapping.yml
          git commit -m "Remove one-time roulette pointer workflow"
          git push
