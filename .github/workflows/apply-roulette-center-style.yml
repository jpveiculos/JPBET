name: Apply roulette center style

on:
  push:
    branches: [main]

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'chore: apply roulette center style')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar visual da roleta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MYBETS_ROULETTE_CENTER_STYLE */'
          if marker not in s:
              css = r'''\n/* MYBETS_ROULETTE_CENTER_STYLE */\n.roulette-center-button {\n    font-size: 0 !important;\n    line-height: 1 !important;\n    display: flex !important;\n    flex-direction: column !important;\n    align-items: center !important;\n    justify-content: center !important;\n    gap: 3px !important;\n}\n.roulette-center-button::before {\n    content: "MyBets" !important;\n    display: block !important;\n    margin: 0 !important;\n    font-family: Arial, Helvetica, sans-serif !important;\n    font-size: clamp(20px, 4.5vw, 27px) !important;\n    font-style: italic !important;\n    font-weight: 900 !important;\n    letter-spacing: -1px !important;\n    color: #f7f7f7 !important;\n    text-shadow: 0 2px 5px rgba(0,0,0,.45) !important;\n}\n.roulette-center-button::after {\n    content: "GIRAR" !important;\n    display: block !important;\n    font-family: Arial, Helvetica, sans-serif !important;\n    font-size: clamp(15px, 3.5vw, 21px) !important;\n    font-weight: 1000 !important;\n    letter-spacing: 1px !important;\n    color: #ffd33d !important;\n    text-shadow: 0 2px 5px rgba(0,0,0,.5) !important;\n}\n.bet-area {\n    margin-top: 0 !important;\n}\n.quick-values {\n    margin-top: 8px !important;\n}\n'''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply roulette center style"
          git push