name: Apply roulette center style

on:
  push:
    branches: [main]

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'chore: apply roulette center style')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar visual da roleta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MYBETS_ROULETTE_CENTER_STYLE */'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start)
              block = s[start:end]
              block = block.replace('\\n', '\n')
              s = s[:start] + block + s[end:]
          else:
              css = '''
/* MYBETS_ROULETTE_CENTER_STYLE */
.roulette-center-button { font-size: 0 !important; line-height: 1 !important; display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; gap: 3px !important; }
.roulette-center-button::before { content: "MyBets" !important; display: block !important; margin: 0 !important; font-family: Arial, Helvetica, sans-serif !important; font-size: clamp(20px, 4.5vw, 27px) !important; font-style: italic !important; font-weight: 900 !important; letter-spacing: -1px !important; color: #f7f7f7 !important; text-shadow: 0 2px 5px rgba(0,0,0,.45) !important; }
.roulette-center-button::after { content: "GIRAR" !important; display: block !important; font-family: Arial, Helvetica, sans-serif !important; font-size: clamp(15px, 3.5vw, 21px) !important; font-weight: 1000 !important; letter-spacing: 1px !important; color: #ffd33d !important; text-shadow: 0 2px 5px rgba(0,0,0,.5) !important; }
.bet-area { margin-top: 0 !important; }
.quick-values { margin-top: 8px !important; }
'''
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply roulette center style"
          git push