name: Fix roulette site menu

on:
  push:
    paths:
      - 'backend/frontend/roulette-menu-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add site menu to roulette
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/frontend/roulette207.html')
          s=p.read_text()
          old="""<button\n  onclick=\"\n    location.href='/'\n  \"\n>\n\n  <span>\n    ☰\n  </span>\n\n  Menu do site\n\n</button>"""
          new="""<button id=\"siteMenuButton\" type=\"button\">\n\n  <span>\n    ☰\n  </span>\n\n  Menu do site\n\n</button>"""
          if old not in s:
              raise SystemExit('Botão Menu do site não encontrado')
          s=s.replace(old,new,1)
          marker='</body>'
          addition=r'''<div id="siteMenuOverlay" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);align-items:stretch;justify-content:flex-end;">
  <aside style="width:min(340px,88%);height:100%;padding:20px;background:linear-gradient(180deg,#0b121b,#070c13);border-left:1px solid rgba(255,255,255,.1);box-shadow:-12px 0 35px rgba(0,0,0,.45);">
    <button type="button" id="closeSiteMenu" style="float:right;border:0;background:#111925;color:#fff;width:44px;height:44px;border-radius:13px;font-size:28px;">×</button>
    <h2 style="margin-top:55px;color:#ffd83d;">Menu do site</h2>
    <button type="button" data-menu-link="/" style="width:100%;margin-top:10px;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:#111923;color:#fff;text-align:left;font-weight:800;">🏠 Início</button>
    <button type="button" data-menu-link="/dashboard.html" style="width:100%;margin-top:10px;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:#111923;color:#fff;text-align:left;font-weight:800;">👤 Área do jogador</button>
    <button type="button" id="closeSiteMenu2" style="width:100%;margin-top:10px;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:#111923;color:#fff;text-align:left;font-weight:800;">✕ Fechar menu</button>
  </aside>
</div>
<script>
(function(){
  const b=document.getElementById('siteMenuButton'),o=document.getElementById('siteMenuOverlay');
  if(!b||!o)return;
  const close=()=>o.style.display='none';
  b.onclick=()=>o.style.display='flex';
  document.getElementById('closeSiteMenu').onclick=close;
  document.getElementById('closeSiteMenu2').onclick=close;
  o.addEventListener('click',e=>{if(e.target===o)close()});
  o.querySelectorAll('[data-menu-link]').forEach(x=>x.onclick=()=>{location.href=x.dataset.menuLink});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
'''
          if marker not in s:
              raise SystemExit('</body> não encontrado')
          s=s.replace(marker,addition+marker,1)
          p.write_text(s)
          Path('backend/frontend/roulette-menu-trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/fix-menu-roulette.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/roulette207.html backend/frontend/roulette-menu-trigger.txt .github/workflows/fix-menu-roulette.yml
          git commit -m 'Fazer Menu do site abrir menu na roleta [skip ci]'
          git push
