name: Configure Roulette 54

on:
  push:
    paths:
      - 'backend/frontend/roulette54-trigger.txt'

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update roulette frontend
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('backend/frontend/roulette207.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text, n_total = re.subn(r'const TOTAL\s*=\s*77\s*;', 'const TOTAL = 54;', text, count=1)

          text, n_prizes = re.subn(
              r'const DEFAULT_PRIZES\s*=\s*\[[\s\S]*?\];',
              'const DEFAULT_PRIZES = [2,3,4,5,2,3,4,5,10];',
              text, count=1
          )

          text, n_indexes = re.subn(
              r'const PRIZE_INDEXES\s*=\s*\[[\s\S]*?\];',
              'const PRIZE_INDEXES = [0,6,12,18,24,30,36,42,48];',
              text, count=1
          )

          if n_total != 1 or n_prizes != 1 or n_indexes != 1:
              raise SystemExit(f'Expected constants not found: TOTAL={n_total}, PRIZES={n_prizes}, INDEXES={n_indexes}')

          # Replace the visual-sector target mapper when present. This keeps the
          # 18 visible wedges aligned with the 54 logical sectors: each gold
          # wedge contains one winning logical sector, while the adjacent black
          # wedge contains the five losing sectors until the next prize.
          pattern = re.compile(r'function\s+visual(?:Target|Angle)ForSector\s*\(\s*sector\s*\)\s*\{')
          m = pattern.search(text)
          if not m:
              raise SystemExit('Visual sector mapping function not found; refusing partial update.')

          start = m.start()
          brace = text.find('{', m.start())
          depth = 0
          end = None
          for i in range(brace, len(text)):
              if text[i] == '{': depth += 1
              elif text[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('Could not parse visual sector mapping function.')

          new_fn = '''function visualAngleForSector(sector){

  const s = ((Number(sector) % TOTAL) + TOTAL) % TOTAL;

  const group = Math.floor(s / 6);
  const groupStart = group * 6;
  const prizeSector = groupStart;

  if(s === prizeSector){
    return group * 40 + 10;
  }

  const lossPosition = s - groupStart - 1;
  return group * 40 + 20 + (lossPosition + 0.5) * (20 / 5);
}'''
          text = text[:start] + new_fn + text[end:]

          # Update stale explanatory labels without touching the center logo.
          text = text.replace('Roleta 77', 'Roleta 54')
          text = text.replace('77 setores', '54 setores')
          text = text.replace('68 setores', '45 setores')
          text = text.replace('81 perdas', '45 perdas')
          text = text.replace('90 setores', '54 setores')
          text = text.replace('90', '54') if False else text

          if text == original:
              raise SystemExit('No frontend changes were made.')

          path.write_text(text, encoding='utf-8')

      - name: Commit frontend update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/roulette207.html .github/workflows/configure-roulette-54.yml backend/frontend/roulette54-trigger.txt
          git rm backend/frontend/roulette54-trigger.txt
          git commit -m 'Alinha roleta visual com 54 setores e RTP ~70%'
          git push
