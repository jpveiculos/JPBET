name: Apply roulette cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean trevo and align MyBets roulette
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('backend/src/settings.js').read_text()
          s=s.replace('["roulette_free_spin_enabled","true"]','["roulette_free_spin_enabled","false"]')
          s=s.replace('["roulette_replay_probability","8"]','["roulette_replay_probability","0"]')
          Path('backend/src/settings.js').write_text(s)

          p=Path('backend/frontend/dashboard.html')
          s=p.read_text()
          s=s.replace("onclick=\"abrirRoleta('sorte')\"","onclick=\"abrirRoleta('roleta')\"")
          s=s.replace('sorte: {','roleta: {')
          s=s.replace('ROLETAS.sorte','ROLETAS.roleta')
          s=s.replace('function abrirRoleta(tipo = "sorte")','function abrirRoleta(tipo = "roleta")')
          s=s.replace('tipo = "sorte";','tipo = "roleta";')
          s=s.replace('Roda da Sorte','Roleta MyBets')
          s=s.replace('Prêmios: 2×, 3×, 2× e 3×','Prêmios: 5×, 10×, 2× e 3×')
          s=re.sub(r'\n\s*/\* 🍀 SORTE:.*?\n\s*return;\n\s*}\n', '\n', s, flags=re.S)
          s=re.sub(r'\nasync function girarRoletaGratis\(\) \{.*?\n\}\n\nasync function carregarHistorico', '\nasync function carregarHistorico', s, flags=re.S)
          s=re.sub(r'\nfunction obterGeometriaRoletaPesada\(segmentos\) \{.*?\nanimarRoleta = function\(indiceResultado\) \{.*?\n\};\n</script>', '\n</script>', s, flags=re.S)
          s=s.replace('        } else if (resultadoTipo === "sorte" || resultadoLabel === "🍀") {\n            resultMain.textContent = "🍀";\n            resultPrize.textContent = "Giro grátis automático!";\n        } else {\n            resultMain.textContent = "X";\n            resultPrize.textContent = "Aposta sem prêmio nesta rodada.";\n        }','        }')
          s=s.replace('const resultadoTipo = String(spin.resultType || "").toLowerCase();\n        const resultadoLabel = spin.result || ROLETAS[roletaAtual].segments[indiceResultado];','const resultadoLabel = spin.result || ROLETAS[roletaAtual].segments[indiceResultado];')
          p.write_text(s)
