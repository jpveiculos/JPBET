name: Atualizar laboratório Roleta 54

on:
  push:
    paths:
      - 'backend/frontend/lab54-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar laboratório
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('backend/frontend/teste-probabilidade.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'const TOTAL=77;', 'const TOTAL=54;', s, count=1)
          s=re.sub(r'const PRIZE_SECTORS=\[[^\]]+\];', 'const PRIZE_SECTORS=[0,6,12,18,24,30,36,42,48];', s, count=1)
          s=re.sub(r'let MULTIPLIERS=\[[^\]]+\];', 'let MULTIPLIERS=[2,3,4,5,2,3,4,5,10];', s, count=1)
          s=s.replace('Roleta 77','Roleta 54').replace('ROULETA<br>77','ROULETA<br>54').replace('77 setores','54 setores').replace('68','45').replace('crypto.randomInt(77)','crypto.randomInt(54)')
          s=s.replace('11,6883%','16,6667%')
          s=s.replace('Math.floor(Math.random()*77)','Math.floor(Math.random()*54)')
          s=s.replace('Math.random()*77','Math.random()*54')
          p.write_text(s,encoding='utf-8')
      - name: Remover temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/teste-probabilidade.html .github/workflows/update-lab-roulette-54.yml backend/frontend/lab54-trigger.txt
          git rm .github/workflows/update-lab-roulette-54.yml backend/frontend/lab54-trigger.txt
          git commit -m 'Atualiza laboratório para roleta 54'
          git push
