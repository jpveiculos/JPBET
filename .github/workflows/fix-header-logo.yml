name: Fix header logo

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corrigir CSS da logo do cabeçalho
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/frontend/brand-standard.js')
          s=p.read_text(encoding='utf-8')
          marker='@media(max-width:600px){.mybets-logo-main{font-size:clamp(24px,8vw,34px)!important}.game-brand.mybets-logo .mybets-logo-main{font-size:19px!important}}'
          patch=marker+'''.top .mybets-logo{display:inline-flex!important;flex-direction:column!important;align-items:flex-start!important;width:max-content!important;max-width:170px!important;padding:0 0 5px!important}.top .mybets-logo-main{display:inline-flex!important;flex-direction:row!important;align-items:baseline!important;white-space:nowrap!important;font-size:27px!important;letter-spacing:-1.5px!important}.top .mybets-logo-line{display:block!important;width:100%!important;height:2px!important;margin-top:4px!important}.top .mybets-logo-my{display:inline!important}.top .mybets-logo-bets{display:inline!important}@media(max-width:600px){.top .mybets-logo-main{font-size:27px!important}}'''
          if '.top .mybets-logo{display:inline-flex' not in s:
              if marker not in s: raise SystemExit('CSS marker não encontrado')
              s=s.replace(marker,patch,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit alteração e remover workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/brand-standard.js
          git rm -f .github/workflows/fix-header-logo.yml
          git commit -m "Ajusta logo MyBets no topo da roleta"
          git push origin main
