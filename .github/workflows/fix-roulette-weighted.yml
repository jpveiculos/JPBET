name: Fix weighted roulette

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply roulette design
        shell: python
        run: |
          from pathlib import Path
          import re

          desired_segments = '''segments: [
              "2X", "", "", "",
              "3X", "", "", "",
              "2X", "", "", "",
              "3X", "", "", ""
          ]'''

          dashboard = Path("backend/frontend/dashboard.html")
          text = dashboard.read_text(encoding="utf-8")

          text, n = re.subn(
              r'segments:\s*\[.*?\n\s*\]',
              desired_segments,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit("Não encontrei o bloco segments da roleta no dashboard.")

          text = text.replace(
              "Aposte de R$ 0,50 a R$ 100 • Prêmios: 2×, 3× e 5×",
              "Aposte de R$ 0,50 a R$ 100 • Prêmios: 2×, 3×, 2× e 3×"
          )

          start = text.index("function criarRoda() {")
          end = text.index("function formatarResultadoRoleta", start)
          new_create = r'''function obterGeometriaRoleta(segmentos) {
    const pesos = segmentos.map(item => {
        const peso = Number(item?.probability ?? 0);
        return Number.isFinite(peso) && peso > 0 ? peso : 0;
    });

    let total = pesos.reduce((soma, peso) => soma + peso, 0);
    if (!(total > 0)) {
        total = segmentos.length;
        pesos.fill(1);
    }

    let cursor = 0;
    return segmentos.map((item, index) => {
        const startDeg = cursor;
        const endDeg = index === segmentos.length - 1
            ? 360
            : cursor + (pesos[index] / total) * 360;
        cursor = endDeg;
        return {
            startDeg,
            endDeg,
            centerDeg: startDeg + (endDeg - startDeg) / 2
        };
    });
}

function criarRoda() {
    const wheel = document.getElementById("wheel");
    const svg = document.getElementById("rouletteSvg");
    if (!wheel || !svg) return;

    const roleta = ROLETAS[roletaAtual] || ROLETAS.sorte;
    const segmentos = Array.isArray(roleta.segments) ? roleta.segments : [];
    if (segmentos.length !== 16) {
        console.error("A roleta precisa ter exatamente 16 fatias.");
        return;
    }

    svg.innerHTML = "";
    const ns = "http://www.w3.org/2000/svg";
    const cx = 250, cy = 250, radius = 238;
    const geometria = obterGeometriaRoleta(segmentos);

    segmentos.forEach((label, index) => {
        const setor = geometria[index];
        const isPrize = String(label || "").trim() !== "";
        const group = document.createElementNS(ns, "g");
        group.setAttribute("class", "roulette-sector");
        group.setAttribute("data-index", String(index));

        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", sectorPath(cx, cy, radius, setor.startDeg, setor.endDeg));
        path.setAttribute("fill", isPrize ? "#080808" : "#c99724");
        path.setAttribute("stroke", "none");
        path.setAttribute("stroke-width", "0");
        group.appendChild(path);

        if (isPrize) {
            const p = polar(cx, cy, 155, setor.centerDeg);
            const text = document.createElementNS(ns, "text");
            const texto = String(label).toUpperCase();
            text.textContent = texto;
            text.setAttribute("x", p.x);
            text.setAttribute("y", p.y);
            text.setAttribute("class", "roulette-label multiplier");
            text.setAttribute("font-size", "54");
            text.setAttribute("fill", "#25e66b");
            text.style.fill = "#25e66b";
            text.dataset.x = String(p.x);
            text.dataset.y = String(p.y);
            text.setAttribute("transform", `rotate(0 ${p.x} ${p.y})`);
            group.appendChild(text);
        }
        svg.appendChild(group);
    });

    const outerRing = document.createElementNS(ns, "circle");
    outerRing.setAttribute("cx", cx);
       outerRing.setAttribute("cy", cy);
    outerRing.setAttribute("r", radius);
    outerRing.setAttribute("fill", "none");
    outerRing.setAttribute("stroke", "#a66f08");
    outerRing.setAttribute("stroke-width", "11");
    svg.appendChild(outerRing);

    const outerHighlight = document.createElementNS(ns, "circle");
    outerHighlight.setAttribute("cx", cx);
    outerHighlight.setAttribute("cy", cy);
    outerHighlight.setAttribute("r", radius - 7);
    outerHighlight.setAttribute("fill", "none");
    outerHighlight.setAttribute("stroke", "#f5d66a");
    outerHighlight.setAttribute("stroke-width", "2");
    svg.appendChild(outerHighlight);

    wheel.style.transition = "none";
    wheel.style.transform = "rotate(0deg)";
    roletaRotacaoAtual = 0;
}

'''
          text = text[:start] + new_create + text[end:]

          start = text.index("function animarRoleta(indiceResultado) {")
          end = text.index("async function destacarVencedora", start)
          new_anim = r'''function animarRoleta(indiceResultado) {
    return new Promise(resolve => {
        const wheel = document.getElementById("wheel");
        const visualIndex = Number(indiceResultado);
        const roleta = ROLETAS[roletaAtual] || ROLETAS.sorte;
        const segmentos = Array.isArray(roleta.segments) ? roleta.segments : [];
        const geometria = obterGeometriaRoleta(segmentos);

        if (!wheel || !Number.isInteger(visualIndex) || visualIndex < 0 || visualIndex >= geometria.length) {
            resolve();
            return;
        }

        const centro = geometria[visualIndex].centerDeg;
        const alvo = -centro;
        const atual = Number(roletaRotacaoAtual) || 0;
        const moduloAlvo = ((alvo % 360) + 360) % 360;
        const moduloAtual = ((atual % 360) + 360) % 360;
        let ajuste = moduloAlvo - moduloAtual;
        if (ajuste < 0) ajuste += 360;

        const destino = atual + 4 * 360 + ajuste;
        const duracao = Math.max(1400, Number(configuracoes.roulette_animation_ms) || 1800);
        wheel.style.transition = "none";
        wheel.style.transform = `rotate(${atual}deg)`;
        manterNumerosRetos(atual);

        requestAnimationFrame(() => {
            const inicio = performance.now();
            function animar(agora) {
                const progresso = Math.min(1, (agora - inicio) / duracao);
                const ease = 1 - Math.pow(1 - progresso, 3);
                const rotacao = atual + (destino - atual) * ease;
                wheel.style.transform = `rotate(${rotacao}deg)`;
                manterNumerosRetos(rotacao);
                if (progresso < 1) return requestAnimationFrame(animar);
                roletaRotacaoAtual = destino;
                wheel.style.transform = `rotate(${destino}deg)`;
                manterNumerosRetos(destino);
                resolve();
            }
            requestAnimationFrame(animar);
        });
        tocarSom("click");
    });
}

'''
          text = text[:start] + new_anim + text[end:]
          dashboard.write_text(text, encoding="utf-8")

          server = Path("backend/src/server.js")
          text = server.read_text(encoding="utf-8")
          start = text.index("const ROLETTE_DEFAULT_SEGMENTS = [")
          end = text.index("];", start) + 2
          new_default = '''const ROLETTE_DEFAULT_SEGMENTS = [
  { index: 0, label: "2x", type: "prize", multiplier: 2, probability: 15 },
  { index: 1, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 2, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 3, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 4, label: "3x", type: "prize", multiplier: 3, probability: 15 },
  { index: 5, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 6, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 7, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 8, label: "2x", type: "prize", multiplier: 2, probability: 15 },
  { index: 9, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 10, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 11, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 12, label: "3x", type: "prize", multiplier: 3, probability: 15 },
  { index: 13, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 14, label: "", type: "zero", multiplier: 0, probability: 5 },
  { index: 15, label: "", type: "zero", multiplier: 0, probability: 5 }
];'''
          text = text[:start] + new_default + text[end:]
          text = text.replace('throw new Error("A roleta precisa ter exatamente 20 fatias.");', 'throw new Error("A roleta precisa ter exatamente 16 fatias.");')
          server.write_text(text, encoding="utf-8")

          settings = Path("backend/src/settings.js")
          text = settings.read_text(encoding="utf-8")
          start = text.index("const segmentosRoletaPadrao = [")
          end = text.index("];", start) + 2
          new_settings = '''const segmentosRoletaPadrao = [
  {label:"2x",type:"prize",multiplier:2,probability:15},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"3x",type:"prize",multiplier:3,probability:15},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"2x",type:"prize",multiplier:2,probability:15},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"3x",type:"prize",multiplier:3,probability:15},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5},
  {label:"X",type:"zero",multiplier:0,probability:5}
];'''
          text = text[:start] + new_settings + text[end:]
          old_migration = """      if (Array.isArray(segmentos) && segmentos.length === 16) {\n        if (segmentos[8] && String(segmentos[8].type || '').toLowerCase() === 'prize' && Number(segmentos[8].multiplier) === 4) {\n          segmentos[8] = {...segmentos[8], label:'2x', multiplier:2};\n        }\n        await pool.query(`UPDATE site_settings SET setting_value=$1,updated_at=CURRENT_TIMESTAMP WHERE setting_key='roulette_segments_json'`,[JSON.stringify(segmentos)]);\n      } else {"""
          new_migration = """      if (Array.isArray(segmentos) && segmentos.length === 16) {\n        const temPremio5x = segmentos.some(item => String(item?.type || '').toLowerCase() === 'prize' && Number(item?.multiplier) === 5);\n        if (temPremio5x) {\n          const indicesPremio = segmentos.map((item, index) => String(item?.type || '').toLowerCase() === 'prize' ? index : -1).filter(index => index >= 0);\n          const multiplicadores = [2, 3, 2, 3];\n          indicesPremio.slice(0, 4).forEach((index, pos) => {\n            segmentos[index] = {...segmentos[index], label:`${multiplicadores[pos]}x`, multiplier:multiplicadores[pos], probability:15};\n          });\n          segmentos.forEach((item, index) => {\n            if (!indicesPremio.includes(index)) segmentos[index] = {...item, label:'X', multiplier:0, probability:5};\n          });\n        }\n        await pool.query(`UPDATE site_settings SET setting_value=$1,updated_at=CURRENT_TIMESTAMP WHERE setting_key='roulette_segments_json'`,[JSON.stringify(segmentos)]);\n      } else {"""
          if old_migration not in text:
              raise SystemExit("Não encontrei a migração esperada em settings.js.")
          text = text.replace(old_migration, new_migration, 1)
          settings.write_text(text, encoding="utf-8")

          admin = Path("backend/frontend/admin-settings-roleta-editavel.html")
          text = admin.read_text(encoding="utf-8")
          text = text.replace('Prêmios de 2x a 100x', 'Prêmios de 2x a 100x')
          text = text.replace('2x a 100x. O campo <strong>Multiplicador</strong>', '2x a 100x. O campo <strong>Multiplicador</strong>')
          text = text.replace('''    { index: 12, label: "5x", type: "prize", multiplier: 5, probability: 5 },''', '''    { index: 12, label: "3x", type: "prize", multiplier: 3, probability: 15 },''')
          # Update fallback loss/prize probabilities from 5/5 to the requested 15/5 distribution.
          text = re.sub(r'(type: "prize", multiplier: (?:2|3), probability:) 5', r'\1 15', text)
          # Update the visible model description so the admin knows the angle/weight relationship.
          text = text.replace(
              'Cada fatia possui um <strong>peso configurável</strong>. O servidor sorteia proporcionalmente aos pesos salvos.',
              'Cada fatia possui um <strong>peso configurável</strong>. A roleta usa o peso também para o tamanho visual do setor: peso 15 no prêmio e 5 na perda deixa o setor preto 3 vezes maior.'
          )
          admin.write_text(text, encoding="utf-8")

          # Self-delete this temporary workflow after applying the permanent changes.
          workflow = Path(".github/workflows/fix-roulette-weighted.yml")
          workflow.unlink()

      - name: Commit permanent changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html backend/frontend/admin-settings-roleta-editavel.html backend/src/server.js backend/src/settings.js .github/workflows/fix-roulette-weighted.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Set weighted 16-slice roulette"
          git push
