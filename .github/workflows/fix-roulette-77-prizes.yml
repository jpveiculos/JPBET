name: Fix roulette frontend 77 sectors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update roulette frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('backend/frontend/roulette207.html')
          text = path.read_text(encoding='utf-8')

          text, n1 = re.subn(r'(const TOTAL\s*=\s*)90\s*;', r'\g<1>77;', text, count=1)
          if n1 != 1:
              raise SystemExit('frontend TOTAL=90 not found')

          text, n2 = re.subn(r'const PRIZE_INDEXES\s*=\s*\[[^\]]*\];', 'const PRIZE_INDEXES = [0,9,19,28,38,47,57,66,76];', text, count=1)
          if n2 != 1:
              raise SystemExit('frontend PRIZE_INDEXES not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/roulette207.html .github/workflows/fix-roulette-77-prizes.yml
          git diff --cached --quiet && exit 0
          git commit -m "Set roulette frontend to 77 sectors"
          git rm .github/workflows/fix-roulette-77-prizes.yml
          git commit -m "Remove one-time roulette frontend workflow"
          git push
