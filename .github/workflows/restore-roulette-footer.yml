name: Restore roulette and fix player icon

on:
  push:
    paths:
      - 'backend/frontend/roulette-restore-trigger.txt'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore complete roulette page
        run: |
          curl -fsSL "https://raw.githubusercontent.com/jpveiculos/JPBET/b4584586d5a3b0562557efc843dc28492d290a8a/backend/frontend/roulette207.html" -o backend/frontend/roulette207.html
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/roulette207.html')
          s = p.read_text()
          old = """<button
            onclick=\"\n    location.href='/dashboard.html'\n  \"
          >"""
          new = """<button
            onclick=\"\n    location.href='/'\n  \"
          >"""
          if old not in s:
              raise SystemExit('Footer Início não encontrado')
          s = s.replace(old, new, 1)
          old_icon = """<span>\n    ◉\n  </span>\n\n  Área do jogador"""
          new_icon = """<span>\n    👤\n  </span>\n\n  Área do jogador"""
          if old_icon not in s:
              raise SystemExit('Ícone da Área do jogador não encontrado')
          s = s.replace(old_icon, new_icon, 1)
          p.write_text(s)
          PY

      - name: Remove trigger and workflow
        run: |
          rm -f backend/frontend/roulette-restore-trigger.txt .github/workflows/restore-roulette-footer.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/roulette207.html backend/frontend/roulette-restore-trigger.txt .github/workflows/restore-roulette-footer.yml
          git commit -m 'Restaurar roleta e corrigir menu do rodapé [skip ci]'
          git push
