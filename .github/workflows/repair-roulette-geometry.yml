name: Repair roulette geometry

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair geometry block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')
          start = s.rfind('\\nfunction obterGeometriaRoletaPesada')
          end = s.find('\\n</script>', start)
          if start < 0 or end < 0:
              raise SystemExit('Bloco escapado não encontrado.')
          code = '''\nfunction obterGeometriaRoletaPesada(segmentos) {
    /* Geometria visual: 4 prêmios de 67,5° e 4 blocos amarelos de 22,5°.
       As 16 posições lógicas permanecem; cada perda ocupa 7,5° dentro do bloco. */
    const grupos = [
        { prize: 0, losses: [1, 2, 3], start: 0 },
        { prize: 4, losses: [5, 6, 7], start: 90 },
        { prize: 8, losses: [9, 10, 11], start: 180 },
        { prize: 12, losses: [13, 14, 15], start: 270 }
    ];
    const geometria = new Array(16);
    grupos.forEach(({ prize, losses, start }) => {
        geometria[prize] = {
            startDeg: start,
            endDeg: start + 67.5,
            centerDeg: start + 33.75
        };
        losses.forEach((index, pos) => {
            const startDeg = start + 67.5 + pos * 7.5;
            geometria[index] = {
                startDeg,
                endDeg: startDeg + 7.5,
                centerDeg: startDeg + 3.75
            };
        });
    });
    return geometria;
}
'''
          s = s[:start] + code + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          git commit -m "Repair roulette geometry block"
          git push
