name: Corrigir CSS da roleta

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Corrigir CSS literal da roleta') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir CSS literal
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* MYBETS_ROULETTE_CENTER_STYLE */'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start)
              block = s[start:end].replace(r'\n', '\n')
              s = s[:start] + block + s[end:]
              p.write_text(s, encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir CSS literal da roleta"
          git push
