name: Fix roulette logo
on:
  push:
    paths:
      - 'backend/frontend/roulette-logo-trigger.txt'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update roulette page logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/frontend/roulette207.html')
          s=p.read_text(encoding='utf-8')
          old='<header class="top"><div class="brand">My<b>Bets</b></div><div class="balance">'
          new='<header class="top"><div class="brand roulette-top-brand"><span class="roulette-brand-my">My</span><span class="roulette-brand-bets">Bets</span><span class="roulette-brand-line" aria-hidden="true"></span></div><div class="balance">'
          if old not in s:
            raise SystemExit('Logo do topo não encontrado; nenhuma alteração feita.')
          s=s.replace(old,new,1)
          old_css='.brand{font-size:25px;font-weight:900;font-style:italic}.brand b{color:var(--gold)}'
          new_css='.brand{font-size:25px;font-weight:900;font-style:italic}.brand b{color:var(--gold)}.roulette-top-brand{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1;white-space:nowrap;padding-bottom:5px}.roulette-top-brand .roulette-brand-my{color:var(--gold)}.roulette-top-brand .roulette-brand-bets{color:#fff}.roulette-top-brand .roulette-brand-my,.roulette-top-brand .roulette-brand-bets{font-weight:900;font-style:italic}.roulette-brand-line{display:block;width:100%;height:3px;margin-top:4px;border-radius:999px;background:linear-gradient(90deg,transparent,#ffd83d 12%,#ffd83d 88%,transparent);box-shadow:0 1px 6px rgba(255,216,61,.4)}'
          if old_css not in s:
            raise SystemExit('CSS do logo do topo não encontrado; nenhuma alteração feita.')
          s=s.replace(old_css,new_css,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/roulette207.html
          git commit -m 'Padroniza logomarca do topo da roleta'
          git push
      - name: Cleanup
        run: |
          git rm -f .github/workflows/fix-roulette-logo.yml backend/frontend/roulette-logo-trigger.txt || true
          git diff --cached --quiet || git commit -m 'Remove correção temporária da logomarca'
          git push || true
