name: Aplicar modelo final da area do jogador

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  design:
    if: ${{ !contains(github.event.head_commit.message, 'fix: integrar roleta original no card do jogador') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar area do jogador
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')

          # Corrige o cabecalho e elimina duplicacoes visuais criadas em ajustes anteriores.
          s = re.sub(r'<div class="roulette-section-heading">.*?</div>\s*\n\s*<section class="games">', '<div class="roulette-section-heading"><h2 class="section-title">🎰 Roletas</h2><span>GIRE E MULTIPLIQUE</span></div>\n\n    <section class="games">', s, count=1, flags=re.S)

          # Card da roleta: usa um SVG que sera desenhado pelo MESMO algoritmo da roleta real.
          card = '''<article class="game-card roulette-feature-card">
              <div class="roulette-promo">
                  <div class="roulette-promo-copy">
                      <div class="roulette-brand"><i>Roleta</i><strong>MyBets</strong></div>
                      <p>GIRE, DIVIRTA-SE<br>E MULTIPLIQUE<br>SUAS CHANCES!</p>
                      <div class="chip-stack"><span></span><span></span><span></span></div>
                  </div>
                  <div class="roulette-art" aria-label="Roleta MyBets original">
                      <div class="roulette-preview-pointer">▼</div>
                      <div class="roulette-preview-original">
                          <svg id="roulettePreviewSvg" viewBox="0 0 500 500" role="img" aria-label="Roleta MyBets com 16 fatias"></svg>
                      </div>
                  </div>
              </div>
              <h3>Roleta MyBets</h3>
              <button class="game-button" onclick="abrirRoleta('sorte')">▶&nbsp;&nbsp; JOGAR</button>
          </article>'''
          s = re.sub(r'<article class="game-card roulette-feature-card">.*?</article>', card, s, count=1, flags=re.S)

          css = r'''
/* MYBETS_FINAL_ROULETTE_ORIGINAL */
.roulette-feature-card{padding:0 0 16px!important;overflow:hidden;border:1px solid rgba(245,197,66,.72)!important;background:linear-gradient(145deg,#17130a,#090b0e 62%,#111)!important}
.roulette-promo{min-height:355px;display:grid;grid-template-columns:42% 58%;align-items:center;padding:12px 18px 0;background:linear-gradient(120deg,#17140d,#0b0d10 55%,#12120f)}
.roulette-promo-copy{align-self:center;position:relative;height:100%;display:flex;flex-direction:column;justify-content:center}.roulette-brand{font-size:39px;line-height:.9;font-weight:1000;font-style:italic}.roulette-brand i{display:block;color:#f5bd35}.roulette-brand strong{display:block;color:#f4f4f4}.roulette-promo-copy p{color:#bfc3cb;font-size:13px;line-height:1.35;font-weight:800;margin:20px 0 0}.chip-stack{position:absolute;bottom:5px;left:8px;width:120px;height:45px}.chip-stack span{position:absolute;width:55px;height:14px;border:3px solid #dba82b;border-radius:50%;background:#17120a;box-shadow:0 4px 0 #8d6515}.chip-stack span:nth-child(1){left:5px;bottom:4px}.chip-stack span:nth-child(2){left:38px;bottom:14px}.chip-stack span:nth-child(3){left:70px;bottom:3px}
.roulette-art{position:relative;display:grid;place-items:center;height:100%}.roulette-preview-pointer{position:absolute;top:0;z-index:5;color:#ef2929;font-size:42px;line-height:1;text-shadow:none}.roulette-preview-original{position:relative;width:min(250px,45vw);aspect-ratio:1;filter:none}.roulette-preview-original svg{width:100%;height:100%;display:block;overflow:visible}.roulette-preview-original .roulette-label{font-size:58px}.roulette-feature-card h3{padding:0 18px;margin:10px 0 12px;font-size:26px}.roulette-feature-card .game-button{margin:0 18px;width:calc(100% - 36px);min-height:62px;border-radius:18px;font-size:25px;font-weight:1000}
.roulette-section-heading{display:flex;align-items:end;justify-content:space-between;gap:10px}.roulette-section-heading .section-title{margin:26px 0 13px}.roulette-section-heading>span{color:#d9a923;font-size:14px;font-weight:900;letter-spacing:1.5px;padding-bottom:8px;text-align:right}
@media(max-width:600px){.roulette-promo{min-height:315px;padding:8px 8px 0}.roulette-brand{font-size:30px}.roulette-promo-copy p{font-size:11px;margin-top:15px}.roulette-preview-original{width:min(220px,48vw)}.roulette-feature-card h3{font-size:23px}}
'''
          marker = '/* MYBETS_FINAL_ROULETTE_ORIGINAL */'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start)
              s = s[:start] + css + s[end:]
          else:
              s = s.replace('</style>', css + '</style>', 1)

          # Remove the decorative fake wheel code from the previous card while retaining all real roulette code.
          js = r'''

function renderizarPreviewRoletaOriginal() {
    const svg = document.getElementById('roulettePreviewSvg');
    if (!svg) return;
    const segmentos = Array.isArray(ROLETAS?.sorte?.segments) ? ROLETAS.sorte.segments : [];
    if (segmentos.length !== 16) return;
    svg.innerHTML = '';
    const ns = 'http://www.w3.org/2000/svg';
    const cx = 250, cy = 250, radius = 238, angle = 360 / 16;
    const prizeColors = {0:'#35ff78',4:'#3da5ff',8:'#ffc02e',12:'#ff4040'};
    segmentos.forEach((label, index) => {
        const startDeg = index * angle, endDeg = startDeg + angle;
        const isPrize = String(label || '').trim() !== '';
        const group = document.createElementNS(ns, 'g');
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', sectorPath(cx, cy, radius, startDeg, endDeg));
        path.setAttribute('fill', isPrize ? '#080808' : (index % 2 ? '#dca928' : '#c9941f'));
        path.setAttribute('stroke', '#d6a321');
        path.setAttribute('stroke-width', '2');
        group.appendChild(path);
        if (isPrize) {
            const p = polar(cx, cy, 157, startDeg + angle / 2);
            const text = document.createElementNS(ns, 'text');
            const cor = prizeColors[index] || '#25e66b';
            text.textContent = String(label).toUpperCase();
            text.setAttribute('x', p.x); text.setAttribute('y', p.y);
            text.setAttribute('class', 'roulette-label multiplier');
            text.setAttribute('font-size', '58');
            text.setAttribute('fill', cor);
            text.style.fill = cor;
            group.appendChild(text);
        }
        svg.appendChild(group);
    });
    const outerRing = document.createElementNS(ns, 'circle');
    outerRing.setAttribute('cx', cx); outerRing.setAttribute('cy', cy); outerRing.setAttribute('r', radius);
    outerRing.setAttribute('fill', 'none'); outerRing.setAttribute('stroke', '#a66f08'); outerRing.setAttribute('stroke-width', '11');
    svg.appendChild(outerRing);
    const outerHighlight = document.createElementNS(ns, 'circle');
    outerHighlight.setAttribute('cx', cx); outerHighlight.setAttribute('cy', cy); outerHighlight.setAttribute('r', radius - 7);
    outerHighlight.setAttribute('fill', 'none'); outerHighlight.setAttribute('stroke', '#f5d66a'); outerHighlight.setAttribute('stroke-width', '2');
    svg.appendChild(outerHighlight);
}
'''
          if 'function renderizarPreviewRoletaOriginal()' not in s:
              s = s.replace('\n</script>', js + '\n</script>', 1)

          # Depois de carregar as configuracoes, redesenha o preview com a mesma configuracao da roleta real.
          if 'renderizarPreviewRoletaOriginal();' not in s:
              s = s.replace('        aplicarConfiguracoes();\n', '        aplicarConfiguracoes();\n        renderizarPreviewRoletaOriginal();\n', 1)
          if 'document.addEventListener("DOMContentLoaded", () => renderizarPreviewRoletaOriginal());' not in s:
              s = s.replace('\n</script>', '\ndocument.addEventListener("DOMContentLoaded", () => renderizarPreviewRoletaOriginal());\n</script>', 1)

          p.write_text(s, encoding='utf-8')

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: integrar roleta original no card do jogador"
          git push
