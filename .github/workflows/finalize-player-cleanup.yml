name: Finalizar limpeza do jogador

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'Aplicar deduplicação do jogador') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover duplicações
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')
          for marker in ('/* MYBETS_PLAYER_CLEANUP */', '/* MYBETS_ROULETTE_CENTER_STYLE */'):
              positions = [m.start() for m in re.finditer(re.escape(marker), s)]
              for pos in reversed(positions[1:]):
                  end = s.find('</style>', pos)
                  if end != -1:
                      s = s[:pos] + s[end:]
          pattern = r'\s*<button class="player-back-button" type="button" onclick="voltarPaginaMyBets\(\)" aria-label="Voltar">←</button>'
          matches = list(re.finditer(pattern, s))
          for m in reversed(matches[1:]):
              s = s[:m.start()] + s[m.end():]
          marker = '/* MYBETS_ROULETTE_CENTER_STYLE */'
          if marker in s:
              start = s.index(marker)
              end = s.index('</style>', start)
              block = s[start:end].replace(r'\n', '\n')
              s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aplicar deduplicação do jogador"
          git push
