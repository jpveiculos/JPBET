name: Final roulette fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply roulette correction
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
          rm -f .github/workflows/align-roulette-pointer.yml .github/workflows/fix-roulette-start.yml .github/workflows/repair-roulette-geometry.yml .github/workflows/repair-roulette-geometry-2.yml .github/workflows/repair-roulette-geometry-3.yml .github/workflows/finalize-roulette-alignment.yml .github/workflows/final-roulette-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix roulette pointer alignment"
          git push
