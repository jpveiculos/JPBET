name: Ajustar logo principal
on: push
jobs:
  ajuste:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir cores da logomarca principal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/frontend/index.html')
          s=p.read_text(encoding='utf-8')
          old='''.brand-main{\n  position:relative;\n  display:inline-block;\n  padding-bottom:7px;\n  font-size:29px;\n  font-weight:950;\n  letter-spacing:-1.5px;\n  color:var(--gold)\n}'''
          new='''.brand-main{\n  position:relative;\n  display:inline-block;\n  padding-bottom:7px;\n  font-size:29px;\n  font-weight:950;\n  letter-spacing:-1.5px;\n  color:#fff\n}'''
          if old not in s: raise SystemExit('Bloco .brand-main nao encontrado')
          s=s.replace(old,new,1)
          old2='''.brand-main span{\n  color:#fff\n}'''
          new2='''.brand-main span{\n  color:var(--gold)\n}'''
          if old2 not in s: raise SystemExit('Bloco .brand-main span nao encontrado')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/index.html
          git commit -m 'Ajusta cores da logo MyBets principal'
          git push origin main
          git rm -f .github/workflows/ajustar-logo-principal.yml
          git commit -m 'Remove workflow temporario da logo principal'
          git push origin main
