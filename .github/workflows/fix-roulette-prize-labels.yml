name: Fix roulette prize labels

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update roulette labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/frontend/roulette207.html')
          text = path.read_text(encoding='utf-8')

          old_font = """      text.setAttribute(\n        'font-size',\n        '14'\n      );"""
          new_font = """      text.setAttribute(\n        'font-size',\n        '22'\n      );"""

          if old_font not in text:
              raise SystemExit('font-size target not found')
          text = text.replace(old_font, new_font, 1)

          old_weight = """      text.setAttribute(\n        'font-weight',\n        '900'\n      );"""
          new_weight = """      text.setAttribute(\n        'font-weight',\n        '1000'\n      );"""
          if old_weight not in text:
              raise SystemExit('font-weight target not found')
          text = text.replace(old_weight, new_weight, 1)

          old_y = """      text.setAttribute(\n        'y',\n        y\n      );"""
          new_y = old_y + """\n\n      /*\n       * Mantém cada prêmio preso ao seu próprio eixo visual.\n       * Como o SVG inteiro acompanha a rotação da roleta,\n       * o texto gira junto em todos os frames, sem giro\n       * separado ou correção brusca quando a roleta para.\n       */\n      text.setAttribute(\n        'transform',\n        `rotate(${center} ${x} ${y})`\n      );"""
          if old_y not in text:
              raise SystemExit('text y target not found')
          text = text.replace(old_y, new_y, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/roulette207.html .github/workflows/fix-roulette-prize-labels.yml
          git diff --cached --quiet && exit 0
          git commit -m "Adjust roulette prize labels"
          git rm .github/workflows/fix-roulette-prize-labels.yml
          git commit -m "Remove one-time roulette fix workflow"
          git push