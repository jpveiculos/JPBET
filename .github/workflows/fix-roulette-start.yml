name: Fix roulette start alignment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set initial roulette rotation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')
          old = "wheel.style.transform = 'rotate(0deg)';\n    roletaRotacaoAtual = 0;\n};\n\nanimarRoleta = function"
          new = "wheel.style.transform = 'rotate(-33.75deg)';\n    roletaRotacaoAtual = -33.75;\n};\n\nanimarRoleta = function"
          if old not in s:
              raise SystemExit('Trecho de inicialização da roleta não encontrado.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          git commit -m "Align roulette start with prize center"
          git push
