name: Remove menu da roleta

on:
  push:
    paths:
      - 'backend/frontend/remove-menu-roleta.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover Menu do site da roleta
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/roulette207.html')
          s = p.read_text()
          import re
          # Remove somente o botão "Menu do site" do rodapé.
          s, n = re.subn(r'\n*<button[^>]*>\s*<span>\s*☰\s*</span>\s*Menu do site\s*</button>\s*', '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Botão Menu do site não encontrado: {n}')
          # Remove o painel/overlay do menu e seu script auxiliar, se existir.
          s, n2 = re.subn(r'\n*<div id="siteMenuOverlay"[\s\S]*?</div>\s*<script>\s*function openSiteMenu\(\)[\s\S]*?</script>\s*', '\n', s, count=1)
          # Caso o overlay esteja na versão com IIFE, remove do overlay até o fechamento do script seguinte.
          if n2 == 0:
              s, n2 = re.subn(r'\n*<div id="siteMenuOverlay"[\s\S]*?</script>\s*', '\n', s, count=1)
          p.write_text(s)
          Path('backend/frontend/remove-menu-roleta.trigger').unlink(missing_ok=True)
          Path('.github/workflows/remove-menu-roleta.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/roulette207.html backend/frontend/remove-menu-roleta.trigger .github/workflows/remove-menu-roleta.yml
          git commit -m 'Remover menu do rodape da roleta [skip ci]'
          git push
