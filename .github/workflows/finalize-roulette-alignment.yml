name: Finalize roulette alignment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final roulette fix
        run: |
          echo ''.decode() if False else ''
          python3 -c "import base64,pathlib;p=pathlib.Path('backend/frontend/dashboard.html');s=p.read_text(encoding='utf-8');a=s.rfind(r'\\nfunction obterGeometriaRoletaPesada');b=s.find(r'\\n</script>',a);c=base64.b64decode('').decode();p.write_text(s[:a]+c+s[b:],encoding='utf-8')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          git diff --cached --quiet || git commit -m "Finalize roulette pointer alignment"
          git push
