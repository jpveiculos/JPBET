name: Finalize roulette alignment

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final roulette fix
        run: echo '' | base64 -d > /tmp/fix.py && python3 /tmp/fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          git diff --cached --quiet || git commit -m "Finalize roulette pointer alignment"
          git push
