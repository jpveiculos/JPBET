name: Fix roulette static page

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix page layout stability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/roulette207.html')
          s = p.read_text(encoding='utf-8')
          old = "html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 18%,#18212c 0,#070c12 34%,#020509 76%);color:#fff;font-family:Arial,Helvetica,sans-serif}\nbody{padding-bottom:78px}.wrap{width:min(720px,100%);margin:auto;padding:0 12px 30px}"
          new = "html,body{margin:0;width:100%;min-width:100%;min-height:100%;background:radial-gradient(circle at 50% 18%,#18212c 0,#070c12 34%,#020509 76%);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}\nhtml{overflow-x:hidden;overscroll-behavior-x:none}\nbody{width:100%;padding-bottom:78px;position:relative;overscroll-behavior-x:none}\n.wrap{width:100%;max-width:720px;min-width:0;margin:0 auto;padding:0 12px 30px;contain:layout style}\n.game{width:100%;min-width:0}\n.wheel-box,.controls{flex:none;contain:layout}\n"
          if old not in s:
              raise SystemExit('Trecho CSS esperado não encontrado; nenhuma alteração feita.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit corrected page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/roulette207.html
          git diff --cached --quiet && exit 0
          git commit -m "Mantém página da roleta estática"
          git push origin main

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-roulette-static-page.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Remove workflow temporário da roleta"
          git push origin main || true
