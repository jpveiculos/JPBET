name: Atualizar marca MyBets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename-brand:
    if: ${{ !contains(github.event.head_commit.message, 'Atualizar marca MyBets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Substituir nome da marca
        shell: python
        run: |
          from pathlib import Path

          substituicoes = {
              'JPBET': 'MyBets',
              'MayBets': 'MyBets',
              'Maybets': 'MyBets',
              'JP-BET': 'MyBets',
              'JP Bet': 'MyBets',
          }

          ignorar = {'.git', 'node_modules'}
          extensoes_texto = {
              '.html', '.css', '.js', '.json', '.md', '.txt', '.sql',
              '.yml', '.yaml', '.env.example', '.xml', '.svg'
          }

          alterados = []
          for caminho in Path('.').rglob('*'):
              if not caminho.is_file() or any(parte in ignorar for parte in caminho.parts):
                  continue
              if caminho.name in {'rename-brand-mybes.yml', 'navigation.js'}:
                  continue
              if caminho.suffix.lower() not in extensoes_texto:
                  continue

              try:
                  texto = caminho.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              novo = texto
              for antigo, atual in substituicoes.items():
                  novo = novo.replace(antigo, atual)

              if novo != texto:
                  caminho.write_text(novo, encoding='utf-8')
                  alterados.append(str(caminho))

          print('Arquivos alterados:')
          for arquivo in alterados:
              print(arquivo)

      - name: Ajustar área do jogador
        shell: python
        run: |
          from pathlib import Path
          import re

          caminho = Path('backend/frontend/dashboard.html')
          texto = caminho.read_text(encoding='utf-8')

          # Corrige o bloco CSS que ficou com caracteres literais \\n          marcador = '/* MYBETS_ROULETTE_CENTER_STYLE */'
          if marcador in texto:
              inicio = texto.index(marcador)
              fim = texto.index('</style>', inicio)
              bloco = texto[inicio:fim].replace('\\\\n', '\\n')
              texto = texto[:inicio] + bloco + texto[fim:]

          # Cabeçalho: somente logo + menu. O saldo fica na área principal.
          texto = re.sub(
              r'<div class="logo">MyBets</div>',
              '<a class="logo" href="/" aria-label="MyBets início">MyBets</a>',
              texto,
              count=1
          )
          texto = re.sub(r'\s*<div class="header-balance" id="headerBalance">.*?</div>', '', texto, count=1, flags=re.S)
          texto = texto.replace(
              '<div class="header-right">\n        <button class="menu-button"',
              '<div class="header-right">\n        <span id="headerBalance" style="display:none">0,00</span>\n        <button class="menu-button"',
              1
          )

          # Botão voltar sempre disponível na área do jogador.
          texto = texto.replace(
              '<div class="header-right">',
              '<button class="player-back-button" type="button" onclick="voltarPaginaMyBets()" aria-label="Voltar">←</button>\n\n    <div class="header-right">',
              1
          )

          # Remove textos de apresentação/informativos do topo.
          texto = re.sub(r'\s*<p>Bem-vindo ao MyBets\.</p>', '', texto, count=1)
          texto = re.sub(r'\s*<div class="balance-description">.*?</div>', '', texto, count=1, flags=re.S)
          texto = re.sub(r'\s*<div class="reserved-box" id="reservedBalanceBox">.*?</div>\s*', '\n', texto, count=1, flags=re.S)

          # Troca o cartão de saldo/bônus por um painel visual direto.
          novo_cartao = '''<section class="balance-card">\n\n        <div class="balance-summary">\n            <div class="balance-stat">\n                <span>Saldo</span>\n                <strong id="mainBalance">0,00</strong>\n            </div>\n\n            <div class="balance-stat bonus-stat">\n                <span>Bônus</span>\n                <strong id="bonusBalanceValue">0,00</strong>\n            </div>\n        </div>\n\n        <div class="balance-actions">\n            <button class="primary-button" onclick="abrirDeposito()">+ Depositar</button>\n            <button class="secondary-button" onclick="abrirSaque()">Sacar</button>\n        </div>\n\n    </section>'''
          texto = re.sub(r'<section class="balance-card">.*?</section>', novo_cartao, texto, count=1, flags=re.S)

          # Remove a caixa de informação geral do jogador.
          texto = re.sub(r'\s*<section class="info">.*?</section>', '', texto, count=1, flags=re.S)

          # Roleta como card visual; jogos futuros continuam empilhados.
          texto = texto.replace('<div class="game-icon">🎡</div>', '<div class="roulette-preview" aria-label="Roleta MyBets"><div class="roulette-preview-wheel"><span>MyBets</span></div></div>', 1)
          texto = texto.replace('<h3>Roda da Sorte</h3>', '<h3>Roleta MyBets</h3>', 1)
          texto = texto.replace('<p>Faça sua aposta e gire a roda.</p>', '', 1)

          css = '''\n/* MYBETS_PLAYER_CLEANUP */\n.logo {\n    text-decoration: none !important;\n    color: var(--gold) !important;\n    font-style: italic;\n    font-weight: 1000;\n    letter-spacing: -1px;\n    text-shadow: 0 2px 7px rgba(245,197,66,.22);\n}\n.player-back-button {\n    border: 1px solid rgba(245,197,66,.22);\n    background: rgba(245,197,66,.06);\n    color: var(--gold2);\n    border-radius: 10px;\n    width: 38px; height: 38px;\n    font-size: 22px;\n    font-weight: 900;\n}\n.balance-card { padding: 18px; }\n.balance-summary {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 10px;\n}\n.balance-stat {\n    min-width: 0;\n    padding: 15px;\n    border-radius: 16px;\n    background: rgba(255,255,255,.035);\n    border: 1px solid rgba(245,197,66,.18);\n}\n.balance-stat span {\n    display: block;\n    color: var(--muted);\n    font-size: 13px;\n    margin-bottom: 5px;\n}\n.balance-stat strong {\n    display: block;\n    color: var(--gold2);\n    font-size: clamp(25px, 7vw, 38px);\n    font-weight: 1000;\n}\n.bonus-stat strong { color: #d9ad36; }\n.roulette-preview {\n    display: flex; justify-content: center; align-items: center;\n    margin-bottom: 12px;\n}\n.roulette-preview-wheel {\n    width: 118px; height: 118px; border-radius: 50%;\n    border: 7px solid #c99520;\n    background: conic-gradient(#090909 0deg 22.5deg,#d7a126 22.5deg 45deg,#090909 45deg 67.5deg,#d7a126 67.5deg 90deg,#090909 90deg 112.5deg,#d7a126 112.5deg 135deg,#090909 135deg 157.5deg,#d7a126 157.5deg 180deg,#090909 180deg 202.5deg,#d7a126 202.5deg 225deg,#090909 225deg 247.5deg,#d7a126 247.5deg 270deg,#090909 270deg 292.5deg,#d7a126 292.5deg 315deg,#090909 315deg 337.5deg,#d7a126 337.5deg 360deg);\n    display: flex; align-items: center; justify-content: center;\n    box-shadow: 0 0 0 4px #5c3b0b, 0 10px 25px rgba(0,0,0,.5);\n}\n.roulette-preview-wheel::before {\n    content: ""; width: 48px; height: 48px; border-radius: 50%;\n    background: radial-gradient(circle,#292929,#050505 72%);\n    border: 3px solid #d89a12;\n    position: absolute;\n}\n.roulette-preview-wheel span {\n    position: relative; z-index: 1; color: #f7f7f7; font-style: italic;\n    font-size: 12px; font-weight: 1000;\n}\n.games { grid-template-columns: 1fr; }\n@media (max-width: 760px) {\n    .balance-summary { grid-template-columns: 1fr 1fr; }\n}\n'''
          texto = texto.replace('</style>', css + '</style>', 1)

          # Navegação comum: volta + logo clicável na página principal.
          if '<script src="/navigation.js"></script>' not in texto:
              texto = texto.replace('</body>', '  <script src="/navigation.js"></script>\n</body>', 1)

          caminho.write_text(texto, encoding='utf-8')

      - name: Aplicar navegação às demais páginas
        shell: python
        run: |
          from pathlib import Path

          for caminho in Path('backend/frontend').glob('*.html'):
              if caminho.name == 'dashboard.html':
                  continue
              texto = caminho.read_text(encoding='utf-8')
              if '<script src="/navigation.js"></script>' not in texto:
                  texto = texto.replace('</body>', '  <script src="/navigation.js"></script>\n</body>', 1)
                  caminho.write_text(texto, encoding='utf-8')

      - name: Publicar alteração da marca
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git commit -m "Atualizar marca MyBets"
          git push
