name: Atualizar marca MyBets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename-brand:
    if: ${{ !contains(github.event.head_commit.message, 'Atualizar marca MyBets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Substituir nome da marca
        shell: python
        run: |
          from pathlib import Path

          substituicoes = {
              'JPBET': 'MyBets',
              'MayBets': 'MyBets',
              'Maybets': 'MyBets',
              'JP-BET': 'MyBets',
              'JP Bet': 'MyBets',
          }

          ignorar = {'.git', 'node_modules'}
          extensoes_texto = {
              '.html', '.css', '.js', '.json', '.md', '.txt', '.sql',
              '.yml', '.yaml', '.env.example', '.xml', '.svg'
          }

          alterados = []
          for caminho in Path('.').rglob('*'):
              if not caminho.is_file() or any(parte in ignorar for parte in caminho.parts):
                  continue
              if caminho.name == 'rename-brand-mybes.yml':
                  continue
              if caminho.suffix.lower() not in extensoes_texto:
                  continue

              try:
                  texto = caminho.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              novo = texto
              for antigo, atual in substituicoes.items():
                  novo = novo.replace(antigo, atual)

              if novo != texto:
                  caminho.write_text(novo, encoding='utf-8')
                  alterados.append(str(caminho))

          print('Arquivos alterados:')
          for arquivo in alterados:
              print(arquivo)

      - name: Corrigir alinhamento da roleta
        shell: python
        run: |
          from pathlib import Path

          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')

          # Remove eventual função duplicada malformada com \n literal.
          marker = r'\nfunction obterGeometriaRoletaPesada'
          pos = s.rfind(marker)
          if pos >= 0:
              end = s.find(r'\n</script>', pos)
              if end < 0:
                  raise SystemExit('Fechamento do script não encontrado.')
              s = s[:pos] + s[end:]

          old = """function obterGeometriaRoletaPesada(segmentos) {
              const pesos = segmentos.map(item => String(item || '').trim() !== '' ? 3 : 1);
              const total = pesos.reduce((sum, peso) => sum + peso, 0) || 1;
              let cursor = 0;
              return segmentos.map((item, index) => {
                  const startDeg = cursor;
                  const endDeg = index === segmentos.length - 1 ? 360 : cursor + (pesos[index] / total) * 360;
                  cursor = endDeg;
                  return { startDeg, endDeg, centerDeg: startDeg + (endDeg - startDeg) / 2 };
              });
          }"""

          new = """function obterGeometriaRoletaPesada(segmentos) {
              const grupos = [
                  { prize: 0, losses: [1, 2, 3], start: 0 },
                  { prize: 4, losses: [5, 6, 7], start: 90 },
                  { prize: 8, losses: [9, 10, 11], start: 180 },
                  { prize: 12, losses: [13, 14, 15], start: 270 }
              ];
              const geometria = new Array(16);
              grupos.forEach(({ prize, losses, start }) => {
                  geometria[prize] = {
                      startDeg: start,
                      endDeg: start + 67.5,
                      centerDeg: start + 33.75
                  };
                  losses.forEach((index, pos) => {
                      const startDeg = start + 67.5 + pos * 7.5;
                      geometria[index] = {
                          startDeg,
                          endDeg: startDeg + 7.5,
                          centerDeg: startDeg + 3.75
                      };
                  });
              });
              return geometria;
          }"""

          if old not in s:
              raise SystemExit('Função antiga não encontrada.')
          s = s.replace(old, new, 1)

          needle = "wheel.style.transform = 'rotate(0deg)';\n    roletaRotacaoAtual = 0;\n};\n\nanimarRoleta = function"
          replacement = "wheel.style.transform = 'rotate(-33.75deg)';\n    roletaRotacaoAtual = -33.75;\n};\n\nanimarRoleta = function"
          if needle not in s:
              raise SystemExit('Inicialização da roleta não encontrada.')
          s = s.replace(needle, replacement, 1)

          p.write_text(s, encoding='utf-8')
          print('Alinhamento da roleta corrigido.')

      - name: Remover workflows temporários
        shell: bash
        run: |
          rm -f .github/workflows/align-roulette-pointer.yml \
                .github/workflows/fix-roulette-start.yml \
                .github/workflows/repair-roulette-geometry.yml \
                .github/workflows/repair-roulette-geometry-2.yml \
                .github/workflows/repair-roulette-geometry-3.yml \
                .github/workflows/finalize-roulette-alignment.yml \
                .github/workflows/final-roulette-fix.yml \
                .github/workflows/do-roulette-fix.yml

      - name: Publicar alteração da marca e roleta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git commit -m "Atualizar marca MyBets"
          git push
