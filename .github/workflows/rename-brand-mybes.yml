name: Atualizar marca MyBets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rename-brand:
    if: ${{ !contains(github.event.head_commit.message, 'Atualizar marca MyBets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Substituir nome da marca
        shell: python
        run: |
          from pathlib import Path
          substituicoes={'JPBET':'MyBets','MayBets':'MyBets','Maybets':'MyBets','JP-BET':'MyBets','JP Bet':'MyBets'}
          ignorar={'.git','node_modules'}
          extensoes={'.html','.css','.js','.json','.md','.txt','.sql','.yml','.yaml','.xml','.svg'}
          alterados=[]
          for caminho in Path('.').rglob('*'):
              if not caminho.is_file() or any(parte in ignorar for parte in caminho.parts): continue
              if caminho.name in {'rename-brand-mybes.yml','navigation.js','player-design.js'} or caminho.suffix.lower() not in extensoes: continue
              try: texto=caminho.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              novo=texto
              for antigo,atual in substituicoes.items(): novo=novo.replace(antigo,atual)
              if novo!=texto:
                  caminho.write_text(novo,encoding='utf-8');alterados.append(str(caminho))
          print('Arquivos alterados:',alterados)
      - name: Integrar roleta aprovada no arquivo original
        shell: python
        run: |
          from pathlib import Path

          NEW_SEG = [
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"5x","type":"prize","multiplier":5,"probability":15},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"10x","type":"prize","multiplier":10,"probability":15},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"2x","type":"prize","multiplier":2,"probability":15},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"","type":"zero","multiplier":0,"probability":5},
            {"label":"3x","type":"prize","multiplier":3,"probability":15},
            {"label":"","type":"zero","multiplier":0,"probability":5}
          ]

          OLD_SEG = [
            {"label":"2x","type":"prize","multiplier":2,"probability":15},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"3x","type":"prize","multiplier":3,"probability":15},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"2x","type":"prize","multiplier":2,"probability":15},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"3x","type":"prize","multiplier":3,"probability":15},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5},
            {"label":"X","type":"zero","multiplier":0,"probability":5}
          ]

          new_json = __import__('json').dumps(NEW_SEG,separators=(',',':'),ensure_ascii=False)
          old_json = __import__('json').dumps(OLD_SEG,separators=(',',':'),ensure_ascii=False)

          p=Path('backend/src/settings.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('const segmentosRoletaPadrao = [')
          end=s.index('\n];',start)+3
          block='const segmentosRoletaPadrao = [\n' + ',\n'.join('  '+str(x).replace("'",'"') for x in NEW_SEG) + '\n];'
          s=s[:start]+block+s[end:]
          marker='// MYBETS_ROULETTE_DB_MIGRATION_V1'
          if marker not in s:
              needle='    for (const [key,value] of configuracoesPadrao) {\n      await pool.query(`INSERT INTO site_settings(setting_key,setting_value) VALUES($1,$2) ON CONFLICT(setting_key) DO NOTHING`,[key,value]);\n    }'
              repl=needle+"\n    "+marker+"\n    await pool.query(`UPDATE site_settings SET setting_value=$1, updated_at=CURRENT_TIMESTAMP WHERE setting_key='roulette_segments_json' AND setting_value=$2`, [JSON.stringify(segmentosRoletaPadrao), " + repr(old_json) + "]);"
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          p=Path('backend/src/server.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('const ROULETTE_DEFAULT_SEGMENTS = [')
          end=s.index('\n];',start)+3
          block='const ROULETTE_DEFAULT_SEGMENTS = [\n' + ',\n'.join('  { index: '+str(i)+', label: '+repr(x['label']).replace("'",'\"')+', type: '+repr(x['type']).replace("'",'\"')+', multiplier: '+str(x['multiplier'])+', probability: '+str(x['probability'])+' }' for i,x in enumerate(NEW_SEG)) + '\n];'
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')

          p=Path('backend/frontend/dashboard.html')
          s=p.read_text(encoding='utf-8')
          marker='MYBETS_ROULETTE_REFERENCE_V1'
          if marker not in s:
              injection=r'''<style id="mybets-roulette-reference-v1">
#rouletteModal{background:rgba(2,7,14,.90)!important;padding:0!important}
#rouletteModal .modal-content{width:min(1000px,calc(100vw - 20px))!important;max-width:calc(100vw - 20px)!important;max-height:96vh!important;padding:10px 20px 22px!important;border:1px solid #1f2b3a!important;border-radius:24px!important;background:radial-gradient(circle at 50% 20%,#172130 0%,#0a0f17 55%,#05080d 100%)!important;box-shadow:0 18px 50px rgba(0,0,0,.65)!important}
#rouletteModal .close{top:10px!important;right:12px!important;width:58px!important;height:58px!important;border-radius:18px!important;background:#1b2330!important;border:1px solid #344154!important;color:#fff!important;font-size:38px!important;font-weight:300!important;line-height:1!important}
#rouletteModal .modal-title,#rouletteModal .modal-subtitle,#rouletteModal .rules,#rouletteModal .roulette-explanation{display:none!important}
#rouletteModal .roulette-area{width:min(850px,88vw)!important;margin:0 auto 12px!important;filter:none!important}
#rouletteModal #wheel{filter:none!important;transform-origin:50% 50%!important}
#rouletteModal #rouletteSvg{width:100%!important;height:100%!important}
#rouletteModal .roulette-center-cover{width:39%!important;border:5px solid #e1a817!important;box-shadow:0 0 0 2px #654309!important;background:radial-gradient(circle at 45% 35%,#2a2a2a 0%,#0d0d0d 58%,#030303 100%)!important}
#rouletteModal .roulette-center-button{width:31%!important;min-width:0!important;max-width:none!important;border:5px solid #e2aa18!important;box-shadow:0 0 0 2px #69460a,inset 0 0 14px rgba(255,198,44,.08),0 8px 18px rgba(0,0,0,.6)!important;background:radial-gradient(circle at 45% 35%,#282828 0%,#090909 72%)!important;color:#ffd43d!important;font-size:clamp(19px,4vw,28px)!important;line-height:1!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:5px!important}
#rouletteModal .roulette-center-button::before{content:'MyBets'!important;display:block!important;font-size:clamp(21px,4.5vw,34px)!important;font-style:italic!important;font-weight:1000!important;letter-spacing:-1.5px!important;color:#fff!important;line-height:1!important;margin:0!important}
#rouletteModal .roulette-center-button::after{content:''!important;display:block!important;width:42%!important;height:3px!important;border-radius:50%!important;background:#f1bf38!important;transform:skewX(-18deg)!important}
#rouletteModal .pointer{top:-4px!important;width:64px!important;height:82px!important;background:linear-gradient(145deg,#fff2a8,#f8bd25 58%,#9b5b00)!important;clip-path:polygon(3% 0,97% 0,79% 57%,50% 100%,21% 57%)!important;filter:drop-shadow(0 5px 6px rgba(0,0,0,.9))!important}
#rouletteModal .pointer::before{left:50%!important;top:7px!important;width:49px!important;height:62px!important;background:#151515!important;clip-path:polygon(4% 0,96% 0,79% 57%,50% 100%,21% 57%)!important}
#rouletteModal .pointer::after{left:50%!important;top:12px!important;width:38px!important;height:49px!important;background:#ff3131!important;clip-path:polygon(0 0,100% 0,50% 100%)!important}
#rouletteModal .roulette-label.multiplier{fill:#27ef72!important;stroke:#04130a!important;stroke-width:4px!important;font-size:58px!important;font-weight:1000!important}
#rouletteModal .bet-area{margin:4px 18px 0!important}
#rouletteModal .input-label{font-size:18px!important;color:#8f99aa!important;margin-bottom:7px!important}
#rouletteModal #betAmount{min-height:66px!important;width:100%!important;border:2px solid #394456!important;border-radius:17px!important;background:#080d14!important;color:#f6f7fa!important;padding:16px 72px 16px 28px!important;font-size:25px!important}
#rouletteModal .mybets-currency-fix{position:absolute;right:23px;top:50%;transform:translateY(-50%);color:#8e97a8;font-size:25px;pointer-events:none}
#rouletteModal .mybets-bet-wrap{position:relative;width:100%}
#rouletteModal .quick-values{grid-template-columns:repeat(3,1fr)!important;gap:10px!important;margin-top:12px!important}
#rouletteModal .quick-button{min-height:57px!important;border:2px solid #d6a526!important;border-radius:15px!important;background:#1a2029!important;color:#fff!important;font-size:21px!important;font-weight:900!important;box-shadow:none!important}
#rouletteModal .roulette-result{min-height:125px!important;margin:20px 0 0!important;padding:22px 14px!important;border-radius:22px!important;background:#151d28!important;border:0!important;color:#fff!important;text-align:center!important}
#rouletteModal .roulette-result strong{font-size:46px!important;color:#fff!important}
#rouletteModal .roulette-result span,#rouletteModal .roulette-result small{display:block!important;margin-top:10px!important;color:#ffd43d!important;font-size:20px!important;font-weight:900!important}
@media(max-width:600px){#rouletteModal .modal-content{padding:8px 8px 18px!important}#rouletteModal .roulette-area{width:min(900px,92vw)!important;margin-bottom:8px!important}#rouletteModal .close{width:52px!important;height:52px!important;font-size:34px!important}#rouletteModal .pointer{width:55px!important;height:70px!important}#rouletteModal .pointer::before{width:42px!important;height:54px!important}#rouletteModal .pointer::after{width:32px!important;height:42px!important}#rouletteModal .bet-area{margin-left:10px!important;margin-right:10px!important}#rouletteModal #betAmount{min-height:61px!important;font-size:22px!important;padding-left:20px!important}.quick-button{min-height:53px!important;font-size:20px!important}}
</style>
<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const prizes={2:'5x',6:'10x',10:'2x',14:'3x'};
const gold=new Set([0,4,8,12]);
const ANG=360/16;
let rotation=0;
function polar(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)}}
function path(cx,cy,r,a0,a1){const p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1);return `M ${cx} ${cy} L ${p0.x} ${p0.y} A ${r} ${r} 0 0 1 ${p1.x} ${p1.y} Z`}
function desenhar(){
 const wheel=document.getElementById('wheel'),svg=document.getElementById('rouletteSvg');
 if(!wheel||!svg)return;
 svg.innerHTML='';svg.setAttribute('viewBox','0 0 500 500');svg.setAttribute('preserveAspectRatio','xMidYMid meet');
 for(let i=0;i<16;i++){
  const g=document.createElementNS(NS,'g');g.classList.add('roulette-sector');
  const p=document.createElementNS(NS,'path');p.setAttribute('d',path(250,250,238,i*ANG-ANG/2,(i+1)*ANG-ANG/2));p.setAttribute('fill',gold.has(i)?'#dca72a':'#050505');p.setAttribute('stroke','#e0ad2a');p.setAttribute('stroke-width','2');g.appendChild(p);
  if(prizes[i]){const q=polar(250,250,166,i*ANG);const t=document.createElementNS(NS,'text');t.textContent=prizes[i];t.setAttribute('x',q.x);t.setAttribute('y',q.y);t.setAttribute('class','roulette-label multiplier');t.setAttribute('font-size','58');t.setAttribute('font-weight','1000');t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');g.appendChild(t)}
  svg.appendChild(g)
 }
 const outer=document.createElementNS(NS,'circle');outer.setAttribute('cx','250');outer.setAttribute('cy','250');outer.setAttribute('r','238');outer.setAttribute('fill','none');outer.setAttribute('stroke','#f3bd36');outer.setAttribute('stroke-width','10');svg.appendChild(outer);
 wheel.style.transition='none';wheel.style.transform=`rotate(${rotation}deg)`;
}
function animar(indice){
 const wheel=document.getElementById('wheel');if(!wheel)return;
 let i=Number(indice);if(!Number.isInteger(i)||i<0||i>15)i=0;
 const alvo=-i*ANG;const atual=((rotation%360)+360)%360;const modulo=((alvo%360)+360)%360;let delta=modulo-atual;if(delta<0)delta+=360;const destino=rotation+5*360+delta;const duracao=Math.max(1400,Number(window.configuracoes?.roulette_animation_ms)||1800);
 wheel.style.transition=`transform ${duracao}ms cubic-bezier(.17,.67,.16,1)`;wheel.style.transform=`rotate(${destino}deg)`;
 return new Promise(resolve=>setTimeout(()=>{rotation=destino;wheel.style.transition='none';wheel.style.transform=`rotate(${rotation}deg)`;resolve()},duracao+80));
}
function aplicar(){
 const btn=document.getElementById('spinButton'),bet=document.getElementById('betAmount');
 if(!document.getElementById('rouletteSvg'))return;
 const wrap=bet?.parentElement;if(bet&&wrap&&!wrap.classList.contains('mybets-bet-wrap')){const w=document.createElement('div');w.className='mybets-bet-wrap';bet.parentNode.insertBefore(w,bet);w.appendChild(bet);const c=document.createElement('span');c.className='mybets-currency-fix';c.textContent='R$';w.appendChild(c)}
 if(btn){btn.textContent='GIRAR';btn.setAttribute('aria-label','GIRAR MyBets')}
 if(window.ROLETAS?.sorte)window.ROLETAS.sorte.segments=Object.keys(prizes).sort((a,b)=>a-b).map(Number).map(i=>({label:prizes[i],type:'prize',multiplier:Number(prizes[i].replace('x','')),probability:15}));
 desenhar();
 window.animarRoleta=animar;
}
window.criarRoda=desenhar;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(aplicar,0));else setTimeout(aplicar,0);
setTimeout(aplicar,250);
})();
</script>'''
              s=s.replace('</body>',injection+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          print('Roleta original atualizada.')
      - name: Publicar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar roleta MyBets"
          git push
