name: Atualizar marca MyBets
"on":
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, 'Atualizar marca MyBets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir dashboard original
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          subprocess.run([
              'git','checkout','62a3f5a845d5d4badef46dc9ba173c7287047a80',
              '--','backend/frontend/dashboard.html'
          ], check=True)

          p = Path('backend/frontend/dashboard.html')
          s = p.read_text(encoding='utf-8')

          # Remove somente o override compacto que trocava o ponteiro moderno por um triângulo pequeno.
          inicio = s.find('/* Ponteiro compacto da roleta de 16 fatias */')
          fim = s.find('/* MYBETS_FINAL_PLAYER_DESIGN */', inicio)
          if inicio >= 0 and fim > inicio:
              s = s[:inicio] + s[fim:]

          # 16 fatias: 5X superior direito, 10X inferior direito,
          # 2X inferior esquerdo e 3X superior esquerdo.
          segmentos = '''segments: [
              "", "", "5X", "",
              "", "", "10X", "",
              "", "", "2X", "",
              "", "", "3X", ""
          ]'''
          s, n = re.subn(
              r'segments:\s*\[[\s\S]*?\n\s*\]',
              segmentos,
              s,
              count=1
          )
          if n != 1:
              raise SystemExit('Não encontrei a configuração visual da roleta no dashboard.html')

          # Todos os quatro multiplicadores ficam verdes, como no modelo aprovado.
          s = s.replace(
              'const prizeColors = {0:"#35ff78",4:"#3da5ff",8:"#ffc02e",12:"#ff4040"};',
              'const prizeColors = {2:"#25e66b",6:"#25e66b",10:"#25e66b",14:"#25e66b"};'
          )

          # Título superior oculto: a identificação da roleta já existe no card do jogo.
          s = s.replace(
              '<h2 class="modal-title" id="rouletteTitle">Roda da Sorte</h2>',
              '<h2 class="modal-title" id="rouletteTitle" aria-hidden="true"></h2>'
          )

          # Centro: MyBets em cima e GIRAR embaixo, sem coroa.
          s = s.replace('content: "♛";', 'content: "MyBets";', 1)

          extra = '''
/* MYBETS_ROULETTE_APPROVED_16_20260911 */
#rouletteTitle{display:none!important}
#rouletteResult{display:none!important;height:0!important;min-height:0!important;max-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important}
.roulette-center-button::before{content:"MyBets"!important;color:#f4f4f4!important;font-style:italic!important;font-weight:1000!important;font-size:clamp(16px,3.8vw,22px)!important;line-height:1!important;margin-bottom:3px!important}
.roulette-center-button{color:#ffd33d!important}
.pointer{top:-34px!important;width:76px!important;height:92px!important;background:linear-gradient(145deg,#fff6bd 0%,#ffd24a 25%,#f0ad16 58%,#9a5200 100%)!important;clip-path:polygon(4% 0,96% 0,83% 56%,50% 100%,17% 56%)!important;filter:drop-shadow(0 6px 8px rgba(0,0,0,.9)) drop-shadow(0 0 7px rgba(255,190,35,.35))!important}
.pointer::before{content:""!important;position:absolute!important;left:50%!important;top:7px!important;width:60px!important;height:70px!important;transform:translateX(-50%)!important;background:linear-gradient(160deg,#241400 0%,#090909 55%,#000 100%)!important;clip-path:polygon(5% 0,95% 0,80% 58%,50% 100%,20% 58%)!important}
.pointer::after{content:""!important;position:absolute!important;left:50%!important;top:13px!important;width:48px!important;height:60px!important;transform:translateX(-50%)!important;background:#ff3434!important;clip-path:polygon(5% 0,95% 0,80% 58%,50% 100%,20% 58%)!important;filter:none!important}
'''
          if 'MYBETS_ROULETTE_APPROVED_16_20260911' not in s:
              s = s.replace('</style>', extra + '</style>', 1)

          # Remove a duplicação visual que havia aparecido no título da seção.
          s = re.sub(
              r'<div class="roulette-section-heading">[\s\S]*?<section class="games">',
              '<div class="roulette-section-heading"><h2 class="section-title">🎰 Roletas</h2><span>GIRE E MULTIPLIQUE</span></div>\n\n    <section class="games">',
              s,
              count=1
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar alteração no mesmo repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar marca MyBets"
          git push
