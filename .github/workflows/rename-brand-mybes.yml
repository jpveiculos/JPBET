name: Atualizar marca MyBets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-roulette:
    if: ${{ !contains(github.event.head_commit.message, 'Atualizar marca MyBets') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar correção da roleta
        run: python scripts/fix_roulette_solid_yellow.py

      - name: Publicar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/dashboard.html scripts/fix_roulette_solid_yellow.py
          git commit -m "Atualizar marca MyBets"
          git push
