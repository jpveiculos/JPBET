name: Apply MyBets logo standard

on:
  push:
    branches: [main]
    paths:
      - 'backend/frontend/*.html'
      - 'backend/frontend/brand-standard.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject shared logo script
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('backend/frontend')
          tag = '<script src="/brand-standard.js?v=2"></script>'
          for path in sorted(root.glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if tag in text:
                  continue
              marker = '</body>'
              if marker in text:
                  text = text.replace(marker, f'{tag}\n{marker}', 1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/frontend/*.html
          git commit -m "Apply unified MyBets logos [skip ci]" || true
          git push origin main
          rm -f .github/workflows/apply-logo-standard.yml
          git add .github/workflows/apply-logo-standard.yml
          git commit -m "Remove one-time logo workflow [skip ci]" || true
          git push origin main
