name: Fix roulette footer

on:
  push:
    branches: [main]

jobs:
  fix-footer:
    if: contains(github.event.head_commit.message, '[fix-roulette-footer]') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace roulette footer item
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/frontend/roulette207.html')
          s = p.read_text(encoding='utf-8')
          old = '''<button class="active">\n\n  <span>\n    ◎\n  </span>\n\n  Roleta\n\n</button>'''
          new = '''<button\n  onclick="\n    location.href='/'\n  "\n>\n\n  <span>\n    ☰\n  </span>\n\n  Menu do site\n\n</button>'''
          if old not in s:
              raise SystemExit('Footer block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-roulette-footer.yml
          git add backend/frontend/roulette207.html .github/workflows/fix-roulette-footer.yml
          git commit -m "Remove roulette item from footer [fix-roulette-footer]"
          git push
