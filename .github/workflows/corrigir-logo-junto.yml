name: Corrigir logo MyBets junto
on: push
jobs:
  ajuste:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir logo da pagina principal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/frontend/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span class="brand-main">My<span>Bets</span></span>','<span class="brand-main">MyBets</span>',1)
          s=s.replace('.brand-main span{\n  color:#fff\n}', '.brand-main span{\n  color:#fff\n}', 1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/frontend/index.html
          git commit -m 'Corrige logo MyBets para ficar junto'
          git push origin main
          git rm -f .github/workflows/corrigir-logo-junto.yml
          git commit -m 'Remove workflow temporario da logo'
          git push origin main
