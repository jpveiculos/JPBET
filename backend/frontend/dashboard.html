<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MyBets - Área do Jogador</title><style>:root{--gold:#ffd83d;--bg:#03070c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding-bottom:78px}.header{height:66px;display:flex;align-items:center;justify-content:flex-start;background:linear-gradient(180deg,#060b12,#03070c);border-bottom:1px solid #222;position:sticky;top:0;z-index:100}.logo{font-size:27px;font-weight:900;font-style:italic}.logo b{color:#f6bd24}.player-dashboard{padding:18px 14px 30px;max-width:720px;margin:auto}.player-welcome h1{font-size:25px;margin:0 0 5px}.player-welcome p{color:#9ea7b5;font-size:14px}.player-card{background:linear-gradient(145deg,#101923,#080d14);border:1px solid #493d20;border-radius:20px;padding:20px}.player-card-label,.player-card-sub{color:#aeb5c2;font-size:13px}.player-card-balance{font-size:34px;font-weight:900;color:#ffda52;margin:5px 0}.player-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.player-action{border:1px solid #493d20;border-radius:13px;padding:13px;background:#111923;color:#fff;font-weight:900}.player-action.primary{background:linear-gradient(#ffe47b,#e0a51a);color:#07090d}.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:24px}.game-card{min-height:176px;padding:16px;border-radius:18px;background:linear-gradient(145deg,#111923,#070c12);border:1px solid #493d20;display:flex;flex-direction:column;align-items:center;justify-content:center}.game-icon{width:72px;height:72px;border-radius:18px;border:2px solid #d89d1b;background:linear-gradient(145deg,#3a1a08,#0d0d0d);display:flex;align-items:center;justify-content:center;font-size:34px}.roulette-card-icon{width:72px;height:72px;border-radius:50%;border:5px solid #d89d1b;background:repeating-conic-gradient(#151515 0 18deg,#8f1414 18deg 36deg);display:flex;align-items:center;justify-content:center}.roulette-card-icon:after{content:'MyBets';font-size:7px;font-weight:900;font-style:italic}.game-card h3{margin:9px 0;font-size:19px}.game-card button{width:100%;height:42px;border:0;border-radius:11px;background:linear-gradient(#ffe47b,#e0a51a);font-weight:900}.bottom-menu{position:fixed;left:0;right:0;bottom:0;height:68px;z-index:300;background:rgba(7,12,18,.97);border-top:1px solid #493d20;display:flex;justify-content:center;padding:6px 8px}.bottom-menu-inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.bottom-item{border:0;background:transparent;color:#8f99a8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800}.bottom-item .icon{font-size:20px}.bottom-item.active{color:#ffda52;background:#2b220c}.modal{position:fixed;inset:0;z-index:500;display:none;background:#000c;align-items:center;justify-content:center;padding:12px}.modal-content{width:min(560px,100%);padding:20px 14px;border-radius:22px;background:#0b1119}.close{float:right;border:0;background:#111925;color:#fff;width:44px;height:44px;border-radius:13px;font-size:28px}.modal-title{color:#ffdc60}.field{width:100%;padding:14px;border-radius:13px;border:1px solid #493d20;background:#090b10;color:#fff;margin-top:8px}.modal-action{width:100%;height:48px;margin-top:10px;border:0;border-radius:13px;background:linear-gradient(#ffe47b,#e0a51a);font-weight:900}@media(max-width:520px){.games-grid{grid-template-columns:1fr}.bottom-menu{height:70px}}</style></head><body><header class="header"><div class="logo">My<b>Bets</b></div></header><section class="player-dashboard"><div class="player-welcome"><h1>Olá, <span id="playerName">Jogador</span> 👋</h1><p>Bem-vindo à sua área do jogador.</p></div><div class="player-card"><div class="player-card-label">Seu saldo</div><div class="player-card-balance" id="playerBalance">R$ 0,00</div><div class="player-card-sub">Créditos virtuais disponíveis</div><div class="player-actions"><button class="player-action primary" onclick="openDeposit()">+ Depositar</button><button class="player-action" onclick="openWithdraw()">Sacar</button></div></div><div class="games-grid" id="games"><article class="game-card"><div class="roulette-card-icon"></div><h3>Roleta MyBets</h3><button onclick="goToGame('/roulette207.html')">JOGAR AGORA</button></article><article class="game-card"><div class="game-icon">🐯</div><h3>My Tiger</h3><button onclick="goToGame('/my-tiger.html')">JOGAR AGORA</button></article><article class="game-card"><div class="game-icon">🐉</div><h3>My Dragon</h3><button onclick="goToGame('/my-dragon.html')">JOGAR AGORA</button></article><article class="game-card"><div class="game-icon">7️⃣</div><h3>Lucky 7</h3><button onclick="goToGame('/lucky7.html')">JOGAR AGORA</button></article></div></section><nav class="bottom-menu"><div class="bottom-menu-inner"><button class="bottom-item active" onclick="goHome()"><span class="icon">⌂</span><span>Início</span></button><button class="bottom-item" onclick="goGames()"><span class="icon">🎮</span><span>Jogos</span></button><button class="bottom-item" onclick="openDeposit()"><span class="icon">＋</span><span>Depositar</span></button><button class="bottom-item" onclick="openWithdraw()"><span class="icon">⇩</span><span>Sacar</span></button><button class="bottom-item" onclick="goAccount()"><span class="icon">●</span><span>Conta</span></button></div></nav><div class="modal" id="depositModal"><div class="modal-content"><button class="close" onclick="closeDeposit()">×</button><h2 class="modal-title">Depositar</h2><p>Informe o valor do depósito.</p><input class="field" id="depositAmount" type="number" min="1" step="0.01"><button class="modal-action" onclick="requestDeposit()">SOLICITAR DEPÓSITO</button></div></div><div class="modal" id="withdrawModal"><div class="modal-content"><button class="close" onclick="closeWithdraw()">×</button><h2 class="modal-title">Sacar</h2><p>Informe o valor e sua chave Pix.</p><input class="field" id="withdrawAmount" type="number" min="1" step="0.01"><input class="field" id="withdrawPixKey" type="text" placeholder="Chave Pix"><button class="modal-action" onclick="requestWithdraw()">SOLICITAR SAQUE</button></div></div><script>const API='/api';let user=null,token=null;const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});function headers(){return {'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}}function session(){try{user=JSON.parse(localStorage.getItem('jpbet_user')||'null');token=localStorage.getItem('jpbet_token')||null}catch(e){}if(!user?.id){location.href='/';return false}return true}function renderUser(u){user={...user,...u};$('playerName').textContent=user.name||user.nome||user.username||user.email||'Jogador';$('playerBalance').textContent='R$ '+money(user.balance);localStorage.setItem('jpbet_user',JSON.stringify(user))}async function loadAccount(){try{const r=await fetch(`${API}/account/${encodeURIComponent(user.id)}`,{headers:headers(),cache:'no-store'});if(r.ok){const d=await r.json();renderUser(d.user||d.account||d)}}catch(e){}}function goToGame(p){location.href=p}function goHome(){scrollTo({top:0,behavior:'smooth'});setActive(0)}function goGames(){document.getElementById('games')?.scrollIntoView({behavior:'smooth'});setActive(1)}function goAccount(){alert('Área da conta em breve.');setActive(4)}function setActive(i){document.querySelectorAll('.bottom-item').forEach((b,n)=>b.classList.toggle('active',i===n))}function openDeposit(){$('depositModal').style.display='flex';setActive(2)}function closeDeposit(){$('depositModal').style.display='none'}function openWithdraw(){$('withdrawModal').style.display='flex';setActive(3)}function closeWithdraw(){$('withdrawModal').style.display='none'}async function requestDeposit(){const amount=Number($('depositAmount').value);if(!(amount>0))return alert('Informe um valor válido.');try{const r=await fetch(`${API}/deposits`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount})});if(!r.ok)throw Error('Não foi possível solicitar o depósito.');closeDeposit();alert('Solicitação enviada.')}catch(e){alert(e.message)}}async function requestWithdraw(){const amount=Number($('withdrawAmount').value),pixKey=$('withdrawPixKey').value.trim();if(!(amount>0)||!pixKey)return alert('Informe valor e chave Pix.');try{const r=await fetch(`${API}/withdrawals`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount,pixKey})});if(!r.ok)throw Error('Não foi possível solicitar o saque.');closeWithdraw();alert('Saque solicitado.');await loadAccount()}catch(e){alert(e.message)}}if(session()){renderUser(user);loadAccount()}</script><script src="/navigation.js?v=4" defer></script><script src="/brand-standard.js?v=1"></script><script src="/brand-standard.js?v=2"></script></body></html>
