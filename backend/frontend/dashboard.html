<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MyBets - Roleta</title>
<style>
:root{--gold:#ffd83d;--gold2:#f5bd21;--green:#28ee76;--bg:#03070c;--muted:#aeb5c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;min-height:100%;background:#03070c;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}body{padding-bottom:70px;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}
.header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#03070c;border-bottom:1px solid rgba(255,255,255,.13);position:sticky;top:0;z-index:100}.logo{font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px}.logo b{color:#f6bd24}.header-right{display:flex;align-items:center;gap:7px}.header-balance{min-width:122px;padding:5px 9px;border:1px solid rgba(245,197,66,.38);border-radius:15px;background:#070b11;font-size:11px;color:#fff}.header-balance strong{display:block;color:#ffda52;font-size:17px;margin-top:1px}.menu-button{width:40px;height:40px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:#0b121b;color:#fff;font-size:23px}
.page{width:100%;max-width:720px;margin:0 auto;padding:4px 8px 10px}.roulette-area{position:relative;width:min(300px,calc(100vw - 70px));aspect-ratio:1;margin:14px auto 8px;filter:drop-shadow(0 16px 28px rgba(0,0,0,.8))}.roulette-area:before{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,transparent 0 87%,#6b3c00 87.2%,#a96500 87.8%,#f1a51b 88.5%,#fff2a3 89.25%,#ffd43b 90%,#c77b05 91%,#6f3e00 92.3%,#2a1800 93.1%,transparent 93.7%);box-shadow:0 2px 5px rgba(0,0,0,.9);pointer-events:none;z-index:20}.roulette-area:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(255,241,157,.85);box-shadow:inset 0 0 0 1px rgba(107,60,0,.9);pointer-events:none;z-index:21}#wheel{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;z-index:10;will-change:transform}.roulette-svg{width:100%;height:100%;display:block;overflow:visible}.roulette-pointer{position:absolute;z-index:100;left:50%;top:-13px;transform:translateX(-50%);width:50px;height:56px;background:linear-gradient(180deg,#fff0a0 0%,#ffd64a 20%,#e5a313 72%,#9a5c00 100%);clip-path:polygon(4% 0,96% 0,78% 58%,50% 100%,22% 58%);filter:drop-shadow(0 5px 7px rgba(0,0,0,.95));pointer-events:none}.roulette-pointer:before{content:"";position:absolute;left:9px;top:7px;width:32px;height:38px;background:#05070a;clip-path:polygon(4% 0,96% 0,72% 58%,50% 100%,28% 58%)}.roulette-pointer:after{content:"";position:absolute;left:15px;top:10px;width:20px;height:29px;background:linear-gradient(180deg,#ff4b55,#ed1f2c);clip-path:polygon(0 0,100% 0,50% 100%);box-shadow:0 0 12px rgba(255,38,52,.8)}
.roulette-center-cover{position:absolute;z-index:48;left:50%;top:50%;width:40%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#080808;border:4px solid #e0a018;box-shadow:0 0 0 2px #674108,0 0 24px rgba(255,190,30,.65);pointer-events:none}.roulette-center-button{position:absolute!important;z-index:60;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:29%!important;min-width:74px;max-width:105px;aspect-ratio:1;border:4px solid #d99a13!important;border-radius:50%;background:radial-gradient(circle at 45% 30%,#302510,#050505 72%)!important;color:#ffd23d!important;font-weight:900;font-size:0;box-shadow:0 0 0 2px #5b3a09,0 0 0 5px rgba(255,203,52,.35),inset 0 0 14px rgba(255,190,30,.2)!important;padding:0}.roulette-center-button:before{content:"MyBets";display:block;color:#fff;font-size:clamp(12px,3.2vw,18px);font-style:italic;line-height:1;margin-bottom:4px}.roulette-center-button:after{content:"GIRAR";display:block;color:#ffd23d;font-size:clamp(15px,3.8vw,23px);font-weight:900}
.roulette-result{text-align:center;min-height:16px;margin:1px 0 3px;font-weight:900;color:#edf0f4;font-size:13px}.roulette-result.win{color:#25f477;text-shadow:0 0 10px rgba(37,244,119,.35)}.roulette-result.loss{color:#ff3948;text-shadow:0 0 10px rgba(255,57,72,.35)}.roulette-result.error{color:#ffd24a}.bet-title{text-align:left;color:#d2d7df;font-size:13px;margin:0 0 4px 3px}.roulette-bet{display:flex;align-items:center;gap:7px;margin:0 auto}.roulette-bet>button{width:46px;height:46px;border:1px solid #77580e;border-radius:13px;background:#101720;color:#fff;font-size:27px;font-weight:900}.roulette-bet-field{flex:1}.roulette-bet-field input{width:100%;height:46px;border-radius:13px;border:1px solid #566171;background:#05080d;color:#fff;text-align:left;padding:0 15px;font-size:24px;font-weight:900;outline:none}.quick-bets{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}.quick-bets button{height:32px;border:1px solid #f0c52e;border-radius:10px;background:linear-gradient(180deg,#121a23,#080e15);color:#fff;font-size:14px;font-weight:900}.spin-button{width:100%;height:48px;margin-top:7px;border:0;border-radius:13px;background:linear-gradient(180deg,#ffe47b,#e0a51a);color:#07090d;font-size:24px;font-weight:900;box-shadow:0 6px 16px rgba(221,164,28,.25)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:400;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(3,7,12,.98);border-top:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px)}.nav-item{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:#b9c0cd;font-size:10px;font-weight:800}.nav-item span{font-size:21px;line-height:1}.nav-item.active{color:#ffdf45}.nav-item.active:after{content:"";width:66px;height:3px;border-radius:4px;background:#ffdf45;margin-top:1px}
.drawer-backdrop,.modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:12px}.drawer-backdrop{align-items:stretch;justify-content:flex-end;padding:0}.drawer{width:min(340px,88%);height:100%;padding:20px;background:#090f17;border-left:1px solid rgba(255,255,255,.1)}.close{border:0;background:#111925;color:#fff;width:44px;height:44px;border-radius:13px;font-size:28px}.drawer .close{float:right}.drawer-button{width:100%;margin-top:10px;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:#111923;color:#fff;text-align:left;font-weight:800}.modal-content{position:relative;width:min(560px,100%);padding:20px 14px;border-radius:22px;background:#0b1119;border:1px solid rgba(255,255,255,.12)}.modal-title{margin:0 50px 12px;color:#ffdc60;font-size:28px}.field{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(245,197,66,.25);background:#090b10;color:#fff;margin-top:8px}
@media(min-width:601px){.roulette-area{width:min(360px,calc(100vw - 120px))}}
</style>
</head>
<body>
<header class="header"><div class="logo">My<b>Bets</b></div><div class="header-right"><div class="header-balance">Saldo<strong id="headerBalance">R$ 0,00</strong></div><button class="menu-button" onclick="openMenu()">☰</button></div></header>
<main class="page">
<section class="roulette-area"><div class="roulette-pointer"></div><div id="wheel"><svg id="rouletteSvg" class="roulette-svg" viewBox="0 0 500 500" aria-label="Roleta MyBets"></svg></div><div class="roulette-center-cover"></div><button class="roulette-center-button" id="spinButton" onclick="spinRoulette()">GIRAR</button></section>
<div class="roulette-result" id="rouletteResult"></div><div class="bet-title">Valor da aposta</div><div class="roulette-bet"><button onclick="changeBet(-0.5)">−</button><div class="roulette-bet-field"><input id="betAmount" type="number" min="0.5" max="100" step="0.5" value="0.5" inputmode="decimal"></div><button onclick="changeBet(0.5)">+</button></div><div class="quick-bets"><button onclick="setBet(.5)">0,50</button><button onclick="setBet(1)">1</button><button onclick="setBet(5)">5</button><button onclick="setBet(10)">10</button><button onclick="setBet(25)">25</button><button onclick="setBet(100)">100</button></div><button class="spin-button" id="bottomSpinButton" onclick="spinRoulette()">GIRAR</button>
</main>
<div class="drawer-backdrop" id="menu" onclick="if(event.target===this)closeMenu()"><aside class="drawer"><button class="close" onclick="closeMenu()">×</button><h2>Menu</h2><button class="drawer-button" onclick="openDeposit();closeMenu()">Depositar</button><button class="drawer-button" onclick="openWithdraw();closeMenu()">Sacar</button><button class="drawer-button" onclick="closeMenu()">Roleta MyBets</button><button class="drawer-button" onclick="logout()">Sair</button></aside></div>
<div class="modal" id="depositModal"><div class="modal-content"><button class="close" onclick="closeDeposit()">×</button><h2 class="modal-title">Depositar</h2><p>Informe o valor do depósito.</p><input class="field" id="depositAmount" type="number" min="1" step="0.01" placeholder="R$ 0,00"><button class="spin-button" onclick="requestDeposit()">SOLICITAR DEPÓSITO</button></div></div>
<div class="modal" id="withdrawModal"><div class="modal-content"><button class="close" onclick="closeWithdraw()">×</button><h2 class="modal-title">Sacar</h2><p>Informe o valor e sua chave Pix.</p><input class="field" id="withdrawAmount" type="number" min="1" step="0.01" placeholder="Valor"><input class="field" id="withdrawPixKey" type="text" placeholder="Chave Pix"><button class="spin-button" onclick="requestWithdraw()">SOLICITAR SAQUE</button></div></div>
<nav class="bottom-nav"><button class="nav-item" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>⌂</span>Início</button><button class="nav-item active" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span>◉</span>Roleta</button><button class="nav-item" onclick="location.href='/games.html'"><span>⌁</span>Jogos</button><button class="nav-item" onclick="openDeposit()"><span>▣</span>Depósito</button><button class="nav-item" onclick="openMenu()"><span>◷</span>Histórico</button></nav>
<script>
const API='/api';let user=null,token=null,settings={roulette_min_bet:'0.50',roulette_max_bet:'100',roulette_animation_ms:'4800'};let rotation=0,spinning=false;const $=id=>document.getElementById(id);const money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});function toast(m,type='neutral'){const el=$('rouletteResult');el.textContent=m;el.className='roulette-result '+(type==='win'?'win':type==='loss'?'loss':type==='error'?'error':'')}function headers(){return {'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}}function session(){try{user=JSON.parse(localStorage.getItem('jpbet_user')||'null');token=localStorage.getItem('jpbet_token')||null}catch(e){user=null}if(!user?.id){location.href='/';return false}return true}function renderUser(u){user={...user,...u};$('headerBalance').textContent='R$ '+money(user.balance);localStorage.setItem('jpbet_user',JSON.stringify(user))}async function loadSettings(){try{const r=await fetch(`${API}/settings/public`);if(r.ok){const d=await r.json();settings={...settings,...(d.settings||{})}}}catch(e){}}async function loadAccount(){try{const r=await fetch(`${API}/account/${encodeURIComponent(user.id)}`,{headers:headers()});if(r.ok){const d=await r.json();renderUser(d.user||d.account||d)}}catch(e){}}function openMenu(){$('menu').style.display='flex'}function closeMenu(){$('menu').style.display='none'}function openDeposit(){$('depositAmount').value='';$('depositModal').style.display='flex'}function closeDeposit(){$('depositModal').style.display='none'}function openWithdraw(){$('withdrawAmount').value='';$('withdrawPixKey').value='';$('withdrawModal').style.display='flex'}function closeWithdraw(){$('withdrawModal').style.display='none'}function setBet(v){const e=$('betAmount'),min=Number(e.min||.5),max=Number(e.max||100);e.value=Math.min(max,Math.max(min,Number(v)||min))}function changeBet(v){setBet(Number($('betAmount').value||.5)+v)}async function requestDeposit(){const amount=Number($('depositAmount').value);if(!(amount>0))return toast('Informe um valor válido.','error');try{const r=await fetch(`${API}/deposits`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount})});const d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível solicitar o depósito.');closeDeposit();toast('Solicitação de depósito enviada.')}catch(e){toast(e.message,'error')}}async function requestWithdraw(){const amount=Number($('withdrawAmount').value),pixKey=$('withdrawPixKey').value.trim();if(!(amount>0))return toast('Informe um valor válido.','error');if(!pixKey)return toast('Informe sua chave Pix.','error');try{const r=await fetch(`${API}/withdrawals`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount,pixKey})});const d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível solicitar o saque.');closeWithdraw();toast('Saque solicitado e enviado para análise.');await loadAccount()}catch(e){toast(e.message,'error')}}function polar(r,d){const a=(d-90)*Math.PI/180;return{x:250+r*Math.cos(a),y:250+r*Math.sin(a)}}function path(r,a,b){const p=polar(r,a),q=polar(r,b),large=b-a>180?1:0;return`M250 250 L${p.x} ${p.y} A${r} ${r} 0 ${large} 1 ${q.x} ${q.y} Z`}
function renderWheel(){const svg=$('rouletteSvg');if(!svg)return;svg.innerHTML='';const ns='http://www.w3.org/2000/svg';const defs=document.createElementNS(ns,'defs');const grad=document.createElementNS(ns,'radialGradient');grad.setAttribute('id','goldRing');grad.innerHTML='<stop offset="0%" stop-color="#6b3c00"/><stop offset="72%" stop-color="#d88a08"/><stop offset="86%" stop-color="#fff0a0"/><stop offset="93%" stop-color="#ffd43b"/><stop offset="100%" stop-color="#8b4d00"/>';defs.appendChild(grad);const green=document.createElementNS(ns,'linearGradient');green.setAttribute('id','prizeGreen');green.setAttribute('x1','0%');green.setAttribute('y1','0%');green.setAttribute('x2','0%');green.setAttribute('y2','100%');green.innerHTML='<stop offset="0%" stop-color="#8dffb8"/><stop offset="25%" stop-color="#35ff82"/><stop offset="65%" stop-color="#12dc68"/><stop offset="100%" stop-color="#049a46"/>';defs.appendChild(green);const filter=document.createElementNS(ns,'filter');filter.setAttribute('id','prize3D');filter.setAttribute('x','-35%');filter.setAttribute('y','-35%');filter.setAttribute('width','170%');filter.setAttribute('height','180%');filter.innerHTML='<feDropShadow dx="3" dy="4" stdDeviation="1.2" flood-color="#001b0b" flood-opacity=".98"/><feDropShadow dx="-1" dy="-1" stdDeviation=".6" flood-color="#baffcf" flood-opacity=".55"/>';defs.appendChild(filter);svg.appendChild(defs);const base=document.createElementNS(ns,'circle');base.setAttribute('cx',250);base.setAttribute('cy',250);base.setAttribute('r',238);base.setAttribute('fill','#f6b916');svg.appendChild(base);const prizes={2:'5X',6:'10X',10:'2X',14:'3X'};const visualByIndex={0:-14,1:0,3:14,2:45,4:76,5:90,7:104,6:135,8:166,9:180,11:194,10:225,12:256,13:270,15:284,14:315};for(const i of [2,6,10,14]){const center=visualByIndex[i];const p=document.createElementNS(ns,'path');p.setAttribute('d',path(238,center-24,center+24));p.setAttribute('fill','#020202');p.setAttribute('stroke','#050505');p.setAttribute('stroke-width','1');svg.appendChild(p);const q=polar(172,center),t=document.createElementNS(ns,'text');t.textContent=prizes[i];t.setAttribute('x',q.x);t.setAttribute('y',q.y);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-family','Arial,Helvetica,sans-serif');t.setAttribute('font-size',prizes[i]==='10X'?'46':'54');t.setAttribute('font-weight','900');t.setAttribute('font-style','italic');t.setAttribute('fill','url(#prizeGreen)');t.setAttribute('stroke','#032b14');t.setAttribute('stroke-width','4');t.setAttribute('paint-order','stroke fill');t.setAttribute('filter','url(#prize3D)');t.setAttribute('class','prize-label');t.dataset.cx=q.x;t.dataset.cy=q.y;svg.appendChild(t)}const ring=document.createElementNS(ns,'circle');ring.setAttribute('cx',250);ring.setAttribute('cy',250);ring.setAttribute('r',238);ring.setAttribute('fill','none');ring.setAttribute('stroke','url(#goldRing)');ring.setAttribute('stroke-width','12');svg.appendChild(ring);const highlight=document.createElementNS(ns,'circle');highlight.setAttribute('cx',250);highlight.setAttribute('cy',250);highlight.setAttribute('r',232);highlight.setAttribute('fill','none');highlight.setAttribute('stroke','#ffe66b');highlight.setAttribute('stroke-width','2');highlight.setAttribute('opacity','.8');svg.appendChild(highlight);$('wheel').style.transform=`rotate(${rotation}deg)`}
function updatePrizeOrientation(rr){document.querySelectorAll('.prize-label').forEach(t=>{const x=Number(t.dataset.cx),y=Number(t.dataset.cy);t.setAttribute('transform',`translate(${x} ${y}) rotate(${-rr}) translate(${-x} ${-y})`)})}
async function spinRoulette(){if(spinning)return;const bet=Number($('betAmount').value),min=Number(settings.roulette_min_bet||.5),max=Number(settings.roulette_max_bet||100);if(!(bet>=min&&bet<=max))return toast(`A aposta deve estar entre ${money(min)} e ${money(max)}.`,'error');if(bet>Number(user.balance||0))return toast('Saldo insuficiente.','error');spinning=true;$('spinButton').disabled=true;$('bottomSpinButton').disabled=true;$('spinButton').style.opacity='.6';try{const r=await fetch(`${API}/roulette/spin`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,betAmount:bet,betType:'roulette',rouletteId:'sorte'})});const d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível realizar a rodada.');const spin=d.spin||d.result||d;if(!Number.isInteger(Number(spin.index))||Number(spin.index)<0||Number(spin.index)>=16)throw Error('Resultado inválido.');const visualByIndex={0:-14,1:0,3:14,2:45,4:76,5:90,7:104,6:135,8:166,9:180,11:194,10:225,12:256,13:270,15:284,14:315};const idx=Number(spin.index),center=visualByIndex[idx],target=((360-center-(rotation%360))+360)%360,turns=7+Math.floor(Math.random()*2),dest=rotation+turns*360+target,dur=Math.max(1800,Number(settings.roulette_animation_ms)||4800),start=performance.now(),from=rotation;await new Promise(resolve=>{function frame(now){const p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3),rr=from+(dest-from)*e;$('wheel').style.transform=`rotate(${rr}deg)`;updatePrizeOrientation(rr);if(p<1)return requestAnimationFrame(frame);rotation=dest;$('wheel').style.transform=`rotate(${dest}deg)`;updatePrizeOrientation(dest);resolve()}requestAnimationFrame(frame)});await loadAccount();if(Number(spin.prize)>0)toast(`Você ganhou ${money(spin.prize)}!`,'win');else toast('Rodada finalizada.','loss')}catch(e){toast(e.message,'error')}finally{spinning=false;$('spinButton').disabled=false;$('bottomSpinButton').disabled=false;$('spinButton').style.opacity='1'}}function logout(){localStorage.removeItem('jpbet_user');localStorage.removeItem('jpbet_token');location.href='/'}async function init(){if(!session())return;renderUser(user);await loadSettings();await loadAccount();renderWheel()}init();document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDeposit();closeWithdraw();closeMenu()}});
</script>
</body>
</html>
