<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MyBets - Área do Jogador</title>
<style>
:root{--gold:#ffd83d;--gold2:#f5bd21;--green:#28ee76;--bg:#03070c;--muted:#aeb5c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}
.header{height:66px;display:flex;align-items:center;justify-content:center;padding:0 10px;background:linear-gradient(180deg,#060b12,#03070c);border-bottom:1px solid rgba(255,255,255,.13);position:sticky;top:0;z-index:100;box-shadow:0 5px 20px rgba(0,0,0,.28)}.logo{font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px}.logo b{color:#f6bd24}
.player-dashboard{min-height:calc(100vh - 66px);padding:18px 14px 30px;max-width:720px;margin:0 auto}.player-welcome{margin:4px 2px 16px}.player-welcome h1{font-size:25px;margin:0 0 5px}.player-welcome p{margin:0;color:#9ea7b5;font-size:14px}.player-card{background:linear-gradient(145deg,#101923,#080d14);border:1px solid rgba(245,197,66,.22);border-radius:20px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.35)}.player-card-label{color:#aeb5c2;font-size:13px}.player-card-balance{font-size:34px;font-weight:900;color:#ffda52;margin:5px 0 3px}.player-card-sub{color:#7f8998;font-size:12px}.player-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.player-action{border:1px solid rgba(245,197,66,.25);border-radius:13px;padding:13px;background:#111923;color:#fff;font-weight:900}.player-action.primary{background:linear-gradient(180deg,#ffe47b,#e0a51a);color:#07090d;border:0}
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:24px}.game-card{position:relative;overflow:hidden;min-height:176px;padding:16px;border-radius:18px;background:linear-gradient(145deg,#111923,#070c12);border:1px solid rgba(245,197,66,.25);box-shadow:0 10px 25px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center}.game-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,rgba(245,197,66,.18),transparent 45%);pointer-events:none}.roulette-card-icon{position:relative;z-index:2;width:72px;height:72px;margin:0 auto 10px;border-radius:50%;border:5px solid #d89d1b;background:repeating-conic-gradient(#151515 0 18deg,#8f1414 18deg 36deg);box-shadow:0 0 0 2px #4c3309,0 0 18px rgba(245,197,66,.22);display:flex;align-items:center;justify-content:center}.roulette-card-icon:before{content:"";width:30px;height:30px;border-radius:50%;border:3px solid #d89d1b;background:#090909;box-shadow:inset 0 0 0 5px #181818}.roulette-card-icon:after{content:"MyBets";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:7px;font-weight:900;font-style:italic;color:#fff;white-space:nowrap}.game-card h3{position:relative;z-index:2;margin:2px 0 9px;font-size:19px;text-align:center}.game-card button{position:relative;z-index:3;width:100%;height:42px;margin-top:0;border:0;border-radius:11px;background:linear-gradient(180deg,#ffe47b,#e0a51a);color:#07090d;font-weight:900;font-size:12px}
.drawer-backdrop,.modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:12px}.drawer-backdrop{align-items:stretch;justify-content:flex-end;padding:0}.drawer{width:min(340px,88%);height:100%;padding:20px;background:linear-gradient(180deg,#0b121b,#070c13);border-left:1px solid rgba(255,255,255,.1);box-shadow:-12px 0 35px rgba(0,0,0,.45)}.close{border:0;background:#111925;color:#fff;width:44px;height:44px;border-radius:13px;font-size:28px}.drawer .close{float:right}.drawer h2{margin-top:55px}.drawer-button{width:100%;margin-top:10px;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:linear-gradient(180deg,#131d28,#0d151e);color:#fff;text-align:left;font-weight:800}.modal-content{position:relative;width:min(560px,100%);padding:20px 14px;border-radius:22px;background:#0b1119;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.5)}.modal-title{margin:0 50px 12px;color:#ffdc60;font-size:28px}.field{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(245,197,66,.25);background:#090b10;color:#fff;margin-top:8px}.modal-action{width:100%;height:48px;margin-top:10px;border:0;border-radius:13px;background:linear-gradient(180deg,#ffe47b,#e0a51a);color:#07090d;font-weight:900}
@media(max-width:520px){.games-grid{grid-template-columns:1fr}.game-card{min-height:160px}.roulette-card-icon{width:68px;height:68px}}
</style>
</head>
<body>
<header class="header"><div class="logo">My<b>Bets</b></div></header>
<section id="playerView" class="player-dashboard">
  <div class="player-welcome"><h1>Olá, <span id="playerName">Jogador</span> 👋</h1><p>Bem-vindo à sua área do jogador.</p></div>
  <div class="player-card"><div class="player-card-label">Seu saldo</div><div class="player-card-balance" id="playerBalance">R$ 0,00</div><div class="player-card-sub">Créditos virtuais disponíveis</div><div class="player-actions"><button class="player-action primary" onclick="openDeposit()">+ Depositar</button><button class="player-action" onclick="openWithdraw()">Sacar</button></div></div>
  <div class="games-grid">
    <article class="game-card"><div class="roulette-card-icon" aria-hidden="true"></div><h3>Roleta MyBets</h3><button onclick="goToGame('/roulette207.html')">JOGAR AGORA</button></article>
  </div>
</section>
<div class="modal" id="depositModal"><div class="modal-content"><button class="close" onclick="closeDeposit()">×</button><h2 class="modal-title">Depositar</h2><p>Informe o valor do depósito.</p><input class="field" id="depositAmount" type="number" min="1" step="0.01" placeholder="R$ 0,00"><button class="modal-action" onclick="requestDeposit()">SOLICITAR DEPÓSITO</button></div></div>
<div class="modal" id="withdrawModal"><div class="modal-content"><button class="close" onclick="closeWithdraw()">×</button><h2 class="modal-title">Sacar</h2><p>Informe o valor e sua chave Pix.</p><input class="field" id="withdrawAmount" type="number" min="1" step="0.01" placeholder="Valor"><input class="field" id="withdrawPixKey" type="text" placeholder="Chave Pix"><button class="modal-action" onclick="requestWithdraw()">SOLICITAR SAQUE</button></div></div>
<script>
const API='/api';let user=null,token=null;const $=id=>document.getElementById(id);const money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function headers(){return {'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}}
function session(){try{user=JSON.parse(localStorage.getItem('jpbet_user')||'null');token=localStorage.getItem('jpbet_token')||null}catch(e){user=null;token=null}if(!user?.id){location.href='/';return false}return true}
function renderUser(u){user={...user,...u};const name=user.name||user.nome||user.username||user.email||'Jogador';$('playerName').textContent=name;const bal=Number(user.balance||0);$('playerBalance').textContent='R$ '+money(bal);localStorage.setItem('jpbet_user',JSON.stringify(user))}
async function loadAccount(){try{const r=await fetch(`${API}/account/${encodeURIComponent(user.id)}`,{headers:headers(),cache:'no-store'});if(r.ok){const d=await r.json();renderUser(d.user||d.account||d)}}catch(e){}}
function goToGame(path){window.location.href=path}
function openDeposit(){$('depositAmount').value='';$('depositModal').style.display='flex'} function closeDeposit(){$('depositModal').style.display='none'}
function openWithdraw(){$('withdrawAmount').value='';$('withdrawPixKey').value='';$('withdrawModal').style.display='flex'} function closeWithdraw(){$('withdrawModal').style.display='none'}
async function requestDeposit(){const amount=Number($('depositAmount').value);if(!(amount>0))return alert('Informe um valor válido.');try{const r=await fetch(`${API}/deposits`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Não foi possível solicitar o depósito.');closeDeposit();alert('Solicitação de depósito enviada.')}catch(e){alert(e.message)}}
async function requestWithdraw(){const amount=Number($('withdrawAmount').value),pixKey=$('withdrawPixKey').value.trim();if(!(amount>0))return alert('Informe um valor válido.');if(!pixKey)return alert('Informe sua chave Pix.');try{const r=await fetch(`${API}/withdrawals`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount,pixKey})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Não foi possível solicitar o saque.');closeWithdraw();alert('Saque solicitado e enviado para análise.');await loadAccount()}catch(e){alert(e.message)}}
async function init(){if(!session())return;renderUser(user);await loadAccount()}
init();document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDeposit();closeWithdraw()}});
</script>
<script src="/navigation.js?v=4" defer></script>
<script src="/brand-standard.js?v=1"></script>
<script src="/brand-standard.js?v=2"></script>
</body>
</html>
