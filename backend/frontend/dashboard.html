<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPBET - Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #20252f 0%, #0b0d12 48%, #050609 100%);
      color: #fff;
    }
    button,
    input {
      font-family: inherit;
    }
    button {
      cursor: pointer;
    }
    button:active {
      transform: scale(.98);
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }
    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 14px;
    }
    /* =========================
       CABEÇALHO
    ========================= */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -.5px;
    }
    .logo span {
      opacity: .5;
    }
    .user {
      font-size: 13px;
      opacity: .7;
      text-align: right;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* =========================
       SALDO
    ========================= */
    .balance {
      background: linear-gradient(145deg, #1b2029, #11141a);
      border: 1px solid #2b313d;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: 0 12px 35px #0008;
    }
    .balance-title {
      font-size: 12px;
      opacity: .6;
      margin-bottom: 4px;
    }
    .balance-value {
      font-size: 28px;
      font-weight: 900;
    }
    /* =========================
       BOTÕES
    ========================= */
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
    }
    .primary {
      background: #fff;
      color: #111;
    }
    .secondary {
      background: #181c24;
      color: #fff;
      border: 1px solid #2b313d;
    }
    .logout {
      background: #761d25;
      color: #fff;
      margin-top: 4px;
    }
    /* =========================
       CONTA
    ========================= */
    .card {
      background: #151820;
      border: 1px solid #272c36;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 7px;
      font-size: 17px;
    }
    .card p {
      margin: 0;
      font-size: 13px;
      opacity: .65;
    }
    .message {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      opacity: .75;
    }
    /* =========================
       MODAL
    ========================= */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,.86);
      padding: 8px;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      width: 100%;
      max-width: 470px;
      max-height: calc(100vh - 16px);
      overflow-y: auto;
      background:
        linear-gradient(180deg, #191d25, #0d0f14);
      border: 1px solid #303641;
      border-radius: 20px;
      padding: 14px;
      position: relative;
      box-shadow: 0 25px 80px #000;
    }
    .modal-box h2 {
      margin: 0 0 10px;
      padding-right: 48px;
      font-size: 19px;
    }
    .close-button {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      background: #090b0f;
      border: 1px solid #343a46;
      color: #fff;
      font-size: 22px;
    }
    /* =========================
       TOPO DA ROLETA
    ========================= */
    .roulette-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .roulette-balance {
      opacity: .65;
      font-size: 12px;
    }
    .sound-button {
      width: auto;
      padding: 7px 10px;
      background: #10131a;
      border: 1px solid #343a46;
      color: #fff;
      font-size: 12px;
      border-radius: 8px;
    }
    /* =========================
       RODA DA ROLETA
    ========================= */
    .roulette-area {
      position: relative;
      height: 270px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .pointer {
      position: absolute;
      top: 1px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 0;
      height: 0;
      border-left: 13px solid transparent;
      border-right: 13px solid transparent;
      border-top: 30px solid #fff;
      filter: drop-shadow(0 3px 5px #000);
    }
    .wheel {
      position: relative;
      width: 245px;
      height: 245px;
      border-radius: 50%;
      padding: 9px;
      background:
        radial-gradient(
          circle,
          #15171c 0%,
          #15171c 58%,
          #d5d5d5 59%,
          #707070 63%,
          #151515 67%,
          #a9a9a9 70%,
          #161616 74%,
          #080808 100%
        );
      box-shadow:
        0 15px 35px #000b,
        inset 0 0 0 2px #555;
      transition:
        transform 4.8s cubic-bezier(.12,.72,.12,1);
    }
    .wheel-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      background:
        conic-gradient(
          from -5deg,
          #15823b 0deg 9.73deg,
          #111 9.73deg 19.46deg,
          #b51e2a 19.46deg 29.19deg,
          #111 29.19deg 38.92deg,
          #b51e2a 38.92deg 48.65deg,
          #111 48.65deg 58.38deg,
          #b51e2a 58.38deg 68.11deg,
          #111 68.11deg 77.84deg,
          #b51e2a 77.84deg 87.57deg,
          #111 87.57deg 97.30deg,
          #b51e2a 97.30deg 107.03deg,
          #111 107.03deg 116.76deg,
          #b51e2a 116.76deg 126.49deg,
          #111 126.49deg 136.22deg,
          #b51e2a 136.22deg 145.95deg,
          #111 145.95deg 155.68deg,
          #b51e2a 155.68deg 165.41deg,
          #111 165.41deg 175.14deg,
          #b51e2a 175.14deg 184.87deg,
          #111 184.87deg 194.60deg,
          #b51e2a 194.60deg 204.33deg,
          #111 204.33deg 214.06deg,
          #b51e2a 214.06deg 223.79deg,
          #111 223.79deg 233.52deg,
          #b51e2a 233.52deg 243.25deg,
          #111 243.25deg 252.98deg,
          #b51e2a 252.98deg 262.71deg,
          #111 262.71deg 272.44deg,
          #b51e2a 272.44deg 282.17deg,
          #111 282.17deg 291.90deg,
          #b51e2a 291.90deg 301.63deg,
          #111 301.63deg 311.36deg,
          #b51e2a 311.36deg 321.09deg,
          #111 321.09deg 330.82deg,
          #b51e2a 330.82deg 340.55deg,
          #111 340.55deg 350.28deg,
          #b51e2a 350.28deg 360deg
        );
      border: 3px solid #c7c7c7;
      box-shadow: inset 0 0 0 3px #191919;
    }
    .wheel-inner::after {
      content: "";
      position: absolute;
      inset: 20%;
      border-radius: 50%;
      border: 2px solid #aaa;
      box-shadow:
        inset 0 0 0 9px #171717,
        inset 0 0 0 11px #999;
      pointer-events: none;
    }
    .wheel-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      width: 66px;
      height: 66px;
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 35% 30%, #f4f4f4, #8e8e8e 45%, #292929 72%, #050505 100%);
      border: 4px solid #d3d3d3;
      box-shadow:
        0 4px 12px #000,
        inset 0 0 0 4px #333;
      color: #111;
      font-size: 23px;
      font-weight: 900;
    }
    .wheel-spokes {
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35);
      pointer-events: none;
    }
    /* =========================
       RESULTADO
    ========================= */
    .result-panel {
      text-align: center;
      min-height: 32px;
      margin-bottom: 8px;
    }
    .result-number {
      font-size: 20px;
      font-weight: 900;
    }
    .result-red {
      color: #ff5b66;
    }
    .result-black {
      color: #fff;
    }
    .result-green {
      color: #49e778;
    }
    .result-label {
      font-size: 11px;
      opacity: .62;
      margin-top: 2px;
    }
    /* =========================
       APOSTA
    ========================= */
    .bet-title {
      font-size: 11px;
      font-weight: 800;
      opacity: .6;
      margin: 7px 0 5px;
    }
    .bet-amount {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      background: #080a0f;
      border: 1px solid #303642;
      border-radius: 9px;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-align: center;
      outline: none;
    }
    .bet-amount:focus {
      border-color: #fff;
    }
    .quick-values {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 5px;
      margin-top: 5px;
    }
    .quick-value {
      padding: 7px 4px;
      font-size: 11px;
      background: #0c0f15;
      color: #e1e4ea;
      border: 1px solid #303642;
    }
    /* =========================
       CORES
    ========================= */
    .bet-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .bet-type {
      padding: 10px 6px;
      background: #0a0c11;
      color: #fff;
      border: 2px solid #303642;
    }
    .bet-type.selected {
      border-color: #fff;
      background: #252a33;
    }
    .red-button.selected {
      border-color: #f25560;
      background: #48151a;
    }
    .black-button.selected {
      border-color: #aaa;
      background: #262626;
    }
    /* =========================
       NÚMERO
    ========================= */
    .number-section {
      margin-top: 7px;
    }
    .number-toggle {
      padding: 8px;
      background: #0b0e14;
      color: #d5d9e1;
      border: 1px solid #303642;
      font-size: 11px;
    }
    .number-grid {
      display: none;
      grid-template-columns: repeat(6,1fr);
      gap: 4px;
      margin-top: 5px;
    }
    .number-grid.visible {
      display: grid;
    }
    .number-button {
      padding: 7px 2px;
      font-size: 11px;
      background: #0b0d12;
      color: #fff;
      border: 1px solid #303642;
    }
    .number-button.selected {
      background: #fff;
      color: #111;
      border-color: #fff;
    }
    .number-button.zero {
      background: #08752a;
    }
    .number-button.zero.selected {
      background: #43d86d;
      color: #111;
    }
    /* =========================
       MENSAGEM
    ========================= */
    .roulette-message {
      min-height: 24px;
      text-align: center;
      margin: 6px 0;
      font-size: 12px;
      font-weight: 800;
    }
    .win-message {
      color: #55e878;
    }
    .lose-message {
      color: #ff7070;
    }
    .spin-button {
      width: 100%;
      padding: 13px;
      font-size: 15px;
      margin-top: 1px;
    }
    .roulette-info {
      text-align: center;
      font-size: 9px;
      opacity: .42;
      margin-top: 6px;
    }
    /* =========================
       HISTÓRICO
    ========================= */
    .history-list {
      margin-top: 8px;
    }
    .history-item {
      background: #0b0d12;
      border: 1px solid #242933;
      border-radius: 9px;
      padding: 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .empty {
      opacity: .6;
    }
    /* =========================
       CELULAR
    ========================= */
    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }
      header {
        margin-bottom: 10px;
      }
      .logo {
        font-size: 22px;

      .balance {
        padding:
