<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JPBET - Dashboard</title>

<!-- Biblioteca para geração dinâmica do QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

:root{
  --roulette-red:#e51f35;
  --roulette-black:#171717;
  --roulette-green:#08a83e;
  --roulette-accent:#ffd43b;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  font-family:Arial,sans-serif;
  color:#171717;
  background:
    radial-gradient(circle at 15% 0%,#fff2a8 0%,transparent 28%),
    radial-gradient(circle at 100% 10%,#d9c7ff 0%,transparent 30%),
    linear-gradient(135deg,#f5f7ff 0%,#fff 48%,#fff8dc 100%);
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

.container{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:
    16px
    max(16px,env(safe-area-inset-right))
    20px
    max(16px,env(safe-area-inset-left));
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  width:100%;
  margin-bottom:14px;
}

.logo{
  font-size:29px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#6c3cff;
}

.user{
  min-width:0;
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
  color:#555;
  text-align:right;
}

.balance{
  width:100%;
  background:linear-gradient(135deg,#fff,#fffbea);
  border:2px solid #f0cf45;
  border-radius:18px;
  padding:18px 16px;
  margin-bottom:13px;
  text-align:center;
  box-shadow:
    0 10px 30px rgba(70,55,0,.1),
    inset 0 1px 0 #fff;
}

.balance-title{
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

.balance-value{
  font-size:32px;
  font-weight:900;
}

.balance-value.balance-up{
  color:#07963a;
  transform:scale(1.05);
}

.balance-value.balance-down{
  color:#d71932;
  transform:scale(1.05);
}

.balance-details{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:12px;
}

.balance-detail{
  background:#fff;
  border:1px solid #e4e5eb;
  border-radius:9px;
  padding:7px 4px;
}

.balance-detail span{
  display:block;
  font-size:10px;
  color:#777;
}

.balance-detail strong{
  display:block;
  margin-top:2px;
  font-size:12px;
}

.balance-delta{
  min-height:19px;
  margin-top:5px;
  font-size:13px;
  font-weight:900;
}

.balance-delta.up{
  color:#07963a;
}

.balance-delta.down{
  color:#d71932;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-bottom:13px;
}

button{
  width:100%;
  padding:13px 10px;
  border:0;
  border-radius:12px;
  font-size:14px;
  font-weight:800;
}

.buttons button,
.logout{
  min-height:52px;
}

.primary{
  background:linear-gradient(135deg,#ffd900,#ffb700);
  color:#171717;
  box-shadow:0 5px 14px rgba(255,193,0,.25);
}

.secondary{
  background:#fff;
  color:#171717;
  border:1px solid #dfe2eb;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.logout{
  background:linear-gradient(135deg,#ff4757,#c91832);
  color:#fff;
  margin-top:4px;
  margin-bottom:10px;
}

.card{
  width:100%;
  background:rgba(255,255,255,.92);
  border:1px solid #e2e5ee;
  border-radius:15px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:0 7px 20px rgba(0,0,0,.06);
}

.card h2{
  margin:0 0 8px;
  font-size:18px;
}

.card p{
  margin:0;
  font-size:14px;
  color:#666;
}

.message{
  min-height:18px;
  margin-top:9px;
  font-size:13px;
  color:#555;
}

.modal{
  display:none;
  position:fixed;
  z-index:1000;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  background:rgba(13,10,25,.78);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
  padding:8px;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.modal-box{
  width:100%;
  max-width:520px;
  max-height:calc(100dvh - 16px);
  overflow-x:hidden;
  overflow-y:auto;
  background:linear-gradient(180deg,#fff,#fffdf4);
  border:2px solid #e2bd31;
  border-radius:22px;
  padding:15px;
  position:relative;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.modal-box h2{
  margin:0 0 12px;
  padding-right:45px;
  font-size:21px;
}

.close-button{
  position:absolute;
  right:10px;
  top:10px;
  width:38px;
  height:38px;
  padding:0;
  border-radius:50%;
  background:#171717;
  border:2px solid #e2bd31;
  color:#fff;
  font-size:23px;
}

.form-label{
  display:block;
  margin:10px 0 5px;
  font-size:12px;
  font-weight:900;
  color:#555;
}

.form-input,
.form-select,
.form-textarea{
  width:100%;
  min-height:46px;
  padding:10px;
  border:2px solid #dfe2eb;
  border-radius:10px;
  background:#fff;
  font-size:15px;
  outline:none;
}

.form-textarea{
  resize:vertical;
  min-height:70px;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
  border-color:#e1b900;
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.info-box{
  background:#fff8d9;
  border:1px solid #ead58a;
  border-radius:11px;
  padding:10px;
  margin:9px 0;
  font-size:12px;
  line-height:1.45;
}

.status{
  margin-top:9px;
  padding:9px;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
  text-align:center;
}

.status.success{
  background:#e4f8eb;
  color:#087c35;
}

.status.error{
  background:#ffe5e8;
  color:#b31529;
}

.status.pending{
  background:#fff4ca;
  color:#735700;
}

.pix-box{
  text-align:center;
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-top:10px;
}

#pixQrCode{
  width:230px;
  min-height:230px;
  margin:10px auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

#pixQrCode img,
#pixQrCode canvas{
  max-width:100%;
  height:auto;
  margin:auto;
}

.pix-key{
  display:flex;
  gap:6px;
  align-items:stretch;
}

.pix-key input{
  flex:1;
  min-width:0;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:11px;
}

.copy-button{
  width:auto;
  min-width:90px;
  padding:8px;
  background:#171717;
  color:#fff;
  font-size:11px;
}

.pix-recipient{
  margin-top:8px;
  padding:8px;
  background:#f7f7f7;
  border-radius:8px;
  font-size:11px;
  color:#555;
}

.history-list{
  margin-top:8px;
}

.history-item{
  background:#fff;
  border:1px solid #dfe2eb;
  border-radius:10px;
  padding:11px;
  margin-bottom:7px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:900;
  font-size:13px;
}

.history-date{
  color:#777;
  font-size:10px;
  margin-top:4px;
}

.history-value{
  margin-top:5px;
  font-size:14px;
  font-weight:900;
}

.history-positive{
  color:#07963a;
}

.history-negative{
  color:#d71932;
}

.history-pending{
  color:#9a7300;
}

/* ROLETA */

.roulette-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}

.roulette-top strong{
  font-size:17px;
}

.roulette-balance{
  font-size:13px;
  font-weight:700;
  color:#666;
}

.sound-button{
  width:auto;
  min-width:76px;
  padding:9px 11px;
  background:#171717;
  color:#fff;
  font-size:12px;
  border-radius:8px;
}

.roulette-area{
  position:relative;
  width:100%;
  min-height:300px;
  height:min(315px,72vw);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  margin-bottom:6px;
  border-radius:20px;
  background:
    radial-gradient(
      circle at center,
      #5130a8 0%,
      #24124f 45%,
      #11091f 100%
    );
  border:2px solid #d8ad25;
}

.pointer{
  position:absolute;
  top:4px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  width:0;
  height:0;
  border-left:15px solid transparent;
  border-right:15px solid transparent;
  border-top:34px solid var(--roulette-accent);
  filter:drop-shadow(0 2px 2px #000);
}

.wheel{
  position:relative;
  width:min(285px,76vw);
  height:min(285px,76vw);
  max-width:285px;
  max-height:285px;
  border-radius:50%;
  padding:10px;
  background:
    radial-gradient(
      circle,
      #fff7bf 0%,
      #d7a920 49%,
      #fff1a0 51%,
      #9b6c00 59%,
      #f3d34e 67%,
      #7d5700 75%,
      #d7a920 84%,
      #5b3c00 100%
    );
  box-shadow:0 15px 35px rgba(0,0,0,.55);
  transition:transform 4.8s cubic-bezier(.12,.72,.12,1);
}

.wheel-inner{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  border:5px solid #f3d34e;
  background:
    repeating-conic-gradient(
      from -4.86deg,
      var(--roulette-red) 0deg 4.864deg,
      var(--roulette-black) 4.864deg 9.728deg
    );
}

.wheel-sector{
  position:absolute;
  left:50%;
  top:50%;
  width:50%;
  height:2px;
  transform-origin:0 50%;
  background:rgba(255,255,255,.45);
  z-index:2;
}

.wheel-number{
  position:absolute;
  left:50%;
  top:50%;
  width:31px;
  height:31px;
  margin-left:-15.5px;
  margin-top:-15.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  font-size:10px;
  font-weight:900;
  z-index:4;
}

.wheel-number.red{
  background:var(--roulette-red);
}

.wheel-number.black{
  background:var(--roulette-black);
}

.wheel-number.green{
  background:var(--roulette-green);
}

.result-highlight{
  box-shadow:
    0 0 0 3px #fff,
    0 0 12px 4px var(--roulette-accent);
}

.wheel-center-ring{
  position:absolute;
  left:50%;
  top:50%;
  width:104px;
  height:104px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  z-index:10;
  border:5px solid var(--roulette-accent);
  background:
    radial-gradient(
      circle at 35% 25%,
      #fff,
      #d9d9d9 38%,
      #777 65%,
      #222 100%
    );
  display:flex;
  align-items:center;
  justify-content:center;
}

.wheel-center-button{
  width:72px;
  height:72px;
  border-radius:50%;
  padding:0;
  border:3px solid var(--roulette-accent);
  background:linear-gradient(145deg,#ffdf45,#d89500);
  font-size:12px;
  font-weight:1000;
}

.result-panel{
  text-align:center;
  min-height:43px;
  margin-bottom:6px;
}

.result-number{
  font-size:23px;
  font-weight:900;
}

.result-red{
  color:#d71932;
}

.result-black{
  color:#111;
}

.result-green{
  color:#07963a;
}

.result-label{
  font-size:12px;
  color:#666;
  margin-top:2px;
}

.round-summary{
  display:none;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  margin:7px 0 8px;
  padding:9px;
  border-radius:12px;
  background:linear-gradient(135deg,#fffdf3,#fff7d6);
  border:1px solid #ead58a;
}

.round-summary.visible{
  display:grid;
}

.summary-item{
  padding:8px;
  border-radius:9px;
  background:rgba(255,255,255,.8);
  border:1px solid #eee4bb;
  text-align:center;
}

.summary-label{
  display:block;
  font-size:10px;
  color:#777;
}

.summary-value{
  display:block;
  margin-top:3px;
  font-size:14px;
  font-weight:900;
}

.summary-prize{
  color:#07963a;
}

.summary-loss{
  color:#d71932;
}

.bet-title{
  font-size:12px;
  font-weight:900;
  color:#666;
  margin:8px 0 5px;
}

.bet-amount{
  display:block;
  width:100%;
  height:48px;
  padding:0 12px;
  background:#fff;
  border:2px solid #dfe2eb;
  border-radius:10px;
  font-size:18px;
  font-weight:900;
  text-align:center;
}

.quick-values{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:6px;
}

.quick-value{
  min-height:42px;
  padding:7px 4px;
  font-size:12px;
  background:#fff;
  border:1px solid #dfe2eb;
}

.bet-types{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.bet-type{
  min-height:46px;
  background:#fff;
  border:2px solid #dfe2eb;
}

.bet-type.selected{
  border-color:#171717;
}

.red-button.selected{
  border-color:var(--roulette-red);
  background:#ffe3e7;
}

.black-button.selected{
  border-color:var(--roulette-black);
  background:#e8e8e8;
}

.number-section{
  margin-top:8px;
}

.number-toggle{
  min-height:44px;
  background:#fff;
  color:#444;
  border:1px solid #dfe2eb;
  font-size:12px;
}

.number-grid{
  display:none;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
  margin-top:6px;
}

.number-grid.visible{
  display:grid;
}

.number-button{
  min-height:38px;
  padding:7px 2px;
  font-size:11px;
  background:var(--roulette-black);
  color:#fff;
  border:2px solid transparent;
}

.number-button.red{
  background:var(--roulette-red);
}

.number-button.black{
  background:var(--roulette-black);
}

.number-button.zero{
  background:var(--roulette-green);
}

.number-button.selected{
  border-color:var(--roulette-accent);
}

.roulette-message{
  min-height:32px;
  text-align:center;
  margin:7px 0;
  font-size:13px;
  font-weight:900;
  line-height:1.4;
}

.win-message{
  color:#07963a;
}

.lose-message{
  color:#d71932;
}

.roulette-info{
  text-align:center;
  font-size:10px;
  line-height:1.4;
  color:#777;
  margin-top:7px;
}

@media(max-width:600px){

  .container{
    padding:12px 10px 18px;
  }

  .logo{
    font-size:25px;
  }

  .user{
    font-size:12px;
    max-width:155px;
  }

  .balance{
    padding:14px 10px;
  }

  .balance-value{
    font-size:29px;
  }

  .buttons{
    gap:8px;
  }

  .buttons button{
    min-height:52px;
    font-size:13px;
  }

  .card{
    padding:14px;
  }

  .modal{
    align-items:flex-start;
    padding:6px;
  }

  .modal-box{
    max-height:calc(100dvh - 12px);
    padding:11px;
    border-radius:17px;
  }

  .roulette-area{
    height:min(285px,70vw);
    min-height:235px;
  }

  .wheel{
    width:min(250px,68vw);
    height:min(250px,68vw);
  }

  .wheel-center-ring{
    width:88px;
    height:88px;
  }

  .wheel-center-button{
    width:62px;
    height:62px;
    font-size:10px;
  }
}

@media(max-width:380px){

  .balance-value{
    font-size:27px;
  }

  .balance-details{
    gap:3px;
  }

  .roulette-area{
    height:245px;
    min-height:220px;
  }

  .wheel{
    width:215px;
    height:215px;
  }

  .wheel-center-ring{
    width:78px;
    height:78px;
  }

  .wheel-center-button{
    width:56px;
    height:56px;
    font-size:9px;
  }

  .wheel-number{
    width:24px;
    height:24px;
    margin-left:-12px;
    margin-top:-12px;
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">JP<span>BET</span></div>
  <div class="user" id="userName">Usuário</div>
</header>

<div class="balance">

  <div class="balance-title">
    Saldo total
  </div>

  <div class="balance-value" id="balance">
    R$ 0,00
  </div>

  <div id="balanceDelta" class="balance-delta"></div>

  <div class="balance-details">

    <div class="balance-detail">
      <span>Disponível</span>
      <strong id="availableBalance">R$ 0,00</strong>
    </div>

    <div class="balance-detail">
      <span>Reservado</span>
      <strong id="reservedBalance">R$ 0,00</strong>
    </div>

    <div class="balance-detail">
      <span>Total</span>
      <strong id="totalBalance">R$ 0,00</strong>
    </div>

  </div>

</div>

<div class="buttons">

  <button class="primary" onclick="abrirRoleta()" type="button">
    🎰 JOGAR
  </button>

  <button class="secondary" onclick="depositar()" type="button">
    💰 DEPOSITAR
  </button>

  <button class="secondary" onclick="sacar()" type="button">
    💸 SACAR
  </button>

  <button class="secondary" onclick="historico()" type="button">
    📋 HISTÓRICO
  </button>

</div>

<div class="card">

  <h2>Minha conta</h2>

  <p>
    Bem-vindo à plataforma JPBET.
  </p>

  <div id="message" class="message"></div>

</div>

<button class="logout" onclick="sair()" type="button">
  SAIR DA CONTA
</button>

</div>

<div id="actionModal" class="modal">

  <div class="modal-box">

    <button
      class="close-button"
      onclick="fecharModal()"
      aria-label="Fechar"
      type="button"
    >
      ×
    </button>

    <h2 id="modalTitle">JPBET</h2>

    <div id="modalContent"></div>

  </div>

</div>

<script>

const API_URL="/api";

let configuracoes={
  roulette_enabled:"true",
  roulette_min_bet:"1",
  roulette_max_bet:"100",
  roulette_animation_ms:"4800",
  roulette_sound_enabled:"true",

  roulette_red_color:"#e51f35",
  roulette_black_color:"#171717",
  roulette_green_color:"#08a83e",
  roulette_accent_color:"#ffd43b",

  virtual_credits_mode:"true",
  virtual_credits_text:
    "Esta plataforma utiliza créditos virtuais para demonstração.",
  virtual_credits_disclaimer:
    "Os créditos desta versão não representam dinheiro real.",

  /*
    Aviso completo editável pelo administrador.
    Este é apenas o fallback caso a configuração
    ainda não esteja disponível.
  */
  virtual_credits_notice:
    "🎮 Esta versão utiliza exclusivamente créditos virtuais para demonstração. Os créditos não representam dinheiro real.",

  /* PIX */
  pix_enabled:"true",
  pix_key:"38135fb2-dd1f-44aa-ab51-d2670ee36c7d",
  pix_key_type:"aleatoria",
  pix_receiver_name:"João Paulo da Silva",
  pix_city:"Paramirim",
  pix_description:"JPBET",
  pix_txid:"***",
  pix_instructions:

function carregarUsuario(){

  }catch(error){

    window.location.href="index.html";

  }

async function atualizarContaServidor(){

  if(!usuarioAtual)return;

  try{

    const response=
      await fetch(
        `${API_URL}/account/${usuarioAtual.id}`
      );

    if(!response.ok)return;

    const data=
      await response.json();

    const user=
      data.user||
      data.usuario||
      data;

    if(user){

      usuarioAtual.balance=
        Number(
          user.balance||
          user.available_balance||
          0
        );

      usuarioAtual.reserved_balance=
        Number(
          user.reserved_balance||
          user.reservedBalance||
          0
        );

      localStorage.setItem(
        "jpbet_user",
        JSON.stringify(usuarioAtual)
      );

      atualizarSaldos(
        usuarioAtual.balance,
        usuarioAtual.reserved_balance,
        false
      );

    }

  }catch(error){

    console.warn(
      "Não foi possível atualizar o saldo.",
      error
    );

  }

}

function atualizarSaldos(
  saldo,
  reservado=0,
  mostrarVariacao=false,
  saldoAnterior=null
){

  saldo=Number(saldo||0);
  reservado=Number(reservado||0);

  const total=
    saldo+reservado;

  const anterior=
    saldoAnterior===null
      ?Number(usuarioAtual?.balance||saldo)
      :Number(saldoAnterior||0);

  const delta=
    saldo-anterior;

  document.getElementById(
    "balance"
  ).textContent=
    formatarSaldo(total);

  document.getElementById(
    "availableBalance"
  ).textContent=
    formatarSaldo(saldo);

  document.getElementById(
    "reservedBalance"
  ).textContent=
    formatarSaldo(reservado);

  document.getElementById(
    "totalBalance"
  ).textContent=
    formatarSaldo(total);

  const deltaElement=
    document.getElementById(
      "balanceDelta"
    );

  const balanceElement=
    document.getElementById(
      "balance"
    );

  if(
    mostrarVariacao&&
    delta!==0
  ){

    balanceElement.classList.remove(
      "balance-up",
      "balance-down"
    );

    void balanceElement.offsetWidth;

    balanceElement.classList.add(
      delta>0
        ?"balance-up"
        :"balance-down"
    );

    deltaElement.textContent=
      delta>0
        ?`▲ +${formatarSaldo(delta)}`
        :`▼ -${formatarSaldo(Math.abs(delta))}`;

    deltaElement.className=
      "balance-delta "+
      (delta>0?"up":"down");

    setTimeout(()=>{

      balanceElement.classList.remove(
        "balance-up",
        "balance-down"
      );

    },650);

  }

  if(usuarioAtual){

    usuarioAtual.balance=saldo;
    usuarioAtual.reserved_balance=reservado;

    localStorage.setItem(
      "jpbet_user",
      JSON.stringify(usuarioAtual)
    );

  }

}

function atualizarSaldo(
  valor,
  saldoAnterior=null,
  mostrarVariacao=true
){

  atualizarSaldos(
    Number(valor||0),
    Number(
      usuarioAtual?.reserved_balance||0
    ),
    mostrarVariacao,
    saldoAnterior
  );

}

function formatarSaldo(valor){

  return "R$ "+
    Number(valor||0)
      .toFixed(2)
      .replace(".",",");

}

/* =========================
   PIX BR CODE
========================= */

function campoPix(
  id,
  valor
){

  const texto=
    String(valor);

  const tamanho=
    texto.length
      .toString()
      .padStart(2,"0");

  return id+
    tamanho+
    texto;

}

function montarPayloadPix({
  chave,
  nome,
  cidade,
  valor,
  descricao,
  txid
}){

  chave=
    String(chave||"").trim();

  nome=
    removerAcentos(
      nome||
      "RECEBEDOR"
    )
    .substring(0,25)
    .toUpperCase();

  cidade=
    removerAcentos(
      cidade||
      "PARAMIRIM"
    )
    .substring(0,15)
    .toUpperCase();

  descricao=
    removerAcentos(
      descricao||
      ""
    )
    .substring(0,72);

  txid=
    String(
      txid||
      "***"
    )
    .trim()
    .substring(0,25);

  /*
    CAMPO 26
    00 = GUI
    01 = CHAVE PIX

    A chave fica diretamente no campo 01.
    Não existe um campo 00 adicional envolvendo
    a chave.
  */

  let merchantAccount=
    campoPix(
      "00",
      "BR.GOV.BCB.PIX"
    )+
    campoPix(
      "01",
      chave
    );

  if(descricao){

    merchantAccount+=
      campoPix(
        "02",
        descricao
      );

  }

  let payloadSemCrc=
    "000201"+
    campoPix(
      "26",
      merchantAccount
    )+
    "52040000"+
    "5303986"+
    campoPix(
      "54",
      Number(valor).toFixed(2)
    )+
    "5802BR"+
    campoPix(
      "59",
      nome
    )+
    campoPix(
      "60",
      cidade
    )+
    campoPix(
      "62",
      campoPix(
        "05",
        txid
      )
    )+
    "6304";

  return payloadSemCrc+
    crc16(payloadSemCrc);

}

function crc16(str){

  let crc=0xFFFF;

  for(
    let i=0;
    i<str.length;
    i++
  ){

    crc^=
      str.charCodeAt(i)<<8;

    for(
      let j=0;
      j<8;
      j++
    ){

      if(crc&0x8000){

        crc=
          (crc<<1)^0x1021;

      }else{

        crc<<=1;

      }

      crc&=0xFFFF;

    }

  }

  return crc
    .toString(16)
    .toUpperCase()
    .padStart(4,"0");

}

function removerAcentos(text){

  return String(text)
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}

function copiarPix(){

  const campo=
    document.getElementById(
      "pixCopyField"
    );

  if(!campo)return;

  if(
    navigator.clipboard&&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(campo.value)
      .then(()=>{

        mostrarStatus(
          "depositStatus",
          "Código Pix copiado.",
          "success"
        );

      })
      .catch(()=>{

        copiarPixFallback(campo);

      });

  }else{

    copiarPixFallback(campo);

  }

}

function copiarPixFallback(campo){

  try{

    campo.focus();
    campo.select();
    campo.setSelectionRange(
      0,
      campo.value.length
    );

    document.execCommand("copy");

    mostrarStatus(
      "depositStatus",
      "Código Pix copiado.",
      "success"
    );

  }catch(error){

    mostrarStatus(
      "depositStatus",
      "Não foi possível copiar automaticamente. Selecione e copie o código manualmente.",
      "error"
    );

  }

}

async function confirmarSaque(){

  const amount=
    Number(
      String(
        document.getElementById(
          "withdrawAmount"
        )?.value||""
      ).replace(",",".")
    );

  const pixKey=
    String(
      document.getElementById(
        "withdrawPixKey"
      )?.value||""
    ).trim();

  const note=
    String(
      document.getElementById(
        "withdrawNote"
      )?.value||""
    ).trim();

  const disponivel=
    Number(
      usuarioAtual?.balance||0
    );

  if(
    !Number.isFinite(amount)||
    amount<=0
  ){

    mostrarStatus(
      "withdrawStatus",
      "Informe um valor válido.",
      "error"
    );

    return;

  }

  if(amount>disponivel){

    mostrarStatus(
      "withdrawStatus",
      "Saldo disponível insuficiente.",
      "error"
    );

    return;

  }

  if(!pixKey){

    mostrarStatus(
      "withdrawStatus",
      "Informe sua chave Pix.",
      "error"
    );

    return;

  }

  try{

    const response=
      await fetch(
        `${API_URL}/withdrawals`,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            userId:usuarioAtual.id,
            amount,
            pixKey,
            playerNote:note
          })
        }
      );

    const data=
      await response.json();

    if(
      !response.ok||
      !data.ok
    ){

      throw new Error(
        data.message||
        "Não foi possível solicitar o saque."
      );

    }

    await atualizarContaServidor();

    mostrarStatus(
      "withdrawStatus",
      `Saque de ${formatarSaldo(amount)} solicitado. O valor está reservado e aguarda análise do administrador.`,
      "pending"
    );

  }catch(error){

    mostrarStatus(
      "withdrawStatus",
      error.message||
      "Erro ao solicitar saque.",
      "error"
    );

  }

}

        </button>
      `;

    return;

  }

  let html=
    `<div class="history-list">`;

  lista.forEach(item=>{

    const tipo=
      String(
        item.type||
        item.tipo||
        "movimentação"
      );

    const valor=
      Number(
        item.amount||
        item.valor||
        0
      );

    const data=
      item.created_at||
      item.createdAt||
      item.data||
      "";

    const positivo=
      valor>0;

    const classe=
      positivo
        ?"history-positive"
        :valor===0
          ?"history-pending"
          :"history-negative";

    html+=`

      <div class="history-item">

        <div class="history-top">

          <span>
            ${escapeHtml(
              formatarTipoTransacao(tipo)
            )}
          </span>

          <span class="${classe}">

            ${
              positivo
                ?"+"
                :""
            }${formatarSaldo(valor)}

          </span>

        </div>

        <div class="history-date">
          ${formatarData(data)}
        </div>

      </div>

    `;

  });

  html+=`

    </div>

    <button
      class="primary"
      onclick="fecharModal()"
      type="button"
    >
      FECHAR
    </button>

  `;

  container.innerHTML=html;

}

function formatarTipoTransacao(tipo){

  const nomes={

    roulette_bet:
      "Aposta na roleta",

    roulette_win:
      "Prêmio da roleta",

    deposit:
      "Depósito",

    deposit_pending:
      "Depósito pendente",

    deposit_approved:
      "Depósito aprovado",

    deposit_rejected:
      "Depósito rejeitado",

    withdrawal_reserved:
      "Saque reservado",

    withdrawal_paid:
      "Saque pago",

    withdrawal_refunded:
      "Saque devolvido",

    withdrawal:
      "Saque"

  };

  return nomes[tipo]||tipo;

}

function formatarData(data){

  if(!data)return"";

  const d=
    new Date(data);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return String(data);

  }

  return d.toLocaleString(
    "pt-BR",
    {
      dateStyle:"short",
      timeStyle:"short"
    }
  );

}

function obterCorNumero(numero){

  if(Number(numero)===0)
    return"green";

  return numerosVermelhos.includes(
    Number(numero)
  )
    ?"red"
    :"black";

function criarRoda(){

  const setores=
    document.getElementById(
      "wheelSectors"
    );

  const numeros=
    document.getElementById(
      "wheelNumbers"
    );

  if(!setores||!numeros)return;

  setores.innerHTML="";
  numeros.innerHTML="";

  const quantidade=37;

  for(
    let numero=0;
    numero<quantidade;
    numero++
  ){

    const angulo=
      numero*(360/quantidade);

    const setor=
      document.createElement("div");

    setor.className=
      "wheel-sector";

    setor.style.transform=
      `rotate(${angulo}deg)`;

    setores.appendChild(setor);

    const elemento=
      document.createElement("div");

    elemento.className=
      `wheel-number ${
        obterCorNumero(numero)
      }`;

    elemento.id=
      `wheel-number-${numero}`;

    const anguloTexto=
      angulo+
      (360/quantidade)/2;

    const raio=100;

    const radianos=
      ((anguloTexto-90)*
      Math.PI)/180;

    const x=
      Math.cos(radianos)*
      raio;

    const y=
      Math.sin(radianos)*
      raio;

    elemento.style.transform=
      `translate(${x}px,${y}px)`;

    elemento.textContent=
      numero;

    numeros.appendChild(elemento);

  }

}

function obterAvisoCreditosVirtuais(){

  }

  /*
    Compatibilidade com instalações antigas:
    caso o novo campo ainda não exista,
    monta o aviso usando os dois campos antigos.
  */

  const texto=
    String(
      configuracoes.virtual_credits_text||
      ""
    ).trim();

  const disclaimer=
    String(
      configuracoes.virtual_credits_disclaimer||
      ""
    ).trim();

  if(texto&&disclaimer){

    return `${texto} ${disclaimer}`;

  }

  if(texto){

    return texto;

  }

  if(disclaimer){

    return disclaimer;

  }

  return "🎮 Esta versão utiliza exclusivamente créditos virtuais para demonstração. Os créditos não representam dinheiro real.";

}

function obterAudioContext(){

  if(!audioContext){

    const AudioCtx=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioCtx)return null;

    audioContext=
      new AudioCtx();

  }

  if(
    audioContext.state===
    "suspended"
  ){

    audioContext.resume();

  }

  return audioContext;

}

function tocarSom(
  frequencia,
  duracao,
  tipo="sine",
  volume=.045
){

  if(
    String(
      configuracoes.roulette_sound_enabled
    ).toLowerCase()==="false"
  )return;

  const ctx=
    obterAudioContext();

  if(!ctx)return;

  const oscillator=
    ctx.createOscillator();

  const gain=
    ctx.createGain();

  oscillator.type=
    tipo;

  oscillator.frequency.value=
    frequencia;

  gain.gain.setValueAtTime(
    volume,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime+duracao
  );

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start();

  oscillator.stop(
    ctx.currentTime+duracao
  );

}

function obterDuracaoAnimacao(){

  const valor=
    Number(
      configuracoes.roulette_animation_ms
    );

  if(
    Number.isFinite(valor)&&
    valor>=1000&&
    valor<=15000
  ){

    return valor;

  }

  return 4800;

}

function animarRoleta(
  numeroResultado
){

  const wheel=
    document.getElementById(
      "rouletteWheel"
    );

  if(!wheel)return;

  const setor=
    360/37;

  const anguloResultado=
    numeroResultado*
    setor;

  const voltas=
    6+
    Math.floor(
      Math.random()*3
    );

  const alvo=
    360-
    anguloResultado-
    setor/2;

  wheelRotation+=
    voltas*360+
    alvo-
    (wheelRotation%360);

  const duracao=
    obterDuracaoAnimacao();

  wheel.style.transition=
    `transform ${duracao}ms cubic-bezier(.12,.72,.12,1)`;

  wheel.style.transform=
    `rotate(${wheelRotation}deg)`;

  for(
    let i=0;
    i<18;
    i++
  ){

    setTimeout(
      ()=>{
        if(rodadaEmAndamento)
          somTick();
      },
      duracao*(i+1)/18
    );

  }

}

========================= */

async function girarRoleta(){

  if(rodadaEmAndamento)return;

  if(!usuarioAtual)return;

  const input=
    document.getElementById(
      "betAmount"
    );

  if(!input)return;

  const bet=
    Number(
      String(
        input.value
      ).replace(",",".")
    );

  const minBet=
    Number(
      configuracoes.roulette_min_bet||1
    );

  const maxBet=
    Number(
      configuracoes.roulette_max_bet||100
    );

  if(
    !Number.isFinite(bet)||
    bet<minBet||
    bet>maxBet
  ){

    mostrarMensagem(
      `A aposta deve estar entre ${minBet} e ${maxBet} créditos.`,
      "lose-message"
    );

    return;

  }

  if(!tipoAposta){

    mostrarMensagem(
      "Escolha vermelho, preto ou um número.",
      "lose-message"
    );

    return;

  }

  if(
    tipoAposta==="number"&&
    numeroAposta===null
  ){

    mostrarMensagem(
      "Escolha um número da roleta.",
      "lose-message"
    );

    return;

  }

  const saldoAntes=
    Number(
      usuarioAtual.balance||0
    );

  if(saldoAntes<bet){

    mostrarMensagem(
      "Saldo insuficiente.",
      "lose-message"
    );

    return;

  }

  rodadaEmAndamento=true;

  const centerButton=
    document.getElementById(
      "centerSpinButton"
    );

  if(centerButton){

    centerButton.disabled=true;
    centerButton.textContent=
      "GIRANDO";

  }

  mostrarMensagem(
    "Preparando a rodada...",
    ""
  );

  try{

    const response=
      await fetch(
        `${API_URL}/roulette/spin`,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            userId:
              usuarioAtual.id,
            betAmount:bet,
            betType:
              tipoAposta,
            betValue:
              numeroAposta
          })
        }
      );

    const data=
      await response.json();

    if(
      !response.ok||
      !data.ok
    ){

      throw new Error(
        data.message||
        "Não foi possível realizar a rodada."
      );

    }

    const numero=
      Number(
        data.spin.number
      );

    const cor=
      data.spin.color;

    const ganhou=
      Boolean(
        data.spin.won
      );

    const premio=
      Number(
        data.spin.prize||0
      );

    const saldoServidor=
      Number(
        data.user.balance||0
      );

    mostrarMensagem(
      "A roleta está girando...",
      ""
    );

    somInicio();

    animarRoleta(numero);

    await new Promise(
      resolve=>
        setTimeout(
          resolve,
          obterDuracaoAnimacao()+120
        )
    );

    const resultNumber=
      document.getElementById(
        "resultNumber"
      );

    const resultLabel=
      document.getElementById(
        "resultLabel"
      );

    if(resultNumber){

      resultNumber.textContent=
        numero;

      resultNumber.className=
        `result-number result-${cor}`;

    }

    if(resultLabel){

      resultLabel.textContent=
        cor==="red"
          ?"🔴 Vermelho"
          :cor==="black"
            ?"⚫ Preto"
            :"🟢 Verde";

    }

    destacarResultado(numero);

    atualizarSaldo(
      saldoServidor,
      saldoAntes,
      true
    );

    atualizarSaldosDaRoleta(
      saldoServidor
    );

    atualizarResumoRodada({
      bet,
      numero,
      cor,
      premio,
      saldoFinal:
        saldoServidor,
      ganhou
    });

    if(ganhou){

      mostrarMensagem(
        `🎉 VOCÊ GANHOU ${formatarSaldo(premio)}! Saldo final: ${formatarSaldo(saldoServidor)}.`,
        "win-message"
      );

      somVitoria();

    }else{

      mostrarMensagem(
        `Resultado: ${numero}. Você perdeu ${formatarSaldo(bet)}. Saldo final: ${formatarSaldo(saldoServidor)}.`,
        "lose-message"
      );

      somDerrota();

    }

    if(centerButton){

      centerButton.disabled=false;
      centerButton.textContent=
        "GIRAR";

    }

    rodadaEmAndamento=false;

  }catch(error){

    console.error(error);

    mostrarMensagem(
      error.message||
      "Erro ao executar a roleta.",
      "lose-message"
    );

    if(centerButton){

      centerButton.disabled=false;
      centerButton.textContent=
        "GIRAR";

    }

    rodadaEmAndamento=false;

  }

}

/* =========================
   SAIR
========================= */

function sair(){

  localStorage.removeItem(
    "jpbet_user"
  );

  localStorage.removeItem(
    "jpbet_token"
  );

  window.location.href=
    "index.html";

}

/* =========================
   EVENTOS
========================= */

document
  .getElementById(
    "actionModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target===this&&
        !rodadaEmAndamento
      ){

        fecharModal();

      }

    }
  );

document.addEventListener(
  "keydown",
  function(event){

    if(event.key!=="Escape")
      return;

    const modal=
      document.getElementById(
        "actionModal"
      );

    if(
      modal&&
      modal.style.display==="flex"&&
      !rodadaEmAndamento
    ){

      fecharModal();

    }

  }
);

/* =========================
   INÍCIO
========================= */

async function iniciarDashboard(){

  await carregarConfiguracoes();

  aplicarConfiguracoes();

  carregarUsuario();

}

iniciarDashboard();

</script>
