<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MyBets - Dashboard</title>
<style>
:root{--gold:#f5c542;--gold2:#ffdf75;--green:#22ef76;--bg:#05080d;--card:#0b1018;--card2:#111823;--border:rgba(255,255,255,.1);--muted:#a7adba;--nav:#05070b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,rgba(245,197,66,.09),transparent 38%),#05080d;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden;padding-bottom:86px}button,input{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:100;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(4,8,13,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.12)}.logo{font-size:31px;font-weight:900;font-style:italic;letter-spacing:-2px;color:#fff}.logo b{color:var(--gold)}.header-right{display:flex;align-items:center;gap:10px}.header-balance{min-width:135px;padding:8px 13px;border:1px solid rgba(245,197,66,.3);border-radius:18px;background:rgba(8,12,18,.9);color:#fff;font-size:12px}.header-balance strong{display:block;color:var(--gold2);font-size:19px;margin-top:1px}.menu-button{width:44px;height:44px;border:1px solid rgba(255,255,255,.13);border-radius:14px;background:#0c131d;color:#fff;font-size:23px}
.container{width:min(1050px,calc(100% - 24px));margin:auto;padding:18px 0 28px}.welcome,.balance-card,.section-title,.games,.history-list{display:none}
.drawer-backdrop,.modal{position:fixed;inset:0;z-index:500;display:none;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:10px}.drawer-backdrop{align-items:stretch;justify-content:flex-end;padding:0}.drawer{width:min(340px,88%);height:100%;padding:20px;background:#0a1018;border-left:1px solid var(--border)}.drawer-button{width:100%;margin-top:10px;padding:14px;border:1px solid var(--border);border-radius:13px;background:var(--card2);color:#fff;text-align:left;font-weight:800}.close{border:0;background:#101722;color:#fff;width:44px;height:44px;border-radius:13px;font-size:28px}.drawer .close{float:right}
.modal-content{position:relative;width:min(600px,100%);max-height:calc(100vh - 20px);overflow:auto;padding:18px 14px 26px;border-radius:24px;background:linear-gradient(180deg,#0c1119,#080c12);border:1px solid rgba(255,255,255,.12);box-shadow:0 25px 80px rgba(0,0,0,.7)}.modal-title{margin:0 52px 12px;color:var(--gold2);font-size:30px;font-weight:900}
.roulette-area{position:relative;width:min(520px,calc(100vw - 24px));aspect-ratio:1;margin:8px auto 0;filter:drop-shadow(0 15px 28px rgba(0,0,0,.75))}.roulette-area:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:7px solid #8d5a07;box-shadow:0 0 0 2px #241704,0 0 28px rgba(255,200,50,.32);pointer-events:none;z-index:20}
#wheel{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;will-change:transform;z-index:10}.roulette-svg{width:100%;height:100%;display:block;overflow:visible}.roulette-pointer{position:absolute;z-index:80;left:50%;top:-25px;transform:translateX(-50%);width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:54px solid #ffd83d;filter:drop-shadow(0 5px 6px rgba(0,0,0,.8));pointer-events:none}.roulette-pointer:after{content:"";position:absolute;left:-10px;top:-46px;width:20px;height:20px;border-radius:50%;background:#ff3141;box-shadow:0 0 14px rgba(255,49,65,.7)}
.roulette-center-cover{position:absolute;z-index:48;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 45% 35%,#1e1e1e,#080808 68%);border:7px solid #e2a91d;box-shadow:0 0 0 4px #5b3906,0 0 0 7px #d49413,0 0 28px rgba(255,190,25,.4);pointer-events:none}.roulette-center-button{position:absolute!important;z-index:60;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;width:27%!important;min-width:120px;max-width:150px;aspect-ratio:1;border-radius:50%;border:0;background:transparent!important;color:#fff!important;font-weight:900;font-size:clamp(18px,4.3vw,26px);line-height:1.08;box-shadow:none!important;padding:0}.roulette-center-button:before{content:"MyBets";display:block;font-size:clamp(18px,4vw,25px);font-style:italic;font-weight:900;margin-bottom:8px}.roulette-center-button:after{content:"GIRAR";display:block;color:#ffd33e;font-size:clamp(20px,4.5vw,28px);font-weight:900}
.roulette-result{text-align:center;min-height:24px;margin:12px 0 8px;font-weight:800;color:#e9ecf1}.roulette-bet{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin:8px auto 0}.roulette-bet>button{width:58px;height:58px;border:1px solid #b27b0d;border-radius:15px;background:#0d131c;color:#fff;font-size:31px;font-weight:900}.roulette-bet-field{flex:1;max-width:540px}.roulette-bet-field label{display:block;color:#cfd4dc;font-size:16px;text-transform:none;margin:0 0 7px 2px}.roulette-bet-field input{width:100%;height:58px;padding:0 20px;border-radius:15px;border:1px solid #465366;background:#05080d;color:#fff;font-size:28px;font-weight:900;text-align:left;outline:none}.quick-bets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}.quick-bets button{height:58px;border:1px solid #f0c331;border-radius:15px;background:linear-gradient(180deg,#111a24,#0a1018);color:#fff;font-size:18px;font-weight:900;box-shadow:0 0 13px rgba(240,195,49,.13)}.quick-bets button:active{transform:scale(.98)}
.spin-button{width:100%;height:64px;margin-top:12px;border:0;border-radius:16px;background:linear-gradient(180deg,#ffe27a,#e0a51b);color:#07090d;font-size:30px;font-weight:1000;letter-spacing:1px;box-shadow:0 8px 22px rgba(221,164,28,.25)}.field{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(245,197,66,.25);background:#090b10;color:#fff;margin-top:8px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:82px;z-index:400;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(4,7,12,.97);border-top:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px)}.nav-item{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:#b7bdca;font-size:12px;font-weight:700}.nav-item span{font-size:25px;line-height:1}.nav-item.active{color:#ffe04c}.nav-item.active:after{content:"";width:82px;height:4px;border-radius:4px;background:#ffe04c;margin-top:2px}
@media(max-width:600px){.header{height:66px;padding:0 12px}.logo{font-size:27px}.header-balance{min-width:122px}.modal{padding:0}.modal-content{width:100%;height:100%;max-height:none;border-radius:0;padding:16px 10px 100px}.modal-title{font-size:28px}.roulette-area{width:min(510px,calc(100vw - 18px));margin-top:10px}.roulette-bet{margin-top:13px}.roulette-bet>button{width:55px;height:62px}.roulette-bet-field input{height:62px}.quick-bets button{height:58px}.bottom-nav{height:78px}}
</style>
</head>
<body>
<header class="header"><div class="logo">My<b>Bets</b></div><div class="header-right"><div class="header-balance">Saldo<strong id="headerBalance">R$ 0,00</strong></div><button class="menu-button" type="button" onclick="openMenu()">☰</button></div></header>
<main class="container">
<section class="welcome"><h1>Olá, <span id="userName">Jogador</span>!</h1></section>
<section class="balance-card"><div class="balance-value">R$ <span id="mainBalance">0,00</span></div><button onclick="openDeposit()">DEPOSITAR</button><button onclick="openWithdraw()">SACAR</button></section>
<h2 class="section-title">Jogos</h2><section class="games"><article class="game-card"><h3>Roleta MyBets</h3><button onclick="openRoulette()">JOGAR ROLETA</button></article><article class="game-card"><h3>Jogos</h3><button onclick="location.href='/games.html'">VER JOGOS</button></article></section>
<section class="history-list" id="history"></section>
</main>
<div class="drawer-backdrop" id="menu" onclick="if(event.target===this)closeMenu()"><aside class="drawer"><button class="close" type="button" onclick="closeMenu()">×</button><h2>Menu</h2><button class="drawer-button" onclick="openDeposit();closeMenu()">Depositar</button><button class="drawer-button" onclick="openWithdraw();closeMenu()">Sacar</button><button class="drawer-button" onclick="openRoulette();closeMenu()">Roleta MyBets</button><button class="drawer-button" onclick="logout()">Sair</button></aside></div>
<div class="modal" id="rouletteModal"><div class="modal-content"><button class="close" type="button" onclick="closeRoulette()" style="position:absolute;right:12px;top:12px">×</button><h2 class="modal-title">Roleta MyBets</h2><div class="roulette-area"><div class="roulette-pointer"></div><div id="wheel"><svg id="rouletteSvg" class="roulette-svg" viewBox="0 0 500 500" aria-label="Roleta MyBets"></svg></div><div class="roulette-center-cover"></div><button class="roulette-center-button" id="spinButton" type="button" onclick="spinRoulette()">GIRAR</button></div><div class="roulette-result" id="rouletteResult">Defina sua aposta e gire.</div><div class="roulette-bet"><button type="button" onclick="changeBet(-0.5)">−</button><div class="roulette-bet-field"><label>Valor da aposta</label><input id="betAmount" type="number" min="0.5" max="100" step="0.5" value="0.5" inputmode="decimal"></div><button type="button" onclick="changeBet(0.5)">+</button></div><div class="quick-bets"><button onclick="setBet(.5)">0,50</button><button onclick="setBet(1)">1</button><button onclick="setBet(5)">5</button><button onclick="setBet(10)">10</button><button onclick="setBet(25)">25</button><button onclick="setBet(100)">100</button></div><button class="spin-button" id="bottomSpinButton" onclick="spinRoulette()">GIRAR</button></div></div>
<div class="modal" id="depositModal"><div class="modal-content"><button class="close" onclick="closeDeposit()" style="position:absolute;right:12px;top:12px">×</button><h2 class="modal-title">Depositar</h2><p>Informe o valor do depósito.</p><input class="field" id="depositAmount" type="number" min="1" step="0.01" placeholder="R$ 0,00"><button class="spin-button" onclick="requestDeposit()">SOLICITAR DEPÓSITO</button></div></div>
<div class="modal" id="withdrawModal"><div class="modal-content"><button class="close" onclick="closeWithdraw()" style="position:absolute;right:12px;top:12px">×</button><h2 class="modal-title">Sacar</h2><p>Informe o valor e sua chave Pix.</p><input class="field" id="withdrawAmount" type="number" min="1" step="0.01" placeholder="Valor"><input class="field" id="withdrawPixKey" type="text" placeholder="Chave Pix"><button class="spin-button" onclick="requestWithdraw()">SOLICITAR SAQUE</button></div></div>
<div class="toast" id="toast"></div>
<nav class="bottom-nav"><button class="nav-item active" onclick="closeRoulette()"><span>⌂</span>Início</button><button class="nav-item active" onclick="openRoulette()"><span>◉</span>Roleta</button><button class="nav-item" onclick="location.href='/games.html'"><span>⌁</span>Jogos</button><button class="nav-item" onclick="openDeposit()"><span>▣</span>Depósito</button><button class="nav-item" onclick="document.getElementById('history').scrollIntoView({behavior:'smooth'})"><span>◷</span>Histórico</button></nav>
<script>
const API='/api';let user=null,token=null,settings={roulette_min_bet:'0.50',roulette_max_bet:'100',roulette_animation_ms:'4800'};let rotation=0,spinning=false;const $=id=>document.getElementById(id);const money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.remove('show'),2800)}function headers(){return {'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}}function session(){try{user=JSON.parse(localStorage.getItem('jpbet_user')||'null');token=localStorage.getItem('jpbet_token')||null}catch{user=null}if(!user?.id){location.href='/';return false}$('userName').textContent=user.name||user.nome||user.username||'Jogador';return true}function renderUser(u){user={...user,...u};$('mainBalance').textContent=money(user.balance);$('headerBalance').textContent='R$ '+money(user.balance);localStorage.setItem('jpbet_user',JSON.stringify(user))}async function loadSettings(){try{const r=await fetch(`${API}/settings/public`);const d=await r.json();settings={...settings,...(d.settings||{})}}catch(e){console.warn(e)}}async function loadAccount(){try{const r=await fetch(`${API}/account/${encodeURIComponent(user.id)}`,{headers:headers()});if(r.ok){const d=await r.json();renderUser(d.user||d.account||d)}}catch(e){console.warn(e)}}async function loadHistory(){try{const r=await fetch(`${API}/transactions/${encodeURIComponent(user.id)}`,{headers:headers()});if(!r.ok)return;const d=await r.json(),list=d.transactions||d.history||d.data||[];const el=$('history');el.innerHTML='';if(!Array.isArray(list)||!list.length){el.innerHTML='<div>Nenhuma movimentação encontrada.</div>';return}list.slice(0,30).forEach(x=>{const v=Number(x.amount??x.value??0)||0,row=document.createElement('div');row.className='history-item';row.innerHTML=`<strong>${String(x.type||x.description||'Movimentação').replace(/[&<>]/g,'')}</strong><span>${v>0?'+':''}${money(v)}</span>`;el.appendChild(row)})}catch(e){console.warn(e)}}function openMenu(){$('menu').style.display='flex'}function closeMenu(){$('menu').style.display='none'}function openDeposit(){$('depositAmount').value='';$('depositModal').style.display='flex'}function closeDeposit(){$('depositModal').style.display='none'}async function requestDeposit(){const amount=Number($('depositAmount').value);if(!(amount>0))return toast('Informe um valor válido.');try{const r=await fetch(`${API}/deposits`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount})}),d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível solicitar o depósito.');closeDeposit();toast('Solicitação de depósito enviada.');await loadAccount();await loadHistory()}catch(e){toast(e.message)}}function openWithdraw(){$('withdrawAmount').value='';$('withdrawPixKey').value='';$('withdrawModal').style.display='flex'}function closeWithdraw(){$('withdrawModal').style.display='none'}async function requestWithdraw(){const amount=Number($('withdrawAmount').value),pixKey=$('withdrawPixKey').value.trim();if(!(amount>0))return toast('Informe um valor válido.');if(!pixKey)return toast('Informe sua chave Pix.');try{const r=await fetch(`${API}/withdrawals`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,amount,pixKey})}),d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível solicitar o saque.');closeWithdraw();toast('Saque solicitado e enviado para análise.');await loadAccount();await loadHistory()}catch(e){toast(e.message)}}function openRoulette(){const min=Number(settings.roulette_min_bet||.5),max=Number(settings.roulette_max_bet||100);$('betAmount').min=min;$('betAmount').max=max;$('rouletteModal').style.display='flex';renderWheel()}function closeRoulette(){if(!spinning)$('rouletteModal').style.display='none'}function setBet(v){const min=Number($('betAmount').min||.5),max=Number($('betAmount').max||100);$('betAmount').value=Math.min(max,Math.max(min,Number(v)||min))}function changeBet(delta){setBet(Number($('betAmount').value||.5)+delta)}function polar(r,d){const a=(d-90)*Math.PI/180;return{x:250+r*Math.cos(a),y:250+r*Math.sin(a)}}function path(r,a,b){const p=polar(r,a),q=polar(r,b),large=b-a>180?1:0;return`M250 250 L${p.x} ${p.y} A${r} ${r} 0 ${large} 1 ${q.x} ${q.y} Z`}function renderWheel(){const svg=$('rouletteSvg');if(!svg)return;svg.innerHTML='';const ns='http://www.w3.org/2000/svg';const prizes=[{label:'3X',center:315},{label:'5X',center:45},{label:'10X',center:135},{label:'2X',center:225}];const goldCenters=[0,90,180,270];goldCenters.forEach((c)=>{let p=document.createElementNS(ns,'path');p.setAttribute('d',path(238,c-8,c+8));p.setAttribute('fill','#e7ad25');p.setAttribute('stroke','#f6c93d');p.setAttribute('stroke-width','2');svg.appendChild(p)});prizes.forEach(pr=>{let p=document.createElementNS(ns,'path');p.setAttribute('d',path(238,pr.center-37,pr.center+37));p.setAttribute('fill','#020202');p.setAttribute('stroke','#f0bb2b');p.setAttribute('stroke-width','2');svg.appendChild(p);const q=polar(155,pr.center),t=document.createElementNS(ns,'text');t.textContent=pr.label;t.setAttribute('x',q.x);t.setAttribute('y',q.y);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-family','Arial,Helvetica,sans-serif');t.setAttribute('font-size',pr.label==='10X'?'46':'54');t.setAttribute('font-weight','900');t.setAttribute('font-style','italic');t.setAttribute('fill','#27ec70');t.setAttribute('stroke','#04130a');t.setAttribute('stroke-width','4');t.setAttribute('paint-order','stroke fill');svg.appendChild(t)});let ring=document.createElementNS(ns,'circle');ring.setAttribute('cx',250);ring.setAttribute('cy',250);ring.setAttribute('r',238);ring.setAttribute('fill','none');ring.setAttribute('stroke','#b27509');ring.setAttribute('stroke-width','12');svg.appendChild(ring);$('wheel').style.transform=`rotate(${rotation}deg)`}async function spinRoulette(){if(spinning)return;const bet=Number($('betAmount').value),min=Number(settings.roulette_min_bet||.5),max=Number(settings.roulette_max_bet||100);if(!(bet>=min&&bet<=max))return toast(`A aposta deve estar entre ${money(min)} e ${money(max)}.`);if(bet>Number(user.balance||0))return toast('Saldo insuficiente.');spinning=true;$('spinButton').disabled=true;$('bottomSpinButton').disabled=true;$('spinButton').textContent='GIRANDO...';try{const r=await fetch(`${API}/roulette/spin`,{method:'POST',headers:headers(),body:JSON.stringify({userId:user.id,betAmount:bet,betType:'roulette',rouletteId:'sorte'})});const d=await r.json();if(!r.ok)throw Error(d.message||'Não foi possível realizar a rodada.');const spin=d.spin||d.result||d;if(!Number.isInteger(Number(spin.index))||Number(spin.index)<0||Number(spin.index)>=16)throw Error('Resultado inválido.');const idx=Number(spin.index),group=Math.floor(idx/4),isPrize=idx%4===2;const center=[315,45,135,225][group];const target=((360-center-(rotation%360))+360)%360;const turns=7+Math.floor(Math.random()*2),dest=rotation+turns*360+target,dur=Math.max(1800,Number(settings.roulette_animation_ms)||4800),start=performance.now(),from=rotation;await new Promise(resolve=>{function frame(now){const p=Math.min(1,(now-start)/dur),e=1-Math.pow(1-p,3),r=from+(dest-from)*e;$('wheel').style.transform=`rotate(${r}deg)`;if(p<1)return requestAnimationFrame(frame);rotation=dest;$('wheel').style.transform=`rotate(${dest}deg)`;resolve()}requestAnimationFrame(frame)});await loadAccount();await loadHistory();toast(Number(spin.prize)>0?`Você ganhou ${money(spin.prize)}!`:'Rodada finalizada.')}catch(e){console.error(e);toast(e.message)}finally{spinning=false;$('spinButton').disabled=false;$('bottomSpinButton').disabled=false;$('spinButton').textContent='GIRAR'}}function logout(){localStorage.removeItem('jpbet_user');localStorage.removeItem('jpbet_token');location.href='/'}async function init(){if(!session())return;renderUser(user);await loadSettings();await loadAccount();await loadHistory();renderWheel()}init();document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeRoulette();closeDeposit();closeWithdraw();closeMenu()}});
</script>
</body>
</html>
