<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPBET - Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }
    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #191d27 0%,
          #0b0d12 48%,
          #07080b 100%
        );
      color: white;
    }
    button,
    input {
      font-family: inherit;
    }
    button {
      cursor: pointer;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 14px;
    }
    /* =========================
       CABEÇALHO
    ========================= */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .logo span {
      opacity: 0.55;
    }
    .user {
      font-size: 13px;
      opacity: 0.7;
      text-align: right;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* =========================
       SALDO
    ========================= */
    .balance {
      background: linear-gradient(
        145deg,
        #1a1e27,
        #12151c
      );
      border: 1px solid #272c36;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .balance-title {
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 4px;
    }
    .balance-value {
      font-size: 28px;
      font-weight: 900;
    }
    /* =========================
       BOTÕES PRINCIPAIS
    ========================= */
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
    }
    .primary {
      background: white;
      color: #111;
    }
    .secondary {
      background: #181c24;
      color: white;
      border: 1px solid #292e39;
    }
    .logout {
      background: #761d25;
      color: white;
      margin-top: 4px;
    }
    /* =========================
       CONTA
    ========================= */
    .card {
      background: #151820;
      border: 1px solid #272c36;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 12px;
    }
    .card h2 {
      margin: 0 0 7px;
      font-size: 17px;
    }
    .card p {
      margin: 0;
      font-size: 13px;
      opacity: 0.65;
    }
    .message {
      min-height: 18px;
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.75;
    }
    /* =========================
       MODAL
    ========================= */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      padding: 10px;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      width: 100%;
      max-width: 460px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      background:
        linear-gradient(
          180deg,
          #171a22,
          #101219
        );
      border: 1px solid #292e39;
      border-radius: 18px;
      padding: 15px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .modal-box h2 {
      margin: 0 0 10px;
      padding-right: 42px;
      font-size: 19px;
    }
    .close-button {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      background: #0b0d12;
      border: 1px solid #303541;
      color: white;
      font-size: 22px;
    }
    .modal-message {
      min-height: 20px;
      margin: 0;
    }
    /* =========================
       ROLETA
    ========================= */
    .roulette-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .roulette-balance {
      font-size: 12px;
      opacity: 0.65;
    }
    .roulette-stage {
      width: 100%;
      height: 155px;
      border-radius: 15px;
      background:
        radial-gradient(
          circle at center,
          #202631 0%,
          #11141b 58%,
          #0a0c10 100%
        );
      border: 1px solid #2a303b;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 11px;
      position: relative;
      overflow: hidden;
    }
    .roulette-stage::before {
      content: "";
      position: absolute;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      border: 1px solid #363c48;
      opacity: 0.7;
    }
    .result-number {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      background: #0a0c10;
      border: 4px solid #3a404c;
      position: relative;
      z-index: 2;
      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.45);
    }
    .result-red {
      background: #9d111b;
      border-color: #e94b56;
    }
    .result-black {
      background: #050505;
      border-color: #727782;
    }
    .result-green {
      background: #08752a;
      border-color: #43d86d;
    }
    .result-label {
      text-align: center;
      font-size: 12px;
      opacity: 0.7;
      margin-top: -4px;
      margin-bottom: 10px;
    }
    /* =========================
       APOSTA
    ========================= */
    .bet-title {
      font-size: 12px;
      font-weight: 800;
      opacity: 0.65;
      margin: 9px 0 6px;
    }
    .bet-amount {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      background: #090b10;
      border: 1px solid #303541;
      border-radius: 10px;
      color: white;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      outline: none;
    }
    .bet-amount:focus {
      border-color: white;
    }
    .quick-values {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .quick-value {
      padding: 8px 4px;
      font-size: 12px;
      background: #0b0d12;
      color: #dfe3eb;
      border: 1px solid #303541;
    }
    /* =========================
       CORES
    ========================= */
    .bet-types {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .bet-type {
      background: #0b0d12;
      color: white;
      border: 2px solid #303541;
      padding: 11px;
    }
    .bet-type.selected {
      border-color: white;
      background: #252a34;
    }
    .red-button.selected {
      border-color: #ef5962;
      background: #48151a;
    }
    .black-button.selected {
      border-color: #999;
      background: #252525;
    }
    /* =========================
       NÚMERO
    ========================= */
    .number-section {
      margin-top: 9px;
    }
    .number-toggle {
      background: #0b0d12;
      color: #cfd4df;
      border: 1px solid #303541;
      padding: 9px;
      font-size: 12px;
    }
    .number-grid {
      display: none;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-top: 7px;
    }
    .number-grid.visible {
      display: grid;
    }
    .number-button {
      padding: 8px 2px;
      font-size: 12px;
      background: #0b0d12;
      color: white;
      border: 1px solid #303541;
    }
    .number-button.selected {
      background: white;
      color: #111;
      border-color: white;
    }
    .number-button.zero {
      background: #08752a;
      color: white;
    }
    .number-button.zero.selected {
      background: #43d86d;
      color: #111;
    }
    /* =========================
       MENSAGEM E GIRAR
    ========================= */
    .roulette-message {
      min-height: 25px;
      text-align: center;
      margin: 8px 0;
      font-size: 13px;
      font-weight: 800;
    }
    .win-message {
      color: #55e878;
    }
    .lose-message {
      color: #ff7070;
    }
    .spin-button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 2px;
    }
    .roulette-info {
      text-align: center;
      font-size: 10px;
      opacity: 0.45;
      margin-top: 7px;
    }
    /* =========================
       HISTÓRICO
    ========================= */
    .history-list {
      margin-top: 8px;
    }
    .history-item {
      background: #0b0d12;
      border: 1px solid #242933;
      border-radius: 9px;
      padding: 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .empty {
      opacity: 0.6;
    }
    /* =========================
       CELULAR
    ========================= */
    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }
      header {
        margin-bottom: 10px;
      }
      .logo {
        font-size: 22px;
      }
      .user {
        font-size: 12px;
      }
      .balance {
        padding: 12px;
        margin-bottom: 9px;
      }
      .balance-value {
        font-size: 26px;
      }
      .buttons {
        gap: 7px;
        margin-bottom: 9px;
      }
      .buttons button {
        padding: 11px 8px;
        font-size: 13px;
      }
      .modal {
        padding: 7px;
      }
      .modal-box {
        max-height: calc(100vh - 14px);
        padding: 12px;
        border-radius: 15px;
      }
      .roulette-stage {
        height: 135px;
      }
      .result-number {
        width: 76px;
        height: 76px;
        font-size: 30px;
      }
      .roulette-stage::before {
        width: 105px;
        height: 105px;
      }
      .bet-amount {
        height: 42px;
      }
      .spin-button {
        padding: 13px;
      }
    }
    @media (max-height: 700px) {
      .roulette-stage {
        height: 110px;
      }
      .result-number {
        width: 68px;
        height: 68px;
        font-size: 27px;
      }
      .roulette-stage::before {
        width: 92px;
        height: 92px;
      }
      .bet-title {
        margin-top: 6px;
      }
      .quick-values {
        margin-top: 4px;
      }
      .number-section {
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- CABEÇALHO -->
    <header>
      <div class="logo">
        JP<span>BET</span>
      </div>
      <div
        class="user"
        id="userName"
      >
        Usuário
      </div>
    </header>
    <!-- SALDO -->
    <div class="balance">
      <div class="balance-title">
        Seu saldo
      </div>
      <div
        class="balance-value"
        id="balance"
      >
        R$ 0,00
      </div>
    </div>
    <!-- AÇÕES -->
    <div class="buttons">
      <button
        class="primary"
        onclick="abrirRoleta()"
      >
        🎰 JOGAR
      </button>
      <button
        class="secondary"
        onclick="depositar()"
      >
        💰 DEPOSITAR
      </button>
      <button
        class="secondary"
        onclick="sacar()"
      >
        💸 SACAR
      </button>
      <button
        class="secondary"
        onclick="historico()"
      >
        📋 HISTÓRICO
      </button>
    </div>
    <!-- CONTA -->
    <div class="card">
      <h2>
        Minha conta
      </h2>
      <p>
        Bem-vindo à plataforma JPBET.
      </p>
      <div
        id="message"
        class="message"
      ></div>
    </div>
    <!-- SAIR -->
    <button
      class="logout"
      onclick="sair()"
    >
      SAIR DA CONTA
    </button>
  </div>
  <!-- MODAL -->
  <div
    id="actionModal"
    class="modal"
  >
    <div class="modal-box">
      <button
        class="close-button"
        onclick="fecharModal()"
      >
        ×
      </button>
      <h2 id="modalTitle">
        JPBET
      </h2>
      <div
        id="modalContent"
        class="modal-message"
      ></div>
    </div>
  </div>
  <script>
    /* =========================
       CONFIGURAÇÃO
    ========================= */
    const API_URL = "/api";
    /* =========================
       USUÁRIO
    ========================= */
    let usuarioAtual = null;
    let tipoAposta = null;
    let valorAposta = 1;
    let numeroAposta = null;
    let rodadaEmAndamento = false;
    /* =========================
       CARREGAR USUÁRIO
    ========================= */
    function carregarUsuario() {
      const savedUser =
        localStorage.getItem(
          "jpbet_user"
        );
      if (!savedUser) {
        window.location.href =
          "index.html";
        return;
      }
      try {
        const user =
          JSON.parse(savedUser);
        usuarioAtual = user;
        document.getElementById(
          "userName"
        ).textContent =
          user.username ||
          "Usuário";
        atualizarSaldo(
          user.balance
        );
      } catch (error) {
        console.error(error);
        localStorage.removeItem(
          "jpbet_user"
        );
        localStorage.removeItem(
          "jpbet_token"
        );
        window.location.href =
          "index.html";
      }
    }
    /* =========================
       SALDO
    ========================= */
    function atualizarSaldo(valor) {
      const balance =
        Number(valor || 0);
      document.getElementById(
        "balance"
      ).textContent =
        "R$ " +
        balance
          .toFixed(2)
          .replace(".", ",");
      if (usuarioAtual) {
        usuarioAtual.balance =
          balance;
        localStorage.setItem(
          "jpbet_user",
          JSON.stringify(
            usuarioAtual
          )
        );
      }
    }
    /* =========================
       MODAL
    ========================= */
    function abrirModal(
      titulo,
      conteudo
    ) {
      document.getElementById(
        "modalTitle"
      ).textContent =
        titulo;
      document.getElementById(
        "modalContent"
      ).innerHTML =
        conteudo;
      document.getElementById(
        "actionModal"
      ).style.display =
        "flex";
    }
    function fecharModal() {
      document.getElementById(
        "actionModal"
      ).style.display =
        "none";
      rodadaEmAndamento =
        false;
    }
    /* =========================
       ROLETA
    ========================= */
    function abrirRoleta() {
      tipoAposta = null;
      numeroAposta = null;
      valorAposta = 1;
      const numeros =
        Array.from(
          {
            length: 37
          },
          (_, index) =>
            index
        );
      let numeroHtml = "";
      numeros.forEach(
        numero => {
          numeroHtml += `
            <button
              class="number-button ${
                numero === 0
                  ? "zero"
                  : ""
              }"
              onclick="selecionarNumero(${numero})"
              id="numero-${numero}"
            >
              ${numero}
            </button>
          `;
        }
      );
      abrirModal(
        "🎰 Roleta JPBET",
        `
          <div class="roulette-top">
            <strong>
              Roleta
            </strong>
            <span
              class="roulette-balance"
            >
              Saldo:
              ${formatarSaldo(
                usuarioAtual
                  ? usuarioAtual.balance
                  : 0
              )}
            </span>
          </div>
          <div class="roulette-stage">
            <div
              id="resultNumber"
              class="result-number"
            >
              ?
            </div>
          </div>
          <div
            id="resultLabel"
            class="result-label"
          >
            Escolha sua aposta
          </div>
          <div class="bet-title">
            Valor da aposta
          </div>
          <input
            id="betAmount"
            class="bet-amount"
            type="number"
            min="1"
            max="100"
            step="1"
            value="1"
            inputmode="numeric"
          >
          <div class="quick-values">
            <button
              class="quick-value"
              onclick="definirValor(1)"
            >
              1
            </button>
            <button
              class="quick-value"
              onclick="definirValor(5)"
            >
              5
            </button>
            <button
              class="quick-value"
              onclick="definirValor(10)"
            >
              10
            </button>
            <button
              class="quick-value"
              onclick="definirValor(25)"
            >
              25
            </button>
          </div>
          <div class="bet-title">
            Escolha uma cor
          </div>
          <div class="bet-types">
            <button
              class="bet-type red-button"
              id="bet-red"
              onclick="selecionarCor('red')"
            >
              🔴 VERMELHO
            </button>
            <button
              class="bet-type black-button"
              id="bet-black"
              onclick="selecionarCor('black')"
            >
              ⚫ PRETO
            </button>
          </div>
          <div class="number-section">
            <button
              class="number-toggle"
              onclick="mostrarNumeros()"
            >
              🔢 Escolher número
            </button>
            <div
              id="numberGrid"
              class="number-grid"
            >
              ${numeroHtml}
            </div>
          </div>
          <div
            id="rouletteMessage"
            class="roulette-message"
          >
          </div>
          <button
            class="primary spin-button"
            id="spinButton"
            onclick="girarRoleta()"
          >
            🎰 GIRAR ROLETA
          </button>
          <div class="roulette-info">
            Créditos virtuais • Apostas de 1 a 100
          </div>
        `
      );
    }
    /* =========================
       FORMATAR SALDO
    ========================= */
    function formatarSaldo(valor) {
      return (
        "R$ " +
        Number(valor || 0)
          .toFixed(2)
          .replace(".", ",")
      );
    }
    /* =========================
       VALOR RÁPIDO
    ========================= */
    function definirValor(valor) {
      const input =
        document.getElementById(
          "betAmount"
        );
      if (!input) {
        return;
      }
      input.value = valor;
    }
    /* =========================
       MOSTRAR NÚMEROS
    ========================= */
    function mostrarNumeros() {
      const grid =
        document.getElementById(
          "numberGrid"
        );
      if (!grid) {
        return;
      }
      grid.classList.toggle(
        "visible"
      );
    }
    /* =========================
       SELECIONAR COR
    ========================= */
    function selecionarCor(cor) {
      tipoAposta = cor;
      numeroAposta = null;
      document
        .querySelectorAll(
          ".bet-type"
        )
        .forEach(
          button => {
            button.classList.remove(
              "selected"
            );
          }
        );
      document
        .querySelectorAll(
          ".number-button"
        )
        .forEach(
          button => {
            button.classList.remove(
              "selected"
            );
          }
        );
      const button =
        document.getElementById(
          `bet-${cor}`
        );
      if (button) {
        button.classList.add(
          "selected"
        );
      }
      mostrarMensagem(
        cor === "red"
          ? "Aposta selecionada: vermelho."
          : "Aposta selecionada: preto.",
        ""
      );
    }
    /* =========================
       SELECIONAR NÚMERO
    ========================= */
    function selecionarNumero(
      numero
    ) {
      tipoAposta =
        "number";
      numeroAposta =
        numero;
      document
        .querySelectorAll(
          ".bet-type"
        )
        .forEach(
          button => {
            button.classList.remove(
              "selected"
            );
          }
        );
      document
        .querySelectorAll(
          ".number-button"
        )
        .forEach(
          button => {
            button.classList.remove(
              "selected"
            );
          }
        );
      const button =
        document.getElementById(
          `numero-${numero}`
        );
      if (button) {
        button.classList.add(
          "selected"
        );
      }
      mostrarMensagem(
        `Aposta selecionada: número ${numero}.`,
        ""
      );
    }
    /* =========================
       MENSAGEM
    ========================= */
    function mostrarMensagem(
      texto,
      classe
    ) {
      const elemento =
        document.getElementById(
          "rouletteMessage"
        );
      if (!elemento) {
        return;
      }
      elemento.textContent =
        texto;
      elemento.className =
        "roulette-message " +
        (classe || "");
    }
    /* =========================
       GIRAR ROLETA
    ========================= */
    async function girarRoleta() {
      if (rodadaEmAndamento) {
        return;
      }
      if (!usuarioAtual) {
        mostrarMensagem(
          "Usuário não encontrado.",
          "lose-message"
        );
        return;
      }
      const input =
        document.getElementById(
          "betAmount"
        );
      const bet =
        Number(input.value);
      if (
        !Number.isFinite(bet) ||
        bet < 1 ||
        bet > 100
      ) {
        mostrarMensagem(
          "A aposta deve estar entre 1 e 100 créditos.",
          "lose-message"
        );
        return;
      }
      if (!tipoAposta) {
        mostrarMensagem(
          "Escolha vermelho, preto ou um número.",
          "lose-message"
        );
        return;
      }
      if (
        tipoAposta === "number" &&
        numeroAposta === null
      ) {
        mostrarMensagem(
          "Escolha um número da roleta.",
          "lose-message"
        );
        return;
      }
      const saldo =
        Number(
          usuarioAtual.balance ||
          0
        );
      if (saldo < bet) {
        mostrarMensagem(
          "Saldo insuficiente.",
          "lose-message"
        );
        return;
      }
      rodadaEmAndamento =
        true;
      const spinButton =
        document.getElementById(
          "spinButton"
        );
      if (spinButton) {
        spinButton.disabled =
          true;
        spinButton.textContent =
          "🎰 GIRANDO...";
      }
      mostrarMensagem(
        "A roleta está girando...",
        ""
      );
      const resultNumber =
        document.getElementById(
          "resultNumber"
        );
      const resultLabel =
        document.getElementById(
          "resultLabel"
        );
      if (resultNumber) {
        resultNumber.className =
          "result-number";
        resultNumber.textContent =
          "…";
      }
      try {
        const response =
          await fetch(
            `${API_URL}/roulette/spin`,
            {
              method:
                "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  userId:
                    usuarioAtual.id,
                  betAmount:
                    bet,
                  betType:
                    tipoAposta,
                  betValue:
                    numeroAposta
                })
            }
          );
        const data =
          await response.json();
        if (
          !response.ok ||
          !data.ok
        ) {
          throw new Error(
            data.message ||
            "Não foi possível realizar a rodada."
          );
        }
        const numero =
          data.spin.number;
        const cor =
          data.spin.color;
        const ganhou =
          data.spin.won;
        const premio =
          Number(
            data.spin.prize || 0
          );
        /* =========================
           RESULTADO
        ========================= */
        if (resultNumber) {
          resultNumber.textContent =
            numero;
          resultNumber.className =
            "result-number " +
            `result-${cor}`;
        }
        if (resultLabel) {
          const nomeCor =
            cor === "red"
              ? "🔴 Vermelho"
              : cor === "black"
                ? "⚫ Preto"
                : "🟢 Verde";
          resultLabel.textContent =
            nomeCor;
        }
        /* =========================
           ATUALIZAR SALDO
        ========================= */
        atualizarSaldo(
          data.user.balance
        );
        if (ganhou) {
          mostrarMensagem(
            `🎉 VOCÊ GANHOU ${premio
              .toFixed(2)
              .replace(".", ",")} CRÉDITOS!`,
            "win-message"
          );
        } else {
          mostrarMensagem(
            `Resultado: ${numero}. Você não ganhou nesta rodada.`,
            "lose-message"
          );
        }
        if (spinButton) {
          spinButton.disabled =
            false;
          spinButton.textContent =
            "🎰 GIRAR NOVAMENTE";
        }
        rodadaEmAndamento =
          false;
      } catch (error) {
        console.error(error);
        mostrarMensagem(
          error.message ||
          "Erro ao executar a roleta.",
          "lose-message"
        );
        if (spinButton) {
          spinButton.disabled =
            false;
          spinButton.textContent =
            "🎰 TENTAR NOVAMENTE";
        }
        rodadaEmAndamento =
          false;
      }
    }
    /* =========================
       DEPÓSITO
    ========================= */
    function depositar() {
      abrirModal(
        "💰 Depósito",
        `
          <p>
            A área de depósito está sendo preparada.
          </p>
          <p>
            Nesta versão, a plataforma trabalha somente com créditos virtuais.
          </p>
          <button
            class="primary"
            onclick="fecharModal()"
          >
            FECHAR
          </button>
        `
      );
    }
    /* =========================
       SAQUE
    ========================= */
    function sacar() {
      abrirModal(
        "💸 Saque",
        `
          <p>
            A área de saque está sendo preparada.
          </p>
          <p>
            As operações financeiras reais não estão habilitadas nesta versão.
          </p>
          <button
            class="primary"
            onclick="fecharModal()"
          >
            FECHAR
          </button>
        `
      );
    }
    /* =========================
       HISTÓRICO
    ========================= */
    function historico() {
      abrirModal(
        "📋 Histórico",
        `
          <div class="history-list">
            <div class="history-item empty">
              O histórico detalhado será conectado à tabela de rodadas na próxima etapa.
            </div>
          </div>
          <button
            class="primary"
            onclick="fecharModal()"
          >
            FECHAR
          </button>
        `
      );
    }
    /* =========================
       SAIR
    ========================= */
    function sair() {
      localStorage.removeItem(
        "jpbet_user"
      );
      localStorage.removeItem(
        "jpbet_token"
      );
      window.location.href =
        "index.html";
    }
    /* =========================
       CLICAR FORA
    ========================= */
    document
      .getElementById(
        "actionModal"
      )
      .addEventListener(
        "click",
        function(event) {
          if (
            event.target === this
          ) {
            fecharModal();
          }
        }
      );
    /* =========================
       INICIALIZAÇÃO
    ========================= */
    carregarUsuario();
  </script>
</body>
</html>
