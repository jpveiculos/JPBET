<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03070c">
<title>MyBets — Roleta 200</title>
<style>
:root{--bg:#03070c;--gold:#f6bd24;--yellow:#f7c51d;--black:#050505}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:linear-gradient(180deg,#060b12,#03070c);border-bottom:1px solid rgba(255,255,255,.13)}
.logo{font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px;color:#fff!important;text-decoration:none;position:relative;padding-bottom:5px}
.logo b{color:var(--gold)!important}
.logo:after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:3px;background:var(--gold);border-radius:70% 55% 70% 55%;transform:skewX(-18deg) rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.8)}
.header-right{display:flex;align-items:center;gap:7px}.header-balance{min-width:116px;padding:5px 10px;border:1px solid rgba(245,197,66,.38);border-radius:15px;font-size:11px;color:#aeb5c2}.header-balance strong{display:block;color:#ffda52;font-size:17px}
.menu-button{width:40px;height:40px;border:1px solid #26303b;border-radius:12px;background:#101821;color:#fff;font-size:23px}
.page{position:relative;width:100%;height:calc(100vh - 66px);max-width:720px;margin:auto;background:radial-gradient(circle at 50% 12%,rgba(255,205,49,.055),transparent 32%),linear-gradient(180deg,#03070c,#050a10);overflow:hidden;text-align:center}
.wheel{position:absolute;top:50px;left:50%;transform:translateX(-50%);width:min(350px,calc(100vw - 38px));aspect-ratio:1;filter:drop-shadow(0 16px 28px rgba(0,0,0,.85))}
.wheel:before{content:"";position:absolute;inset:-13px;border:2px solid #080808;border-radius:50%;box-shadow:0 0 0 2px #5b3605,0 0 0 5px #9a5c05,0 0 0 8px #e2a515,0 0 0 11px #f8c52c,0 0 0 13px #4a2b03,0 0 0 15px #090909}
.wheel:after{content:"";position:absolute;inset:-1px;border:2px solid #f8d34b;border-radius:50%;box-shadow:inset 0 0 0 2px #5b3605,inset 0 0 0 4px #0a0a0a;z-index:4;pointer-events:none}
#wheel{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%;z-index:3}
.pointer{position:absolute;z-index:10;left:50%;top:-8px;transform:translateX(-50%);width:44px;height:50px;background:linear-gradient(#ffe98a,#dca51c 24%,#9d6908 68%,#5d3a00);clip-path:polygon(4% 0,96% 0,78% 58%,50% 100%,22% 58%);filter:drop-shadow(0 5px 7px rgba(0,0,0,.95));pointer-events:none}
.pointer:before{content:"";position:absolute;left:8px;top:6px;width:28px;height:35px;background:#05070a;clip-path:polygon(4% 0,96% 0,72% 58%,50% 100%,28% 58%)}
.pointer:after{content:"";position:absolute;left:13px;top:9px;width:18px;height:27px;background:linear-gradient(#ff6673,#ff3045 55%,#b5001b);clip-path:polygon(0 0,100% 0,50% 100%)}
.center{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 42% 28%,#302510,#090806 62%,#020202);color:#ffd23d;box-shadow:none;overflow:visible}
.center:before{content:"";position:absolute;z-index:-2;inset:-9px;border-radius:50%;background:#050505;border:5px solid #5b3907;box-shadow:0 0 0 3px #c38b12,0 0 0 5px #1a1205,0 0 10px rgba(255,195,35,.5)}
.center:after{content:"";position:absolute;z-index:-1;inset:-2px;border-radius:50%;border:2px solid #ffd33e;box-shadow:inset 0 0 0 2px #2a1a04;pointer-events:none}
.center .brand{position:relative;z-index:2;display:inline-block;font-size:16px;font-weight:900;font-style:italic;margin-bottom:6px;color:#fff;text-shadow:0 1px 2px #000}
.center .brand:after{content:"";display:block;width:100%;height:3px;margin:3px auto 0;background:var(--gold);border-radius:70% 55% 70% 55%;transform:skewX(-18deg) rotate(-2deg);box-shadow:0 1px 2px rgba(0,0,0,.8)}
.center .brand .my{color:var(--gold)}.center .brand .bets{color:#fff}.go{position:relative;z-index:2;font-size:22px;font-weight:900}
.result{position:absolute!important;top:430px!important;left:0!important;width:100%!important;min-height:24px;margin:0!important;padding:0 14px!important;z-index:16!important;text-align:center;font-size:16px;font-weight:900}
.win{color:#25f477}.loss{color:#ff3948}.error{color:#ffd24a}
.bet-area{position:fixed;left:16px;right:16px;bottom:82px;z-index:60}.bet-title{text-align:left;color:#d2d7df;font-size:13px;margin:0 0 4px 3px}.bet-value{height:46px;border-radius:13px;background:linear-gradient(#151e28,#0c131c);border:1px solid #566171;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}.hint{margin-top:5px;color:#8993a2;font-size:11px}
.bottom{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:#050a10;border-top:1px solid rgba(255,255,255,.15)}.bottom a{color:#8993a3;text-decoration:none;text-align:center;font-size:11px;font-weight:800;padding-top:7px}.bottom a span{display:block;font-size:21px}.bottom a.active{color:#ffdf45}
.large-prize-label{font-family:Impact,"Arial Black",Arial,sans-serif;font-weight:900;letter-spacing:.3px}
</style>
</head>
<body>
<header class="header"><a class="logo" href="/">My<b>Bets</b></a><div class="header-right"><div class="header-balance">Saldo<strong id="headerBalance">R$ 0,00</strong></div><button class="menu-button" onclick="location.href='/dashboard.html'">☰</button></div></header>
<main class="page">
<div class="wheel"><svg id="wheel" viewBox="0 0 500 500" aria-label="Roleta MyBets — 200 setores"><g id="rouletteSvg"></g></svg><div class="pointer"></div><button id="spinButton" class="center"><span class="brand">MyBets</span><span class="go">GIRAR</span></button></div>
<div id="result" class="result"></div>
<section class="bet-area"><div class="bet-title">Valor da aposta</div><div class="bet-value">R$ 1,00</div><div id="authHint" class="hint">Faça login para jogar.</div></section>
</main>
<nav class="bottom"><a href="/"><span>⌂</span>Início</a><a href="/dashboard.html"><span>👤</span>Área do jogador</a><a class="active" href="/roulette1.html"><span>◉</span>Roleta</a></nav>
<script>
window.MYBETS_ROULETTE={id:"roleta1",slices:200,bet:1,multipliers:[2,3,4,5,6,7,8,9,10],prizeStarts:[0,22,44,66,88,110,132,154,176],prizeWidth:20};
</script>
<script>
(function(){
const cfg=window.MYBETS_ROULETTE||{};const slices=200,bet=Number(cfg.bet)||1;const multipliers=cfg.multipliers||[2,3,4,5,6,7,8,9,10];const prizeStarts=cfg.prizeStarts||[0,22,44,66,88,110,132,154,176];const prizeWidth=20,api="/api/settings/roulette-large/spin";const $=id=>document.getElementById(id);let rotation=0,spinning=false,user=null;
function money(v){return`R$ ${Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`}
function session(){try{return JSON.parse(localStorage.getItem("jpbet_user")||"null")}catch{return null}}
function setUser(u){if(!u)return;user={...user,...u};localStorage.setItem("jpbet_user",JSON.stringify(user));const h=$("headerBalance");if(h&&user.balance!=null)h.textContent=money(user.balance)}
async function refreshBalance(){try{const u=session();if(!u||u.id==null)return;const r=await fetch(`/api/user/${encodeURIComponent(u.id)}`,{cache:"no-store"});if(!r.ok)return;const d=await r.json();const fresh=d.user||d;if(fresh&&fresh.balance!=null)setUser(fresh)}catch(e){}}
function polar(r,d){const a=(d-90)*Math.PI/180;return{x:250+r*Math.cos(a),y:250+r*Math.sin(a)}}
function path(r,a,b){const p=polar(r,a),q=polar(r,b);return`M250 250 L${p.x} ${p.y} A${r} ${r} 0 0 1 ${q.x} ${q.y} Z`}
function normalizeCenterBrand(){document.querySelectorAll(".center .brand").forEach(el=>{if(el.querySelector(".my,.bets"))return;el.textContent="";const my=document.createElement("span");my.className="my";my.textContent="My";const bets=document.createElement("span");bets.className="bets";bets.textContent="Bets";el.append(my,bets)})}
function updatePrizeOrientation(rr){document.querySelectorAll(".large-prize-label").forEach(t=>{const x=Number(t.dataset.cx),y=Number(t.dataset.cy);t.setAttribute("transform",`translate(${x} ${y}) rotate(${-rr}) translate(${-x} ${-y})`)})}
function prizePosition(index){for(let p=0;p<prizeStarts.length;p++){const start=prizeStarts[p];if(index>=start&&index<start+prizeWidth)return p}return-1}
function renderWheel(){
const svg=$("rouletteSvg");if(!svg)return;svg.innerHTML="";const ns="http://www.w3.org/2000/svg",defs=document.createElementNS(ns,"defs");
const glow=document.createElementNS(ns,"filter");glow.id="goldGlow";glow.innerHTML='<feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>';defs.appendChild(glow);
const prizeGlow=document.createElementNS(ns,"filter");prizeGlow.id="prize3D";prizeGlow.setAttribute("x","-30%");prizeGlow.setAttribute("y","-30%");prizeGlow.setAttribute("width","160%");prizeGlow.setAttribute("height","160%");prizeGlow.innerHTML='<feDropShadow dx="2" dy="4" stdDeviation="1.8" flood-color="#000000" flood-opacity=".95"/><feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#ffffff" flood-opacity=".28"/>';defs.appendChild(prizeGlow);svg.appendChild(defs);
const base=document.createElementNS(ns,"circle");base.setAttribute("cx",250);base.setAttribute("cy",250);base.setAttribute("r",239);base.setAttribute("fill","#050505");svg.appendChild(base);
const step=360/slices,textColors=["#ffd21f","#42e8ff","#35ff73","#ff72d2","#ff5b3d","#ffd21f","#42e8ff","#35ff73","#ff72d2"];
for(let i=0;i<slices;i++){const a=i*step-step/2,b=(i+1)*step-step/2,sector=document.createElementNS(ns,"path");sector.setAttribute("d",path(239,a,b));const p=prizePosition(i),isPrize=p>=0;sector.setAttribute("fill",isPrize?"#050505":"#f7c51d");sector.setAttribute("stroke","#080808");sector.setAttribute("stroke-width",isPrize?"0.95":"0.55");svg.appendChild(sector)}
for(let p=0;p<multipliers.length;p++){const centerIndex=prizeStarts[p]+prizeWidth/2,pos=polar(177,centerIndex*step),t=document.createElementNS(ns,"text");t.textContent=`${multipliers[p]}x`;t.setAttribute("x",pos.x);t.setAttribute("y",pos.y);t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");t.setAttribute("font-family",'Impact,"Arial Black",Arial,sans-serif');t.setAttribute("font-size","25");t.setAttribute("font-weight","900");t.setAttribute("fill",textColors[p]);t.setAttribute("stroke","#070707");t.setAttribute("stroke-width","5");t.setAttribute("paint-order","stroke fill");t.setAttribute("filter","url(#prize3D)");t.classList.add("large-prize-label");t.dataset.cx=pos.x;t.dataset.cy=pos.y;svg.appendChild(t)}
const ring=document.createElementNS(ns,"circle");ring.setAttribute("cx",250);ring.setAttribute("cy",250);ring.setAttribute("r",239);ring.setAttribute("fill","none");ring.setAttribute("stroke","#f4b91d");ring.setAttribute("stroke-width","12");ring.setAttribute("filter","url(#goldGlow)");svg.appendChild(ring);const hi=document.createElementNS(ns,"circle");hi.setAttribute("cx",250);hi.setAttribute("cy",250);hi.setAttribute("r",233);hi.setAttribute("fill","none");hi.setAttribute("stroke","#ffe66b");hi.setAttribute("stroke-width","2");hi.setAttribute("opacity",".8");svg.appendChild(hi);if($("wheel")){$("wheel").style.transformOrigin="50% 50%";$('wheel').style.transformBox="fill-box";$('wheel').style.transform=`rotate(${rotation}deg)`;updatePrizeOrientation(rotation)}}
async function spin(){if(spinning)return;user=session();if(!user){localStorage.setItem("jpbet_pending_game",location.pathname+location.search);window.location.href="/?login=1";return}spinning=true;$("spinButton").disabled=true;$("result").textContent="";$("result").className="result";try{const r=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:user.id,betAmount:bet,rouletteId:cfg.id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.message||"Não foi possível realizar a rodada.");const s=d.spin||{},logicalIndex=Math.max(0,Math.min(slices-1,Number(s.index)||0)),center=(logicalIndex/slices)*360,target=((360-center-(rotation%360))+360)%360,dest=rotation+2*360+target,dur=2200,start=performance.now(),from=rotation;await new Promise(resolve=>{function frame(now){const p=Math.min(1,(now-start)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,rr=from+(dest-from)*e;$("wheel").style.transform=`rotate(${rr}deg)`;updatePrizeOrientation(rr);if(p<1)return requestAnimationFrame(frame);rotation=dest;$("wheel").style.transform=`rotate(${dest}deg)`;updatePrizeOrientation(dest);resolve()}requestAnimationFrame(frame)});$("result").textContent=Number(s.prize)>0?`🎉 ${s.multiplier}x — você ganhou ${money(s.prize)}!`:`Você perdeu ${money(bet)}.`;$("result").className=Number(s.prize)>0?"win":"loss";if(d.user)setUser(d.user);await refreshBalance()}catch(e){$("result").textContent=e.message;$("result").className="error"}finally{spinning=false;$("spinButton").disabled=false}}
document.addEventListener("DOMContentLoaded",()=>{user=session();if(user)setUser(user);normalizeCenterBrand();$("authHint").textContent=user?`Aposta fixa: ${money(bet)}`:"Faça login para jogar.";renderWheel();$("spinButton").onclick=spin;refreshBalance()});
})();
</script>
</body>
</html>
