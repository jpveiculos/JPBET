<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#03070c"><title>MyBets — Roleta</title>
<style>
:root{--bg:#03070c;--gold:#f6bd24;--yellow:#f7c51d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:linear-gradient(#060b12,#03070c);border-bottom:1px solid #222}.logo{font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px;color:#fff;text-decoration:none;padding-bottom:5px;position:relative}.logo b{color:var(--gold)}.logo:after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:3px;background:var(--gold);border-radius:70%;transform:skewX(-18deg) rotate(-2deg)}.header-right{display:flex;align-items:center;gap:7px}.header-balance{min-width:116px;padding:5px 10px;border:1px solid #71591c;border-radius:15px;font-size:11px;color:#aeb5c2}.header-balance strong{display:block;color:#ffda52;font-size:17px}.menu-button{width:40px;height:40px;border:1px solid #26303b;border-radius:12px;background:#101821;color:#fff;font-size:23px}.page{position:relative;width:100%;height:calc(100vh - 66px);max-width:720px;margin:auto;background:radial-gradient(circle at 50% 12%,rgba(255,205,49,.055),transparent 32%),linear-gradient(#03070c,#050a10);overflow:hidden;text-align:center}.wheel{position:absolute;top:42px;left:50%;transform:translateX(-50%);width:min(350px,calc(100vw - 38px));aspect-ratio:1;filter:drop-shadow(0 16px 28px #000)}#wheel{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%}.wheel:before{content:"";position:absolute;inset:-14px;border-radius:50%;box-shadow:0 0 0 2px #5b3605,0 0 0 5px #9a5c05,0 0 0 8px #e2a515,0 0 0 11px #f8c52c,0 0 0 14px #080808}.pointer{position:absolute;z-index:10;left:50%;top:-8px;transform:translateX(-50%);width:44px;height:50px;background:linear-gradient(#ffe98a,#dca51c 25%,#5d3a00);clip-path:polygon(4% 0,96% 0,78% 58%,50% 100%,22% 58%);filter:drop-shadow(0 5px 7px #000)}.pointer:after{content:"";position:absolute;left:13px;top:9px;width:18px;height:27px;background:#ff3045;clip-path:polygon(0 0,100% 0,50% 100%)}.center{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 42% 28%,#302510,#090806 62%,#020202);color:#ffd23d}.center:before{content:"";position:absolute;z-index:-1;inset:-9px;border-radius:50%;background:#050505;border:5px solid #5b3907;box-shadow:0 0 0 3px #c38b12,0 0 0 5px #1a1205}.brand{display:block;font-size:16px;font-weight:900;font-style:italic}.my{color:var(--gold)}.go{display:block;font-size:22px;font-weight:900;margin-top:5px}.result{position:absolute;top:425px;left:0;width:100%;padding:0 12px;font-size:16px;font-weight:900;min-height:24px}.win{color:#25f477}.loss{color:#ff3948}.bet-area{position:fixed;left:16px;right:16px;bottom:82px;z-index:20}.bet-title{text-align:left;color:#d2d7df;font-size:13px;margin:0 0 4px 3px}.bet-value{height:46px;border-radius:13px;background:linear-gradient(#151e28,#0c131c);border:1px solid #566171;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}.hint{margin-top:5px;color:#8993a2;font-size:11px}.bottom{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:#050a10;border-top:1px solid #222}.bottom a{color:#8993a3;text-decoration:none;text-align:center;font-size:11px;font-weight:800;padding-top:7px}.bottom a span{display:block;font-size:21px}.bottom a.active{color:#ffdf45}
</style></head>
<body>
<header class="header"><a class="logo" href="/">My<b>Bets</b></a><div class="header-right"><div class="header-balance">Saldo<strong id="headerBalance">R$ 0,00</strong></div><button class="menu-button" onclick="location.href='/dashboard.html'">☰</button></div></header>
<main class="page"><div class="wheel"><svg id="wheel" viewBox="0 0 500 500" aria-label="Roleta MyBets — 207 setores"><g id="rouletteSvg"></g></svg><div class="pointer"></div><button id="spinButton" class="center"><span class="brand"><span class="my">My</span>Bets</span><span class="go">GIRAR</span></button></div><div id="result" class="result"></div><section class="bet-area"><div class="bet-title">Valor da aposta</div><div class="bet-value">R$ 1,00</div><div class="hint">Créditos virtuais • 9 prêmios • 207 setores</div></section></main>
<nav class="bottom"><a href="/"><span>⌂</span>Início</a><a href="/dashboard.html"><span>👤</span>Área do jogador</a><a class="active" href="/roulette1.html"><span>◉</span>Roleta</a></nav>
<script>
(()=>{const S=207,STEP=360/S,W=22,M=[2,3,4,5,6,7,8,9,10];let rot=0,busy=false;const $=id=>document.getElementById(id),userKey='jpbet_user';function money(v){return`R$ ${Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`}function user(){try{return JSON.parse(localStorage.getItem(userKey)||'null')}catch{return null}}function balance(){let u=user();let b=Number(u?.balance||0);$('headerBalance').textContent=money(b);return b}function prizeIndex(i){i=Math.max(0,Math.min(S-1,Math.floor(i)));if(i%23===0)return i/23;return-1}function visualAngle(i){let idx=Math.max(0,Math.min(S-1,Math.floor(i)));let block=Math.floor(idx/23);let local=idx%23;return block*40+(local<1?10:30)}function polar(r,d){let a=(d-90)*Math.PI/180;return{x:250+r*Math.cos(a),y:250+r*Math.sin(a)}}function path(r,a,b){let p=polar(r,a),q=polar(r,b);return`M250 250L${p.x} ${p.y}A${r} ${r} 0 0 1 ${q.x} ${q.y}Z`}function render(){let g=$('rouletteSvg');g.innerHTML='';let ns='http://www.w3.org/2000/svg';for(let i=0;i<18;i++){let a=i*20,b=a+20,x=document.createElementNS(ns,'path');x.setAttribute('d',path(239,a,b));x.setAttribute('fill',i%2?'#f7c51d':'#050505');x.setAttribute('stroke',i%2?'none':'#111');x.setAttribute('stroke-width',i%2?'0':'0.8');g.appendChild(x)}for(let p=0;p<9;p++){let a=p*40+10,pos=polar(178,a),t=document.createElementNS(ns,'text');t.textContent=M[p]+'x';t.setAttribute('x',pos.x);t.setAttribute('y',pos.y);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-family','Arial Black,Arial,sans-serif');t.setAttribute('font-size','25');t.setAttribute('font-weight','900');t.setAttribute('fill',['#ffd21f','#42e8ff','#35ff73','#ff72d2','#ff5b3d','#ffd21f','#42e8ff','#35ff73','#ff72d2'][p]);t.setAttribute('stroke','#070707');t.setAttribute('stroke-width','5');t.setAttribute('paint-order','stroke fill');g.appendChild(t)}let c=document.createElementNS(ns,'circle');c.setAttribute('cx',250);c.setAttribute('cy',250);c.setAttribute('r',239);c.setAttribute('fill','none');c.setAttribute('stroke','#f4b91d');c.setAttribute('stroke-width','12');g.appendChild(c);$('wheel').style.transform=`rotate(${rot}deg)`}function spin(){if(busy)return;let u=user();if(!u){location.href='/?login=1';return}let b=balance();if(b<1){$('result').textContent='Saldo virtual insuficiente.';$('result').className='result loss';return}busy=true;$('spinButton').disabled=true;$('result').textContent='';let i=Math.floor(Math.random()*S),p=prizeIndex(i),mult=p>=0?M[p]:0,win=mult?mult:0;let target=((360-visualAngle(i)-(rot%360))+360)%360,dest=rot+720+target,start=performance.now(),from=rot;requestAnimationFrame(function f(now){let q=Math.min(1,(now-start)/2200),e=q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;$('wheel').style.transform=`rotate(${from+(dest-from)*e}deg)`;if(q<1)return requestAnimationFrame(f);rot=dest;let nu=user();nu.balance=b-1+win;localStorage.setItem(userKey,JSON.stringify(nu));$('headerBalance').textContent=money(nu.balance);$('result').textContent=win?`🎉 ${mult}x — você ganhou ${money(win)}!`:`Você perdeu ${money(1)}.`;$('result').className=win?'result win':'result loss';busy=false;$('spinButton').disabled=false})}document.addEventListener('DOMContentLoaded',()=>{balance();render();$('spinButton').onclick=spin})})();
</script></body></html>
