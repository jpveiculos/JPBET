<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#03070c">
<title>MyBets — Roleta</title>
<style>
:root{--bg:#03070c;--gold:#c18b18;--muted:#8d98a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(#07101a,#03070c);border-bottom:1px solid #222}
.logo{font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px;color:#fff;text-decoration:none;position:relative;padding-bottom:5px}.logo b{color:var(--gold)}
.logo:after{content:"";position:absolute;left:1px;right:1px;bottom:0;height:3px;background:var(--gold);border-radius:70%;transform:skewX(-18deg) rotate(-2deg)}
.balance{border:1px solid #614b14;border-radius:15px;padding:4px 10px;min-width:112px;text-align:left;font-size:10px;color:#9ea7b4}.balance strong{display:block;color:#ffda52;font-size:16px}
.page{height:calc(100vh - 66px);max-width:720px;margin:auto;position:relative;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 18%,rgba(246,189,36,.07),transparent 34%),linear-gradient(#03070c,#050a10)}
.wheel-wrap{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:min(360px,calc(100vw - 34px));aspect-ratio:1;filter:drop-shadow(0 18px 30px #000)}#wheel{width:100%;height:100%;display:block}
/* O rotor usa o próprio viewBox do SVG como referência. Isso mantém o eixo matematicamente em 250,250 e evita o efeito de "roda quadrada" no Safari/iPhone. */
#rotor{transform-origin:50% 50%;transform-box:view-box;will-change:transform;transition:none}
#labels text{will-change:transform}
.pointer{position:absolute;z-index:4;top:-7px;left:50%;transform:translateX(-50%);width:42px;height:48px;background:linear-gradient(#fff1a1,#d8a51d 32%,#5b3900);clip-path:polygon(5% 0,95% 0,77% 58%,50% 100%,23% 58%);filter:drop-shadow(0 5px 7px #000)}
.pointer:after{content:"";position:absolute;left:13px;top:8px;width:16px;height:25px;background:#ff3348;clip-path:polygon(0 0,100% 0,50% 100%)}
.center{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:31%;aspect-ratio:1;border-radius:50%;border:5px solid #9a6b0d;background:radial-gradient(circle at 40% 30%,#332816,#0a0805 62%,#020202);color:#ffd33e;box-shadow:0 0 0 3px #e0a91c,0 0 0 8px #070707}.center:disabled{opacity:.7}
.brand{display:block;font-size:15px;font-weight:900;font-style:italic}.my{color:var(--gold)}.go{display:block;font-size:21px;font-weight:900;margin-top:4px}
.result{position:absolute;top:420px;left:10px;right:10px;min-height:24px;font-size:16px;font-weight:900}.win{color:#25f477}.loss{color:#ff3b4f}.status{position:absolute;top:450px;left:0;right:0;color:var(--muted);font-size:11px}
.bet{position:fixed;left:16px;right:16px;bottom:80px;z-index:10;border:1px solid #252e38;background:linear-gradient(#111923,#0b1118);border-radius:14px;padding:10px}.bet-label{font-size:11px;color:#aab2bf}.bet-value{font-size:24px;font-weight:900;color:#fff;margin-top:2px}.bet-note{font-size:10px;color:#778292;margin-top:3px}
.bottom{position:fixed;z-index:20;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:repeat(3,1fr);background:#050a10;border-top:1px solid #222}.bottom a{color:#8c97a7;text-decoration:none;text-align:center;font-size:11px;font-weight:800;padding-top:7px}.bottom a span{display:block;font-size:21px}.bottom a.active{color:#ffdf45}
@media(min-width:700px){.wheel-wrap{top:22px}.result{top:390px}.status{top:422px}}
</style>
</head>
<body>
<header class="header"><a class="logo" href="/">My<b>Bets</b></a><div class="balance">Saldo<strong id="balance">R$ 0,00</strong></div></header>
<main class="page">
<div class="wheel-wrap">
<svg id="wheel" viewBox="0 0 500 500" aria-label="Roleta MyBets com 207 posições lógicas">
<g id="rotor"><g id="sectors"></g><g id="labels"></g><circle cx="250" cy="250" r="240" fill="none" stroke="#b8860b" stroke-width="11"/></g>
</svg>
<div class="pointer"></div>
<button id="spin" class="center"><span class="brand"><span class="my">My</span>Bets</span><span class="go">GIRAR</span></button>
</div>
<div id="result" class="result"></div><div id="status" class="status">Conectando ao servidor…</div>
<section class="bet"><div class="bet-label">Valor da aposta</div><div class="bet-value">R$ 1,00</div><div class="bet-note">Créditos virtuais • 207 posições lógicas • 9 prêmios + 198 perdas</div></section>
</main>
<nav class="bottom"><a href="/"><span>⌂</span>Início</a><a href="/dashboard.html"><span>👤</span>Área do jogador</a><a class="active" href="/roulette1.html"><span>◉</span>Roleta</a></nav>
<script>
(()=>{
const LOGICAL=207,VISUAL=18,ANGLE=360/VISUAL,BASE=-ANGLE/2,LOSS_PER_YELLOW=22,M=[2,3,4,5,6,7,8,9,10],DURATION=4800,EASING='cubic-bezier(.12,.78,.15,1)';
let rotation=0,busy=false;
const $=id=>document.getElementById(id);
const ns='http://www.w3.org/2000/svg';
function money(v){return`R$ ${Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}`}
function getUser(){try{return JSON.parse(localStorage.getItem('jpbet_user')||'null')}catch{return null}}
function polar(r,d){const a=(d-90)*Math.PI/180;return{x:250+r*Math.cos(a),y:250+r*Math.sin(a)}}
function path(r,a,b){const p=polar(r,a),q=polar(r,b);return`M250 250L${p.x} ${p.y}A${r} ${r} 0 0 1 ${q.x} ${q.y}Z`}
function setLabelRotation(angle,animate=false){document.querySelectorAll('#labels text').forEach(t=>{const x=t.getAttribute('data-x'),y=t.getAttribute('data-y');t.style.transition=animate?`transform ${DURATION}ms ${EASING}`:'none';t.setAttribute('transform',`rotate(${angle} ${x} ${y})`)})}
function draw(){const sg=$('sectors'),lg=$('labels');sg.innerHTML='';lg.innerHTML='';for(let group=0;group<9;group++){const blackStart=BASE+group*2*ANGLE,yellowStart=blackStart+ANGLE;let p=document.createElementNS(ns,'path');p.setAttribute('d',path(238,blackStart,blackStart+ANGLE));p.setAttribute('fill','#050505');p.setAttribute('stroke','#171717');p.setAttribute('stroke-width','0.9');sg.appendChild(p);p=document.createElementNS(ns,'path');p.setAttribute('d',path(238,yellowStart,yellowStart+ANGLE));p.setAttribute('fill','#c18b18');p.setAttribute('stroke','#c18b18');p.setAttribute('stroke-width','0.8');sg.appendChild(p);const center=blackStart+ANGLE/2,pos=polar(177,center),t=document.createElementNS(ns,'text');t.textContent=M[group]+'x';t.setAttribute('x',pos.x);t.setAttribute('y',pos.y);t.setAttribute('data-x',pos.x);t.setAttribute('data-y',pos.y);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-family','Arial Black,Arial');t.setAttribute('font-size','24');t.setAttribute('font-weight','900');t.setAttribute('fill','#fff');t.setAttribute('stroke','#050505');t.setAttribute('stroke-width','5');t.setAttribute('paint-order','stroke fill');lg.appendChild(t)}setLabelRotation(0);$('rotor').style.transform='none'}
function visualTargetFromServer(index){const idx=Math.max(0,Math.min(LOGICAL-1,Number(index)||0)),group=Math.floor(idx/23),offset=idx%23;if(group>8)return 0;return group*2*ANGLE+(offset===0?0:ANGLE+ANGLE*(offset-.5)/LOSS_PER_YELLOW)}
async function loadUser(){const u=getUser();if(!u?.id){$('status').textContent='Faça login para jogar.';return null}try{const r=await fetch('/api/user/'+encodeURIComponent(u.id),{cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json(),fresh=data.user||data;localStorage.setItem('jpbet_user',JSON.stringify({...u,...fresh}));$('balance').textContent=money(fresh.balance);$('status').textContent='Servidor conectado • 207 posições lógicas.';return fresh}catch{$('status').textContent='Não foi possível conectar ao servidor.';return u}}
async function spin(){if(busy)return;const u=await loadUser();if(!u?.id){location.href='/?login=1';return}if(Number(u.balance||0)<1){$('result').textContent='Saldo virtual insuficiente.';$('result').className='result loss';return}busy=true;$('spin').disabled=true;$('result').textContent='';$('status').textContent='Sorteando entre 207 posições…';try{const r=await fetch('/api/settings/roulette-large/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rouletteId:'roleta1',userId:Number(u.id),betAmount:1})});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.message||'Erro ao girar');const s=data.spin||{},idx=Math.max(0,Math.min(LOGICAL-1,Number(s.index)||0)),targetAngle=visualTargetFromServer(idx),current=((rotation%360)+360)%360,target=((360-targetAngle-current)+360)%360,to=rotation+360*3+target,rotor=$('rotor');
const delta=to-rotation;setLabelRotation(0,false);rotor.style.transition='none';rotor.style.transform=`rotate(${rotation}deg)`;void rotor.getBoundingClientRect();
requestAnimationFrame(()=>{rotor.style.transition=`transform ${DURATION}ms ${EASING}`;setLabelRotation(-delta,true);requestAnimationFrame(()=>{rotor.style.transform=`rotate(${to}deg)`})});
rotation=to;
const finish=()=>{rotor.removeEventListener('transitionend',finish);document.querySelectorAll('#labels text').forEach(t=>t.style.transition='none');setLabelRotation(-rotation,false);const prize=Number(s.prize||0),mult=Number(s.multiplier||0);$('result').textContent=prize>0?`🎉 ${mult}x — resultado confirmado pelo servidor`:'Você perdeu R$ 1,00.';$('result').className=prize>0?'result win':'result loss';const nu={...u,...(data.user||{})};localStorage.setItem('jpbet_user',JSON.stringify(nu));$('balance').textContent=money(nu.balance);$('status').textContent=(prize>0?`Posição ${idx+1}/207 • prêmio ${mult}x`:`Posição ${idx+1}/207 • perda`)+' • faixa visual correspondente.';busy=false;$('spin').disabled=false};rotor.addEventListener('transitionend',finish,{once:true});setTimeout(()=>{if(busy)finish()},DURATION+500)}catch(e){$('result').textContent=e.message||'Não foi possível girar.';$('result').className='result loss';$('status').textContent='Erro de comunicação com o servidor.';busy=false;$('spin').disabled=false}}
function init(){draw();loadUser();$('spin').addEventListener('click',spin)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
