<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MyBets — Lucky 7</title>
<style>
:root{--gold:#ffd45a;--gold2:#b97816;--blue:#2c8cff;--purple:#6c3cff;--bg:#03050a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -12%,#173c76 0,#0b1024 25%,#05070e 58%,#020307 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}button{font:inherit;cursor:pointer}
.header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(3,6,12,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,211,83,.25);position:sticky;top:0;z-index:20;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.logo{font-size:23px;font-weight:950;font-style:italic;letter-spacing:-1px}.logo b{color:var(--gold)}
.balance{min-width:154px;width:auto;height:42px;padding:8px 12px;border:1px solid rgba(255,211,83,.42);border-radius:11px;background:linear-gradient(180deg,#111925,#070b12);font-size:11px;font-weight:800;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px;line-height:1}
.balance b{display:inline!important;color:var(--gold);font-size:15px;margin:0!important;line-height:1}
.page{width:min(520px,94vw);margin:auto;padding:9px 0 24px}
.machine{position:relative;overflow:hidden;margin-top:0;padding:9px;border:2px solid #8e651b;border-radius:21px;background:linear-gradient(145deg,#071b32,#090c17 55%,#020306);box-shadow:0 18px 45px rgba(0,0,0,.7),inset 0 0 35px rgba(44,140,255,.08)}
.machine:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(65,143,255,.16),transparent 40%)}
.machine-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:3px 5px 7px}.machine-title{font-weight:950;font-size:15px;letter-spacing:.8px;color:#ffd968}.machine-sub{font-size:9px;color:#7f94a8}
.egypt{position:relative;z-index:1;height:78px;margin-bottom:8px;overflow:hidden;border-radius:14px;border:1px solid rgba(255,205,79,.42);background:linear-gradient(90deg,#06101c,#152f57,#06101c);display:flex;align-items:center;justify-content:center}
.egypt:before,.egypt:after{content:"";position:absolute;bottom:0;width:32px;height:68px;border:2px solid #dca52c;background:linear-gradient(180deg,#15100a,#4e2d08);opacity:.9}
.egypt:before{left:10px;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}.egypt:after{right:10px;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.egypt-title{font-size:31px;font-weight:1000;font-style:italic;letter-spacing:2px;color:#fff1a0;text-shadow:0 2px 0 #7a4200,0 0 18px rgba(61,150,255,.8);z-index:2}.egypt-title span{color:#4fa8ff}
.egypt-glyphs{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;color:#d99f27;font-size:22px;opacity:.22}
.paytable{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:7px;position:relative;z-index:2}.pay{min-height:45px;padding:5px 2px;text-align:center;border:1px solid rgba(255,211,83,.24);border-radius:8px;background:linear-gradient(145deg,#101e2d,#05080e);box-shadow:inset 0 1px rgba(255,255,255,.05)}.pay strong{display:block;font-size:19px;line-height:21px}.pay small{font-size:8px;color:var(--gold);font-weight:900}
.window{position:relative;z-index:2;padding:7px;border-radius:15px;background:#010205;border:1px solid #345070;box-shadow:inset 0 0 20px #000,0 5px 15px rgba(0,0,0,.6)}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.reel{height:105px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 27%,#fff9d8,#f0c54d 43%,#754005 100%);color:#160b00;font-size:51px;border:2px solid #f3d36d;box-shadow:inset 0 5px 12px rgba(255,255,255,.55),inset 0 -8px 12px rgba(80,30,0,.35),0 4px 10px rgba(0,0,0,.7);transition:.15s}.reel.spin{filter:blur(3px);transform:translateY(3px)}.reel.win{animation:pulse .65s infinite alternate;box-shadow:0 0 28px #ffd34f,inset 0 0 18px #fff}@keyframes pulse{to{transform:scale(1.04);filter:brightness(1.25)}}
.controls{display:grid;grid-template-columns:50px 1fr 50px;gap:6px;margin-top:8px;position:relative;z-index:2}.ctrl,.bet{border:1px solid rgba(255,205,83,.35);border-radius:11px;background:linear-gradient(180deg,#111e2b,#060a10);color:#fff}.ctrl{font-size:24px;color:var(--gold);font-weight:900}.bet{text-align:center;padding:7px}.bet small{display:block;color:#8090a0;font-size:8px;letter-spacing:1px}.bet b{font-size:17px;color:var(--gold)}
.spinbtn{position:relative;z-index:2;width:100%;margin-top:8px;padding:14px;border:1px solid #fff0a0;border-radius:14px;background:linear-gradient(180deg,#fff18b,#ffc52e,#b96b0d);font-size:20px;font-weight:1000;color:#251000;box-shadow:0 5px 0 #6f3507,0 10px 22px rgba(255,154,20,.22)}.spinbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #6f3507}.spinbtn:disabled{opacity:.55}
.result{position:relative;z-index:2;text-align:center;min-height:31px;margin-top:8px;font-weight:950;color:var(--gold);font-size:13px}.back{display:block;text-align:center;margin-top:10px;color:#9caab8;text-decoration:none;font-size:11px}
@media(max-width:430px){.page{width:96vw}.header{padding:0 10px}.balance{min-width:148px;padding:8px 10px}.balance b{font-size:14px}.egypt{height:67px}.egypt-title{font-size:27px}.reel{height:92px;font-size:44px}.pay{min-height:42px}.pay strong{font-size:17px}.pay small{font-size:7px}}
</style>
</head>
<body>
<header class="header"><div class="logo">My<b>Bets</b></div><div class="balance">SALDO <b id="balance">R$ 0,00</b></div></header>
<main class="page">
<section class="machine">
<div class="machine-top"><div class="machine-title">🎰 LUCKY 7</div><div class="machine-sub">MYBETS ORIGINAL</div></div>
<div class="egypt"><div class="egypt-glyphs">𓂀　𓆣　𓂀　𓆣　𓂀</div><div class="egypt-title">LUCKY <span>7</span></div></div>
<div class="paytable">
<div class="pay"><strong>7️⃣</strong><small>20x</small></div><div class="pay"><strong>⭐</strong><small>10x</small></div><div class="pay"><strong>🔔</strong><small>8x</small></div><div class="pay"><strong>🍒</strong><small>5x</small></div><div class="pay"><strong>🍋</strong><small>3x</small></div>
</div>
<div class="window"><div class="reels"><div class="reel" id="r1">7️⃣</div><div class="reel" id="r2">⭐</div><div class="reel" id="r3">🔔</div></div></div>
<div class="controls"><button class="ctrl" id="minus">−</button><div class="bet"><small>APOSTA</small><b>R$ <span id="bet">1,00</span></b></div><button class="ctrl" id="plus">+</button></div>
<button class="spinbtn" id="spin">↻ GIRAR</button><div class="result" id="result">Escolha a aposta e gire.</div>
</section>
<a class="back" href="/dashboard.html">← Voltar ao painel</a>
</main>
<script>const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});const symbols=[['7️⃣',20],['⭐',10],['🔔',8],['🍒',5],['🍋',3]];let user=null,bet=1,minBet=1,maxBet=100,spinning=false;function stored(){try{return JSON.parse(localStorage.getItem('jpbet_user')||'null')}catch{return null}}function uid(){return user?.id??user?.userId??user?.user_id??null}function save(u){user={...user,...u};localStorage.setItem('jpbet_user',JSON.stringify(user))}function update(){ $('balance').textContent='R$ '+money(user?.balance);$('bet').textContent=money(bet)}function draw(a){[$('r1'),$('r2'),$('r3')].forEach((e,i)=>{e.textContent=a[i][0];e.className='reel'})}function random(){return symbols[Math.floor(Math.random()*symbols.length)]}function setBet(v){bet=Math.max(minBet,Math.min(maxBet,v));update()}async function load(){user=stored();if(!uid()){$('result').textContent='Faça login para jogar.';$('spin').disabled=true;return}try{const r=await fetch('/api/user/'+uid(),{cache:'no-store'});const j=await r.json();if(j?.user)save(j.user)}catch{}try{const r=await fetch('/api/lucky7/config',{cache:'no-store'});const j=await r.json();minBet=Number(j?.lucky7?.minBet)||1;maxBet=Number(j?.lucky7?.maxBet)||100;bet=Math.max(minBet,Math.min(bet,maxBet))}catch{}update()}$('minus').onclick=()=>setBet(bet-1);$('plus').onclick=()=>setBet(bet+1);$('spin').onclick=async()=>{if(spinning||!uid())return;if(Number(user?.balance||0)<bet){$('result').textContent='Saldo disponível insuficiente.';return}spinning=true;$('spin').disabled=true;$('minus').disabled=true;$('plus').disabled=true;$('result').textContent='Girando...';let n=0;const timer=setInterval(()=>{draw([random(),random(),random()]);[$('r1'),$('r2'),$('r3')].forEach(e=>e.classList.add('spin'));if(++n>=16){clearInterval(timer);finish()}},70);async function finish(){try{const token=localStorage.getItem('jpbet_token');const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch('/api/lucky7/spin',{method:'POST',headers,body:JSON.stringify({userId:uid(),bet})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||'Não foi possível processar a jogada.');const s=j.result||{};const grid=Array.isArray(s.grid)&&s.grid.length===3?s.grid.map(x=>[x,0]):[[s.symbol,s.multiplier],[s.symbol,s.multiplier],[s.symbol,s.multiplier]];draw(grid);save({...user,balance:s.balance,bonusWagerProgress:s.bonusWagerProgress});if(s.multiplier){[$('r1'),$('r2'),$('r3')].forEach(e=>e.classList.add('win'));$('result').textContent='PRÊMIO: '+s.multiplier+'x — R$ '+money(s.payout)}else $('result').textContent='Não houve combinação. Tente novamente.';update()}catch(e){$('result').textContent=e.message}finally{spinning=false;$('spin').disabled=false;$('minus').disabled=false;$('plus').disabled=false}}};load();</script>
</body>
</html>
