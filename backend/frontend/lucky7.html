<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MyBets — Lucky 7</title>
<style>
:root{--gold:#ffd44f;--bg:#05070a;--panel:#0d141c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#352006,#05070a 55%);color:#fff;font-family:Arial,Helvetica,sans-serif}.header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#070b10;border-bottom:1px solid #604711;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:900;font-style:italic}.logo b{color:var(--gold)}.balance{padding:8px 12px;border:1px solid #75591c;border-radius:12px;background:#0c1117}.balance b{color:var(--gold)}.page{width:min(520px,94vw);margin:auto;padding:16px 0 32px}.hero{text-align:center;padding:22px 12px 14px}.eyebrow{font-size:10px;letter-spacing:3px;color:#d7ae42;font-weight:900}.hero h1{font-size:42px;margin:7px 0 3px;font-style:italic}.hero h1 span{color:var(--gold)}.hero p{color:#9ca7b3;font-size:12px;margin:0}.machine{margin-top:12px;padding:14px;border:2px solid #75591c;border-radius:22px;background:linear-gradient(145deg,#151d25,#080c11);box-shadow:0 18px 45px #0009}.paytable{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}.pay{padding:9px 3px;text-align:center;border:1px solid #3d321b;border-radius:9px;background:#0b1016}.pay strong{display:block;font-size:21px}.pay small{font-size:8px;color:var(--gold);font-weight:900}.window{padding:9px;border-radius:16px;background:#000;border:1px solid #443711;box-shadow:inset 0 0 20px #000}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reel{height:118px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#fff5c8,#e2ad32 45%,#6b3505);color:#1b0d00;font-size:58px;border:2px solid #f4d56e;box-shadow:inset 0 5px 12px #fff8,0 5px 10px #0008;transition:.15s}.reel.spin{filter:blur(3px);transform:translateY(3px)}.reel.win{box-shadow:0 0 28px #ffd34f,inset 0 0 18px #fff}.controls{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin-top:12px}.ctrl,.bet{border:1px solid #59451a;border-radius:12px;background:#0a1016;color:#fff}.ctrl{font-size:25px;color:var(--gold)}.bet{text-align:center;padding:9px}.bet small{display:block;color:#8c98a4;font-size:9px}.bet b{font-size:18px;color:var(--gold)}.spinbtn{width:100%;margin-top:12px;padding:16px;border:1px solid #fff0a0;border-radius:14px;background:linear-gradient(#fff08b,#ffc62e,#bd6d0c);font-size:21px;font-weight:900;color:#291000;box-shadow:0 5px 0 #713708}.spinbtn:disabled{opacity:.55}.result{text-align:center;min-height:35px;margin-top:12px;font-weight:900;color:var(--gold)}.back{display:block;text-align:center;margin-top:15px;color:#a9b3be;text-decoration:none;font-size:12px}@media(max-width:430px){.hero h1{font-size:36px}.reel{height:100px;font-size:48px}}
</style>
</head>
<body>
<header class="header"><div class="logo">My<b>Bets</b></div><div class="balance">SALDO <b id="balance">R$ 0,00</b></div></header>
<main class="page"><section class="hero"><div class="eyebrow">MYBETS ORIGINAL</div><h1>LUCKY <span>7</span></h1><p>Máquina simples de 3 rolos — créditos virtuais.</p></section>
<section class="machine"><div class="paytable"><div class="pay"><strong>7️⃣</strong><small>20x</small></div><div class="pay"><strong>⭐</strong><small>10x</small></div><div class="pay"><strong>🔔</strong><small>8x</small></div><div class="pay"><strong>🍒</strong><small>5x</small></div><div class="pay"><strong>🍋</strong><small>3x</small></div></div>
<div class="window"><div class="reels"><div class="reel" id="r1">7️⃣</div><div class="reel" id="r2">⭐</div><div class="reel" id="r3">🔔</div></div></div>
<div class="controls"><button class="ctrl" id="minus">−</button><div class="bet"><small>APOSTA</small><b>R$ <span id="bet">1,00</span></b></div><button class="ctrl" id="plus">+</button></div>
<button class="spinbtn" id="spin">🎰 GIRAR</button><div class="result" id="result">Escolha a aposta e gire.</div></section><a class="back" href="/dashboard.html">← Voltar ao painel</a></main>
<script>const $=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});const symbols=[['7️⃣',20],['⭐',10],['🔔',8],['🍒',5],['🍋',3],['🍊',2]];let user=null,bet=1,minBet=1,maxBet=100,spinning=false;function stored(){try{return JSON.parse(localStorage.getItem('jpbet_user')||'null')}catch{return null}}function uid(){return user?.id??user?.userId??user?.user_id??null}function save(u){user={...user,...u};localStorage.setItem('jpbet_user',JSON.stringify(user))}function update(){ $('balance').textContent='R$ '+money(user?.balance);$('bet').textContent=money(bet)}function draw(a){[$('r1'),$('r2'),$('r3')].forEach((e,i)=>{e.textContent=a[i][0];e.className='reel'})}function random(){return symbols[Math.floor(Math.random()*symbols.length)]}function setBet(v){bet=Math.max(minBet,Math.min(maxBet,v));update()}async function load(){user=stored();if(!uid()){$('result').textContent='Faça login para jogar.';$('spin').disabled=true;return}try{const r=await fetch('/api/user/'+uid(),{cache:'no-store'});const j=await r.json();if(j?.user)save(j.user)}catch{}try{const r=await fetch('/api/lucky7/config',{cache:'no-store'});const j=await r.json();minBet=Number(j?.lucky7?.minBet)||1;maxBet=Number(j?.lucky7?.maxBet)||100;bet=Math.max(minBet,Math.min(bet,maxBet))}catch{}update()}$('minus').onclick=()=>setBet(bet-1);$('plus').onclick=()=>setBet(bet+1);$('spin').onclick=async()=>{if(spinning||!uid())return;if(Number(user?.balance||0)<bet){$('result').textContent='Saldo disponível insuficiente.';return}spinning=true;$('spin').disabled=true;$('minus').disabled=true;$('plus').disabled=true;$('result').textContent='Girando...';let n=0;const timer=setInterval(()=>{draw([random(),random(),random()]);[$('r1'),$('r2'),$('r3')].forEach(e=>e.classList.add('spin'));if(++n>=16){clearInterval(timer);finish()}},70);async function finish(){try{const token=localStorage.getItem('jpbet_token');const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch('/api/lucky7/spin',{method:'POST',headers,body:JSON.stringify({userId:uid(),bet})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||'Não foi possível processar a jogada.');const s=j.result||{};draw([[s.symbol,s.multiplier],[s.symbol,s.multiplier],[s.symbol,s.multiplier]]);save({...user,balance:s.balance,bonusWagerProgress:s.bonusWagerProgress});if(s.multiplier){[$('r1'),$('r2'),$('r3')].forEach(e=>e.classList.add('win'));$('result').textContent='PRÊMIO: '+s.multiplier+'x — R$ '+money(s.payout)}else $('result').textContent='Não houve combinação. Tente novamente.';update()}catch(e){$('result').textContent=e.message}finally{spinning=false;$('spin').disabled=false;$('minus').disabled=false;$('plus').disabled=false}}};load();</script></body></html>
