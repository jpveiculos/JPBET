<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Bets - Configurações</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f3f8;color:#171717}.container{max-width:980px;margin:auto;padding:16px}h1{margin:0 0 5px;font-size:28px}.subtitle{margin:0;color:#666}.card{background:#fff;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 4px 15px rgba(0,0,0,.06)}h2{margin:0 0 16px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700;font-size:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #d4d8e0;border-radius:9px;background:#f9fafc;font-size:16px}textarea{min-height:82px}.row{display:flex;align-items:center;gap:10px}.row input[type=checkbox]{width:20px;height:20px}.actions{display:grid;gap:10px}.btn{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}.save{background:#6c3cff;color:#fff}.back{background:#252b36;color:#fff}.logout{background:#8b0000;color:#fff}.msg{text-align:center;min-height:22px;font-weight:700;margin:10px 0}.ok{color:#16852a}.err{color:#c62828}@media(max-width:650px){.grid{grid-template-columns:1fr}.container{padding:12px}h1{font-size:24px}}
</style></head>
<body><div class="container">
<button class="btn back" onclick="location.href='admin.html'">← VOLTAR PARA ADMINISTRAÇÃO</button>
<h1>MyBets</h1><p class="subtitle">Painel de configurações</p><div id="msg" class="msg"></div>
<div class="card"><h2>⚙️ Configurações gerais</h2><div class="grid">
<div class="field"><label>Nome da plataforma</label><input id="site_name"></div><div class="field"><label>Título da plataforma</label><input id="site_title"></div>
<div class="field full"><label>Descrição</label><textarea id="site_description"></textarea></div><div class="field full"><label>Texto do rodapé</label><input id="footer_text"></div>
<div class="field"><label>Valor do bônus inicial</label><input id="initial_bonus_amount" type="number" step="0.01"></div><div class="field"><label>Exigência de apostas do bônus</label><input id="bonus_wager_requirement" type="number" step="0.01"></div>
<div class="field full"><label>Mensagem de manutenção</label><textarea id="maintenance_message"></textarea></div><div class="field full"><div class="row"><input id="bonus_system_enabled" type="checkbox"><label for="bonus_system_enabled">Ativar sistema de bônus</label></div></div><div class="field full"><div class="row"><input id="maintenance_mode" type="checkbox"><label for="maintenance_mode">Ativar modo manutenção</label></div></div>
</div></div>
<div class="card"><h2>💳 Pix / Depósitos</h2><div class="grid"><div class="field"><div class="row"><input id="pix_enabled" type="checkbox"><label for="pix_enabled">Ativar depósitos via Pix</label></div></div><div class="field"><label>Tipo da chave</label><select id="pix_key_type"><option value="aleatoria">Chave aleatória</option><option value="cpf">CPF</option><option value="cnpj">CNPJ</option><option value="email">E-mail</option><option value="telefone">Telefone</option></select></div><div class="field full"><label>Chave Pix</label><input id="pix_key"></div><div class="field"><label>Nome do recebedor</label><input id="pix_receiver_name"></div><div class="field"><label>Cidade</label><input id="pix_city"></div><div class="field full"><label>Descrição</label><input id="pix_description"></div><div class="field full"><label>Instruções</label><textarea id="pix_instructions"></textarea></div></div></div>
<div class="card"><h2>🔔 Notificações</h2><div class="grid"><div class="field full"><div class="row"><input id="notification_enabled" type="checkbox"><label for="notification_enabled">Ativar notificações</label></div></div><div class="field"><label>Webhook URL</label><input id="notification_webhook_url"></div><div class="field"><label>Token</label><input id="notification_webhook_token"></div><div class="field"><label>Destinatário</label><input id="notification_recipient"></div></div></div>
<div class="card"><h2>📝 Textos do dashboard</h2><div class="grid"><div class="field full"><label>Boas-vindas</label><input id="dashboard_welcome_text"></div><div class="field"><label>Título do saldo</label><input id="balance_title"></div><div class="field"><label>Título da conta</label><input id="account_title"></div><div class="field"><label>Botão entrar</label><input id="login_button_text"></div><div class="field"><label>Botão criar conta</label><input id="register_button_text"></div><div class="field"><label>Botão roleta</label><input id="roulette_button_text"></div><div class="field"><label>Botão depositar</label><input id="deposit_button_text"></div><div class="field"><label>Botão sacar</label><input id="withdraw_button_text"></div><div class="field"><label>Botão histórico</label><input id="history_button_text"></div><div class="field"><label>Botão sair</label><input id="logout_button_text"></div></div></div>
<div class="card"><h2>🎮 Créditos virtuais</h2><div class="grid"><div class="field full"><div class="row"><input id="virtual_credits_mode" type="checkbox"><label for="virtual_credits_mode">Ativar modo de créditos virtuais</label></div></div><div class="field full"><label>Texto</label><textarea id="virtual_credits_text"></textarea></div><div class="field full"><label>Aviso</label><textarea id="virtual_credits_notice"></textarea></div><div class="field full"><label>Observação</label><textarea id="virtual_credits_disclaimer"></textarea></div></div></div>
<div class="actions"><button class="btn save" onclick="saveAll()">💾 SALVAR CONFIGURAÇÕES</button><button class="btn logout" onclick="logout()">SAIR DO ADMIN</button></div></div>
<script>
let settings={};
const ids=['site_name','site_title','site_description','footer_text','initial_bonus_amount','bonus_wager_requirement','maintenance_message','bonus_system_enabled','maintenance_mode','pix_enabled','pix_key_type','pix_key','pix_receiver_name','pix_city','pix_description','pix_instructions','notification_enabled','notification_webhook_url','notification_webhook_token','notification_recipient','dashboard_welcome_text','balance_title','account_title','login_button_text','register_button_text','roulette_button_text','deposit_button_text','withdraw_button_text','history_button_text','logout_button_text','virtual_credits_mode','virtual_credits_text','virtual_credits_notice','virtual_credits_disclaimer'];
function msg(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err')}
function bool(v){return String(v).toLowerCase()==='true'}
async function load(){try{const r=await fetch('/api/settings',{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(d.message||'Acesso negado');settings={};(d.settings||[]).forEach(x=>settings[x.setting_key]=x.setting_value);ids.forEach(id=>{const e=document.getElementById(id);if(!e)return;e.type==='checkbox'?e.checked=bool(settings[id]):e.value=settings[id]??''});msg('Configurações carregadas.',true)}catch(e){msg(e.message||'Não foi possível carregar as configurações.')}}
async function saveAll(){try{const out={};ids.forEach(id=>{const e=document.getElementById(id);if(e)out[id]=e.type==='checkbox'?String(e.checked):e.value});msg('Salvando...',true);const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(out)});const d=await r.json();if(!r.ok)throw Error(d.message||'Erro ao salvar configurações');msg('Configurações salvas com sucesso!',true)}catch(e){console.error(e);msg(e.message||'Erro ao salvar')}}
async function logout(){try{await fetch('/api/auth/admin-logout',{method:'POST',credentials:'same-origin'})}finally{location.href='admin.html'}}
load();
</script><script src="/navigation.js"></script>
</body></html>
