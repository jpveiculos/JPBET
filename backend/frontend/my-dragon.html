<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>MyBets — My Dragon</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at top,
      #38170b 0%,
      #120806 45%,
      #050505 100%
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

header{
  padding:15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(0,0,0,.6);

  border-bottom:
    1px solid #3d260f;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#d9aa38;
}

.balance-box{
  padding:9px 13px;

  border:
    1px solid #806021;

  border-radius:12px;

  background:#111;

  color:#e6bc52;

  font-weight:bold;
}

main{
  width:100%;
  max-width:520px;

  margin:auto;

  padding:18px;
}

.title{
  text-align:center;
}

.title h1{
  margin:5px 0;

  color:#e0af3d;

  font-size:34px;
  font-weight:900;

  text-shadow:
    0 2px 10px #000;
}

.title p{
  margin:6px 0 0;

  color:#aaa;
}

.machine{

  margin-top:22px;

  padding:16px;

  border:
    2px solid #81521d;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      #291307,
      #110807 55%,
      #050505
    );

  box-shadow:
    0 18px 40px rgba(0,0,0,.7);
}

.reels{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:6px;

  padding:8px;

  background:#020202;

  border-radius:15px;

  border:
    1px solid #503515;
}

.reel{

  height:105px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #fff,
      #ddd
    );

  color:#111;

  border-radius:8px;

  font-size:38px;

  user-select:none;

  box-shadow:
    inset 0 2px 5px
    rgba(255,255,255,.8),

    inset 0 -5px 8px
    rgba(0,0,0,.15);
}

.controls{

  display:flex;

  gap:8px;

  margin-top:18px;
}

.controls button{

  width:52px;
  height:50px;

  border:
    1px solid #89631f;

  border-radius:11px;

  background:#151515;

  color:#fff;

  font-size:24px;
  font-weight:bold;
}

.controls button:disabled{
  opacity:.45;
}

.bet{

  flex:1;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  border-radius:11px;

  background:#111;

  border:
    1px solid #333;

  color:#fff;

  font-size:13px;

  font-weight:bold;
}

.bet-value{

  margin-top:3px;

  color:#e1b94d;

  font-size:18px;
}

.spin{

  width:100%;

  margin-top:15px;

  padding:17px;

  border:0;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #a96e15,
      #e5b83f,
      #f4d66f,
      #b97a18
    );

  color:#090909;

  font-size:21px;

  font-weight:900;
}

.spin:disabled{
  opacity:.5;
}

.result{

  min-height:30px;

  margin-top:15px;

  text-align:center;

  color:#e5bb4c;

  font-size:15px;

  font-weight:bold;
}

.info{

  margin-top:15px;

  padding:10px;

  text-align:center;

  color:#999;

  font-size:12px;
}

.back{

  display:block;

  margin-top:20px;

  text-align:center;

  color:#999;

  text-decoration:none;
}

@media(max-width:380px){

  main{
    padding:12px;
  }

  .machine{
    padding:11px;
  }

  .reel{
    height:82px;
    font-size:31px;
  }

  .title h1{
    font-size:29px;
  }

}

</style>

</head>

<body>

<header>

  <div class="logo">
    My<span>Bets</span>
  </div>

  <div class="balance-box">

    R$
    <span id="balance">
      0,00
    </span>

  </div>

</header>


<main>

  <div class="title">

    <h1>
      🐉 MY DRAGON
    </h1>

    <p>
      Tesouros do Dragão
    </p>

  </div>


  <div class="machine">

    <div
      class="reels"
      id="reels"
    ></div>


    <div class="controls">

      <button
        type="button"
        id="minus"
      >
        −
      </button>


      <div class="bet">

        APOSTA

        <div class="bet-value">

          R$
          <span id="bet">
            1,00
          </span>

        </div>

      </div>


      <button
        type="button"
        id="plus"
      >
        +
      </button>

    </div>


    <button
      type="button"
      class="spin"
      id="spin"
    >
      GIRAR
    </button>


    <div
      class="result"
      id="result"
      aria-live="polite"
    ></div>


    <div class="info">

      🐉 50x · 💎 20x · 👑 15x ·
      🪙 10x · 🔥 8x · 🏆 6x ·
      🍀 5x · 7️⃣ 25x

    </div>

  </div>


  <a
    href="/dashboard.html"
    class="back"
  >
    ← Voltar para o painel
  </a>

</main>


<script>

const API =
  "/api/my-dragon";


const symbols = [

  {
    id:"dragon",
    label:"🐉",
    multiplier:50
  },

  {
    id:"diamond",
    label:"💎",
    multiplier:20
  },

  {
    id:"crown",
    label:"👑",
    multiplier:15
  },

  {
    id:"coin",
    label:"🪙",
    multiplier:10
  },

  {
    id:"fire",
    label:"🔥",
    multiplier:8
  },

  {
    id:"trophy",
    label:"🏆",
    multiplier:6
  },

  {
    id:"clover",
    label:"🍀",
    multiplier:5
  },

  {
    id:"seven",
    label:"7️⃣",
    multiplier:25
  }

];


let user = null;

let bet = 1;

let spinning = false;


const reels =
  document.getElementById(
    "reels"
  );

const balanceElement =
  document.getElementById(
    "balance"
  );

const betElement =
  document.getElementById(
    "bet"
  );

const resultElement =
  document.getElementById(
    "result"
  );

const spinButton =
  document.getElementById(
    "spin"
  );

const minusButton =
  document.getElementById(
    "minus"
  );

const plusButton =
  document.getElementById(
    "plus"
  );


function money(value){

  return Number(
    value || 0
  ).toLocaleString(
    "pt-BR",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function getStoredUser(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "jpbet_user"
      ) || "null"
    );

  }catch{

    return null;

  }

}


function getUserId(){

  return (
    user?.id ??
    user?.userId ??
    user?.user_id ??
    null
  );

}


function saveUser(data){

  if(!data){
    return;
  }

  user = data;

  try{

    localStorage.setItem(
      "jpbet_user",
      JSON.stringify(data)
    );

  }catch(_){}

}


function updateBalance(){

  balanceElement.textContent =
    money(user?.balance);

}


function updateBet(){

  betElement.textContent =
    money(bet);

}


/*
=========================================================
 API
=========================================================
*/

async function api(
  path,
  options = {}
){

  const headers = {
    "Content-Type":
      "application/json"
  };


  try{

    const token =
      localStorage.getItem(
        "jpbet_token"
      );

    if(token){

      headers.Authorization =
        `Bearer ${token}`;

    }

  }catch(_){}


  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers
      }
    );


  const text =
    await response.text();


  let data = {};

  try{

    data =
      text
        ? JSON.parse(text)
        : {};

  }catch(_){}


  if(!response.ok){

    throw new Error(
      data.message ||
      data.error ||
      `Erro HTTP ${response.status}`
    );

  }


  return data;

}


/*
=========================================================
 CARREGA USUÁRIO
=========================================================
*/

async function loadUser(){

  user =
    getStoredUser();


  const id =
    getUserId();


  if(!id){

    resultElement.textContent =
      "Faça login para jogar.";

    spinButton.disabled =
      true;

    minusButton.disabled =
      true;

    plusButton.disabled =
      true;

    updateBalance();

    return;

  }


  try{

    const data =
      await fetch(
        `/api/user/${id}`
      );


    const json =
      await data.json();


    if(
      json?.success &&
      json?.user
    ){

      saveUser(
        json.user
      );

    }else if(
      json?.ok &&
      json?.user
    ){

      saveUser(
        json.user
      );

    }


    updateBalance();


  }catch(error){

    console.error(
      "Erro ao carregar usuário:",
      error
    );

    updateBalance();

  }

}


/*
=========================================================
 DESENHA ROLOS
=========================================================
*/

function drawReels(
  items
){

  reels.innerHTML = "";


  items.forEach(
    symbol => {

      const element =
        document.createElement(
          "div"
        );

      element.className =
        "reel";

      element.textContent =
        symbol.label;

      reels.appendChild(
        element
      );

    }
  );

}


/*
=========================================================
 GRADE INICIAL
=========================================================
*/

drawReels([

  symbols[0],
  symbols[1],
  symbols[2],
  symbols[3],
  symbols[7]

]);


/*
=========================================================
 MENOS
=========================================================
*/

minusButton.addEventListener(
  "click",
  () => {

    if(spinning){
      return;
    }

    bet =
      Math.max(
        1,
        bet - 1
      );

    updateBet();

  }
);


/*
=========================================================
 MAIS
=========================================================
*/

plusButton.addEventListener(
  "click",
  () => {

    if(spinning){
      return;
    }


    const balance =
      Number(
        user?.balance || 0
      );


    if(
      bet + 1 <= balance
    ){

      bet += 1;

    }


    updateBet();

  }
);


/*
=========================================================
 ANIMAÇÃO
=========================================================
*/

function animateReels(){

  return new Promise(
    resolve => {

      let ticks = 0;


      const timer =
        setInterval(
          () => {

            const temporary =
              [];


            for(
              let i = 0;
              i < 15;
              i++
            ){

              temporary.push(
                symbols[
                  Math.floor(
                    Math.random() *
                    symbols.length
                  )
                ]
              );

            }


            drawReels(
              temporary
            );


            ticks++;


            if(
              ticks >= 20
            ){

              clearInterval(
                timer
              );

              resolve();

            }

          },
          75
        );

    }
  );

}


/*
=========================================================
 GIRAR
=========================================================
*/

spinButton.addEventListener(
  "click",
  async () => {

    if(spinning){
      return;
    }


    const userId =
      getUserId();


    if(!userId){

      resultElement.textContent =
        "Faça login para jogar.";

      return;

    }


    const currentBalance =
      Number(
        user?.balance || 0
      );


    if(
      !Number.isFinite(currentBalance) ||
      currentBalance < bet
    ){

      resultElement.textContent =
        "Saldo disponível insuficiente.";

      return;

    }


    spinning = true;

    spinButton.disabled =
      true;

    minusButton.disabled =
      true;

    plusButton.disabled =
      true;


    resultElement.textContent =
      "🐉 Girando...";


    try{

      /*
      Primeiro fazemos a animação
      visual.
      */

      await animateReels();


      /*
      O resultado verdadeiro
      vem do servidor.
      */

      const data =
        await api(
          "/spin",
          {
            method:"POST",

            body:JSON.stringify({
              userId,
              betAmount:bet
            })
          }
        );


      if(
        !data.ok
      ){

        throw new Error(
          data.message ||
          "Não foi possível realizar o giro."
        );

      }


      /*
      ------------------------------
      MOSTRA RESULTADO VERDADEIRO
      ------------------------------
      */

      const spin =
        data.spin;


      const finalGrid =
        (spin.grid || [])
          .map(
            item => {

              return (
                symbols.find(
                  symbol =>
                    symbol.id ===
                    item.id
                )
                ||
                {
                  id:item.id,
                  label:item.label
                }
              );

            }
          );


      drawReels(
        finalGrid
      );


      /*
      ------------------------------
      ATUALIZA USUÁRIO
      ------------------------------
      */

      if(data.user){

        saveUser(
          data.user
        );

      }


      updateBalance();


      /*
      ------------------------------
      RESULTADO
      ------------------------------
      */

      if(spin.won){

        resultElement.textContent =
          "🐉 PRÊMIO! " +
          spin.winningLabel +
          " × " +
          spin.multiplier +
          " — R$ " +
          money(spin.prize);

      }else{

        resultElement.textContent =
          "Não foi dessa vez.";

      }


    }catch(error){

      console.error(
        "Erro no My Dragon:",
        error
      );


      resultElement.textContent =
        error.message ||
        "Erro ao realizar o giro.";

    }


    spinning = false;

    spinButton.disabled =
      false;

    minusButton.disabled =
      false;

    plusButton.disabled =
      false;

  }
);


/*
=========================================================
 INICIALIZAÇÃO
=========================================================
*/

updateBet();

loadUser();

</script>


<script src="/brand-standard.js?v=1"></script>
</body>

</html>
