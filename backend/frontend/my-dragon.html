<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dragon — MyBets</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#320b0b,#110609 55%,#050506);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.brand b{color:#f6bd24}.back{color:#fff;text-decoration:none;font-size:13px}.card{margin-top:18px;padding:18px;border-radius:22px;background:#170b0b;border:1px solid #8d3a20;box-shadow:0 18px 55px #000}.title{text-align:center;font-size:29px;font-weight:900}.sub{text-align:center;color:#d9a59b;margin:5px 0 16px}.balance{display:flex;justify-content:space-between;padding:12px;background:#260e0e;border-radius:13px}.balance strong{color:#ffcb4b}.machine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:11px;margin-top:14px;border-radius:17px;background:#090707;border:2px solid #b05b25}.cell{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,#421414,#1b0909);border-radius:12px;font-size:38px}.cell.win{animation:glow .3s infinite alternate}@keyframes glow{to{transform:scale(1.08);box-shadow:0 0 25px #ff9e38}}.bet{display:flex;align-items:center;gap:10px;margin:15px 0}.bet input{flex:1;background:#0c0808;color:#fff;border:1px solid #79412d;border-radius:12px;padding:13px;font-size:18px}.spin{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#e88924,#ffd35a);color:#241000;font-size:18px;font-weight:900}.status{text-align:center;min-height:25px;margin:13px 0;color:#ffd59c}.pay{line-height:1.9;color:#d8b9ae;font-size:13px}.pay b{color:#fff}.note{text-align:center;font-size:11px;color:#8f7169;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><div class="brand">My <b>Dragon</b></div><a class="back" href="/dashboard.html">← Voltar</a></div><section class="card"><div class="title">🐲 MY DRAGON</div><div class="sub">Slot demonstrativo de créditos virtuais</div><div class="balance"><span>Saldo demonstrativo</span><strong id="balance">1.000</strong></div><div id="machine" class="machine"></div><div class="bet"><label>Aposta</label><input id="bet" type="number" min="1" step="1" value="5"></div><button id="spin" class="spin">🔥 GIRAR</button><div id="status" class="status">Prepare sua rodada demonstrativa.</div><div class="pay"><b>Tabela demonstrativa</b><br>🐲🐲🐲 = 60 créditos<br>💰💰💰 = 35 créditos<br>👑👑👑 = 25 créditos<br>🔥🔥🔥 = 15 créditos<br>🍒🍒🍒 = 8 créditos</div><div class="note">Modo independente: não usa saldo nem API de produção.</div></section></main><script>const symbols=['🐲','💰','👑','🔥','🍒','🪙','🔔','7️⃣','🍋'];const pay={'🐲':60,'💰':35,'👑':25,'🔥':15,'🍒':8};let bal=1000;const machine=document.getElementById('machine');for(let i=0;i<9;i++){const d=document.createElement('div');d.className='cell';d.textContent=symbols[Math.floor(Math.random()*symbols.length)];machine.appendChild(d)}const cells=[...document.querySelectorAll('.cell')];function render(){cells.forEach(c=>c.textContent=symbols[Math.floor(Math.random()*symbols.length)])}document.getElementById('spin').onclick=()=>{const bet=Math.max(1,Number(document.getElementById('bet').value)||0);if(bet>bal){status.textContent='Saldo demonstrativo insuficiente.';return}bal-=bet;balance.textContent=bal.toLocaleString('pt-BR');let n=0;const timer=setInterval(()=>{render();if(++n>=13){clearInterval(timer);let prize=0;for(let r=0;r<3;r++){const row=cells.slice(r*3,r*3+3);if(row.every(x=>x.textContent===row[0].textContent)){prize=Math.max(prize,pay[row[0].textContent]||0);row.forEach(x=>x.classList.add('win'));setTimeout(()=>row.forEach(x=>x.classList.remove('win')),800)}}if(prize)bal+=prize;balance.textContent=bal.toLocaleString('pt-BR');status.textContent=prize?'Resultado demonstrativo: +'+prize+' créditos.':'Resultado demonstrativo: sem prêmio.'}},65)};const status=document.getElementById('status'),balance=document.getElementById('balance');</script></body></html>
