<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MyBets — My Dragon</title>
<style>
:root{--gold:#ffd45a;--gold2:#b97816;--red:#ff4b18;--deep:#080303;--panel:#160806}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#6d250d 0,#210b06 28%,#070303 68%,#020202 100%);color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}button{font:inherit;cursor:pointer}
.header{height:64px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(5,3,3,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,190,55,.22);box-shadow:0 8px 28px rgba(0,0,0,.45)}.logo{font-size:22px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--gold)}.balance{padding:8px 12px;border:1px solid rgba(255,211,85,.45);border-radius:12px;background:linear-gradient(180deg,#17100c,#090606);font-size:13px;font-weight:800}.balance b{color:var(--gold);font-size:16px}
.page{max-width:720px;margin:auto;padding:10px 10px 25px}.hero{position:relative;min-height:215px;overflow:hidden;border:1px solid rgba(255,190,55,.42);border-radius:24px;background:linear-gradient(135deg,#310d06,#0d0503 65%,#020202);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 45px rgba(255,65,15,.12)}.hero:after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}.hero-art{position:absolute;right:-4%;bottom:-12%;width:64%;height:115%;opacity:.96;filter:drop-shadow(0 12px 16px rgba(0,0,0,.8))}.hero-copy{position:relative;z-index:3;width:55%;padding:27px 20px}.eyebrow{font-size:10px;letter-spacing:3px;color:#ffbd45;font-weight:900}.hero h1{margin:6px 0 4px;font-size:38px;line-height:.95;font-style:italic;text-transform:uppercase;text-shadow:0 3px 14px #000}.hero h1 span{color:#ff6428}.hero p{margin:8px 0 0;color:#e2bfae;font-size:12px;line-height:1.45}.badges{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.badge{padding:6px 9px;border-radius:999px;background:rgba(255,174,50,.1);border:1px solid rgba(255,190,55,.3);font-size:10px;color:#ffd879;font-weight:800}
.machine{margin-top:4px;padding:8px;border:2px solid #8f5117;border-radius:24px;background:linear-gradient(145deg,#2b1008,#100605 52%,#050202);box-shadow:0 18px 45px rgba(0,0,0,.7),inset 0 0 35px rgba(255,72,15,.08)}.machine-top{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 7px}.machine-title{font-weight:900;font-size:14px;letter-spacing:1px;color:#ffd56a}.rtp{font-size:10px;color:#9d8377}.paytable{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}.pay{min-height:48px;border:1px solid rgba(255,190,55,.22);border-radius:9px;background:linear-gradient(145deg,#261009,#0b0503);display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 1px rgba(255,255,255,.06)}.pay .sym{font-size:21px}.pay small{font-size:9px;color:#ffd46b;font-weight:900}
.reel-window{position:relative;padding:8px;border-radius:17px;background:linear-gradient(180deg,#090403,#000);border:1px solid #5b2d0b;box-shadow:inset 0 0 18px #000,0 5px 15px rgba(0,0,0,.6)}.reel-window:before{content:"";position:absolute;inset:8px;pointer-events:none;border:1px solid rgba(255,196,69,.13);border-radius:12px;z-index:5}.reels{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,78px);gap:5px}.reel{position:relative;display:flex;align-items:center;justify-content:center;border-radius:9px;background:radial-gradient(circle at 50% 30%,#fff7d5,#f3c95b 42%,#9d4d08 100%);border:1px solid rgba(255,224,132,.8);color:#210b03;font-size:31px;box-shadow:inset 0 2px 7px rgba(255,255,255,.75),inset 0 -7px 12px rgba(80,18,0,.38),0 2px 6px rgba(0,0,0,.55);text-shadow:0 2px 3px rgba(255,255,255,.45);user-select:none;transition:.18s}.reel.win{animation:winPulse .8s ease-in-out infinite alternate;box-shadow:0 0 20px rgba(255,185,50,.85),inset 0 0 15px #fff3a0}.reel.spinfx{filter:blur(1.8px);transform:translateY(2px)}@keyframes winPulse{to{transform:scale(1.04);filter:brightness(1.25)}}
.controls{display:grid;grid-template-columns:52px 1fr 52px;gap:7px;margin-top:10px}.ctrl,.betbox{border:1px solid rgba(255,190,55,.3);border-radius:12px;background:linear-gradient(180deg,#1c0d08,#0b0503);color:#fff}.ctrl{font-size:25px;font-weight:900;color:#ffd45a}.betbox{text-align:center;padding:8px}.betbox label{display:block;font-size:9px;color:#a88d80;letter-spacing:1px}.betbox strong{display:block;color:#ffd45a;font-size:18px;margin-top:2px}.spin{position:relative;width:100%;margin-top:10px;padding:15px;border:1px solid #ffe49a;border-radius:15px;background:linear-gradient(180deg,#fff08b 0,#ffc52e 40%,#bd6b0c 100%);color:#260b00;font-size:20px;font-weight:1000;letter-spacing:1px;box-shadow:0 5px 0 #713708,0 10px 25px rgba(255,136,10,.24);text-shadow:0 1px rgba(255,255,255,.5)}.spin:active{transform:translateY(3px);box-shadow:0 2px 0 #713708}.spin:disabled{opacity:.55}.result{min-height:34px;margin:11px 5px 0;text-align:center;font-size:14px;font-weight:900;color:#ffd45a}.result.win{color:#fff1a1;text-shadow:0 0 15px #ff8b13;font-size:17px}.footer-row{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding:8px 4px 0;color:#8d7469;font-size:10px}.back{color:#c8a98e;text-decoration:none}.mini-note{color:#866d60}.home{display:block;text-align:center;margin:15px 0 5px;color:#a8948a;text-decoration:none;font-size:12px}
@media(max-width:430px){.reels{grid-template-rows:repeat(3,67px)}.reel{font-size:27px}.pay .sym{font-size:18px}.pay small{font-size:8px}}
</style>
<style id="mybets-game-footer-style">body{padding-bottom:76px!important}.mybets-game-footer{position:fixed;left:0;right:0;bottom:0;z-index:9999;height:64px;display:flex;justify-content:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(3,6,12,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,211,83,.32);box-shadow:0 -8px 24px rgba(0,0,0,.45)}.mybets-game-footer a{flex:1;max-width:210px;height:48px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,211,83,.28);border-radius:12px;background:linear-gradient(180deg,#111e2b,#060a10);color:#fff;text-decoration:none;font:800 12px Arial,Helvetica,sans-serif}.mybets-game-footer a:first-child{color:#ffd45a}.mybets-game-footer span{font-size:19px;line-height:1}.mybets-game-footer b{font-weight:900}@media(max-width:430px){.mybets-game-footer{height:66px;padding-left:10px;padding-right:10px}.mybets-game-footer a{height:46px;font-size:11px}}</style></head>
<body>
<header class="header"><div class="logo">My<span>Bets</span></div><div class="balance">SALDO <b id="balance">R$ 0,00</b></div></header>
<main class="page">
<section class="machine">
<div class="machine-top"><div class="machine-title">🐉 MY DRAGON</div><div class="rtp">RTP teórico 70% · independente do servidor</div></div>

<div class="paytable"><div class="pay"><span class="sym">🐉</span><small>50x</small></div><div class="pay"><span class="sym">7️⃣</span><small>25x</small></div><div class="pay"><span class="sym">💎</span><small>20x</small></div><div class="pay"><span class="sym">👑</span><small>15x</small></div><div class="pay"><span class="sym">🪙</span><small>10x</small></div><div class="pay"><span class="sym">🔥</span><small>8x</small></div><div class="pay"><span class="sym">🏆</span><small>6x</small></div><div class="pay"><span class="sym">🍀</span><small>5x</small></div></div>
<div class="reel-window"><div class="reels" id="reels"></div></div>
<div class="controls"><button class="ctrl" id="minus">−</button><div class="betbox"><label>APOSTA</label><strong>R$ <span id="bet">1,00</span></strong></div><button class="ctrl" id="plus">+</button></div>
<button class="spin" id="spin">🐉 GIRAR</button><div class="result" id="result" aria-live="polite"></div>
<div class="footer-row"><span class="mini-note">3 símbolos = prêmio</span></div>
</section>
</main>
<script>
const API="/api/my-dragon";const symbols=[{id:"dragon",label:"🐉",multiplier:50},{id:"diamond",label:"💎",multiplier:20},{id:"crown",label:"👑",multiplier:15},{id:"coin",label:"🪙",multiplier:10},{id:"fire",label:"🔥",multiplier:8},{id:"trophy",label:"🏆",multiplier:6},{id:"clover",label:"🍀",multiplier:5},{id:"seven",label:"7️⃣",multiplier:25}];let user=null,bet=1,spinning=false;const $=id=>document.getElementById(id);const money=v=>Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});function stored(){try{return JSON.parse(localStorage.getItem("mybets_user")||"null")}catch{return null}}function uid(){return user?.id??user?.userId??user?.user_id??null}function save(u){if(!u)return;user={...user,...u};try{localStorage.setItem("mybets_user",JSON.stringify(user))}catch{}}function update(){
$("balance").textContent="R$ "+money(user?.balance);$("bet").textContent=money(bet)}function draw(items){$("reels").innerHTML="";items.forEach((s,i)=>{const d=document.createElement("div");d.className="reel";d.dataset.id=s.id;d.textContent=s.label;$("reels").appendChild(d)})}function initial(){draw([symbols[0],symbols[1],symbols[2],symbols[3],symbols[4],symbols[5],symbols[6],symbols[7],symbols[2],symbols[3],symbols[0],symbols[6],symbols[4],symbols[1],symbols[5]])}async function load(){user=stored();if(!uid()){$("result").textContent="Faça login para jogar.";$("spin").disabled=true;return}try{const r=await fetch(`/api/user/${uid()}`,{cache:"no-store"});const j=await r.json();if(j?.user)save(j.user)}catch{}update()}function animate(){return new Promise(resolve=>{let t=0;const timer=setInterval(()=>{draw(Array.from({length:15},()=>symbols[Math.floor(Math.random()*symbols.length)]));document.querySelectorAll(".reel").forEach(x=>x.classList.add("spinfx"));if(++t>=18){clearInterval(timer);resolve()}},65)})}async function spin(){if(spinning)return;const id=uid();if(!id){$("result").textContent="Faça login para jogar.";return}if(bet<1||Number(user?.balance||0)<bet){$("result").textContent="Saldo disponível insuficiente.";return}spinning=true;$("spin").disabled=true;$("minus").disabled=true;$("plus").disabled=true;$("result").className="result";$("result").textContent="Girando...";await animate();try{const token=localStorage.getItem("mybets_token");const headers={"Content-Type":"application/json"};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API+"/spin",{method:"POST",headers,body:JSON.stringify({userId:id,betAmount:bet})});const j=await r.json();if(!r.ok)throw Error(j.message||"Não foi possível girar.");save(j.user);const grid=j.spin?.grid||[];draw(grid.map(x=>({id:x.id,label:x.label})));const winning=j.spin?.winningSymbol;if(winning){document.querySelectorAll(`.reel[data-id="${CSS.escape(winning)}"]`).forEach(x=>x.classList.add("win"));$("result").className="result win";$("result").textContent=`🐉 PRÊMIO: R$ ${money(j.spin.prize)} · ${j.spin.multiplier}x`;}else{$("result").textContent="A chama continua. Tente novamente."}update()}catch(e){$("result").textContent=e.message||"Erro ao girar."}finally{spinning=false;$("spin").disabled=false;$("minus").disabled=false;$("plus").disabled=false}}$("minus").onclick=()=>{if(!spinning){bet=Math.max(1,bet-1);update()}};$("plus").onclick=()=>{if(!spinning&&bet+1<=Number(user?.balance||0)){bet++;update()}};$("spin").onclick=spin;initial();load();
</script>
<script src="/brand-standard.js?v=2"></script>
<footer class="mybets-game-footer" aria-label="Navegação do jogo"><a href="/dashboard.html"><span>👤</span><b>Área de jogador</b></a><a href="/"><span>⌂</span><b>Início</b></a></footer></body></html>
