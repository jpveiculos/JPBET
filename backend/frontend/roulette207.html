<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>MyBets — Roleta</title>

<style>

:root{
  --gold:#ffd83d;
  --gold2:#dca51d;
  --muted:#9da7b5;
  --line:rgba(255,255,255,.1);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;

  background:
    radial-gradient(
      circle at 50% 18%,
      #18212c 0,
      #070c12 34%,
      #020509 76%
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  padding-bottom:78px;
}

.wrap{
  width:min(720px,100%);
  margin:auto;
  padding:0 12px 30px;
}


/* =========================================================
   TOPO
   ========================================================= */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  padding:10px 0 7px;

  border-bottom:
    1px solid var(--line);

  position:sticky;
  top:0;

  background:
    rgba(2,5,9,.92);

  backdrop-filter:
    blur(10px);

  z-index:10;
}

.brand{
  font-size:25px;
  font-weight:900;
  font-style:italic;
}

.brand b{
  color:var(--gold);
}

.balance{
  background:
    linear-gradient(
      180deg,
      #121b25,
      #080d13
    );

  border:
    1px solid
    rgba(255,216,61,.3);

  border-radius:14px;

  padding:7px 12px;

  min-width:125px;
}

.balance small{
  display:block;
  color:var(--muted);
  font-size:10px;
}

.balance strong{
  display:block;
  color:var(--gold);
  font-size:17px;
  margin-top:2px;
}


/* =========================================================
   ROLETA
   ========================================================= */

.game{
  margin-top:4px;
}

.wheel-box{
  position:relative;

  width:
    min(
      calc(100vw - 24px),
      540px
    );

  aspect-ratio:1;

  margin:0 auto;
}


/* =========================================================
   PONTEIRO
   ========================================================= */

.pointer{
  position:absolute;

  z-index:10;

  top:0;
  left:50%;

  transform:
    translateX(-50%);

  width:0;
  height:0;

  border-left:
    15px solid transparent;

  border-right:
    15px solid transparent;

  border-top:
    30px solid #f5c32b;

  filter:
    drop-shadow(
      0 3px 4px #000
    );
}

.pointer:after{
  content:"";

  position:absolute;

  left:-6px;
  top:-25px;

  border-left:
    6px solid transparent;

  border-right:
    6px solid transparent;

  border-top:
    14px solid #e94b36;
}


/* =========================================================
   CORPO DA ROLETA
   ========================================================= */

.wheel{

  position:absolute;

  inset:4%;

  border-radius:50%;

  border:
    10px solid #b97b11;

  box-shadow:

    0 0 0 4px #4d3309,

    0 0 28px
    rgba(255,216,61,.2),

    inset 0 0 25px #000;

  background:#080b0e;

  /*
   * IMPORTANTE:
   *
   * O primeiro setor amarelo possui
   * seu centro em 10 graus.
   *
   * O ponteiro está em 0 graus.
   *
   * Por isso a roda começa em -10 graus.
   */

  transform:
    rotate(-10deg);

  overflow:hidden;

  transition:
    transform
    4s
    cubic-bezier(.12,.72,.12,1);

  will-change:
    transform;
}

.wheel svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}

#wheelSvg{
  background:#080b0e;
}

#wheelSvg path{
  vector-effect:
    non-scaling-stroke;
}

#wheelSvg text{
  pointer-events:none;
  user-select:none;
}


/* =========================================================
   CENTRO
   ========================================================= */

.hub{

  position:absolute;

  z-index:12;

  left:50%;
  top:50%;

  transform:
    translate(
      -50%,
      -50%
    );

  width:31%;

  aspect-ratio:1;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  background:
    radial-gradient(
      circle,
      #1a222a 0,
      #070a0e 70%
    );

  border:
    5px solid #dca51d;

  box-shadow:

    0 0 0 3px #4b330b,

    0 10px 22px #000;

  cursor:pointer;
}

.hub strong{
  font-size:15px;
}

.hub b{
  font-size:22px;
  color:var(--gold);
  margin-top:3px;
}


/* =========================================================
   CONTROLES
   ========================================================= */

.controls{

  width:
    min(
      calc(100vw - 24px),
      540px
    );

  margin:0 auto;
}

.bet-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  margin-top:4px;

  padding:
    10px 12px;

  border-radius:14px;

  background:#090f16;

  border:
    1px solid
    var(--line);
}

.bet-row span{
  color:var(--muted);
  font-size:12px;
}

.bet-controls{

  display:flex;

  align-items:center;

  gap:7px;
}

.bet-controls button{

  width:38px;
  height:38px;

  border:
    1px solid
    rgba(255,216,61,.35);

  border-radius:10px;

  background:#121a23;

  color:var(--gold);

  font-size:22px;

  font-weight:900;
}

.bet-controls input{

  width:105px;
  height:38px;

  border:
    1px solid
    rgba(255,216,61,.35);

  border-radius:10px;

  background:#05090d;

  color:#fff;

  text-align:center;

  font-size:17px;

  font-weight:900;

  outline:none;
}

.spin{

  width:100%;

  height:56px;

  margin-top:10px;

  border:0;

  border-radius:15px;

  background:
    linear-gradient(
      180deg,
      #ffe77a,
      #dfa719
    );

  color:#07090d;

  font-weight:1000;

  font-size:17px;

  box-shadow:
    0 8px 18px
    rgba(0,0,0,.35);
}

.spin:disabled{
  opacity:.55;
}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

.nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:64px;

  background:
    rgba(4,8,13,.96);

  border-top:
    1px solid
    var(--line);

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  z-index:20;
}

.nav button{

  border:0;

  background:transparent;

  color:#8c96a4;

  font-weight:800;

  font-size:10px;
}

.nav button span{

  display:block;

  font-size:20px;

  margin-bottom:2px;
}

.nav .active{
  color:var(--gold);
}

</style>

</head>


<body>

<div class="wrap">

<header class="top">

  <div class="brand">
    My<b>Bets</b>
  </div>

  <div class="balance">

    <small>
      Saldo
    </small>

    <strong id="balance">
      R$ 0,00
    </strong>

  </div>

</header>


<main class="game">


<div class="wheel-box">

  <div class="pointer"></div>


  <div
    class="wheel"
    id="wheel"
  >

    <svg
      id="wheelSvg"
      viewBox="0 0 400 400"
      preserveAspectRatio="xMidYMid meet"
      aria-label="Roleta"
    ></svg>

  </div>


  <div
    class="hub"
    onclick="spin()"
  >

    <strong>
      MyBets
    </strong>

    <b>
      GIRAR
    </b>

  </div>

</div>


<div class="controls">


<div class="bet-row">

  <span>
    Valor da aposta
  </span>

  <div class="bet-controls">

    <button
      type="button"
      onclick="changeBet(-0.50)"
    >
      −
    </button>

      id="betAmount"
      type="number"
      min="0.50"
      step="0.50"
      value="0.50"
      inputmode="decimal"

    >


    <button
      type="button"
      onclick="changeBet(0.50)"
    >
      +
    </button>

  </div>

</div>


<button
  class="spin"
  id="spinButton"
  onclick="spin()"
>
  ↻ GIRAR
</button>


</div>

</main>

</div>


<nav class="nav">

<button
  onclick="
    location.href='/dashboard.html'
  "
>

  <span>
    ⌂
  </span>

  Início

</button>


<button
  onclick="
    location.href='/dashboard.html'
  "
>

  <span>
    ◉
  </span>

  Área do jogador

</button>


<button class="active">

  <span>
    ◎
  </span>

  Roleta

</button>

</nav>


<script>

/* =========================================================
   CONFIGURAÇÃO DA ROLETA
   ========================================================= */

/*
 * 90 setores lógicos.
 */

const TOTAL =
  90;


/*
 * Aposta mínima.
 */

const DEFAULT_MIN_BET =
  0.50;


/*
 * 9 prêmios.
 */

const DEFAULT_PRIZES = [
  2,
  3,
  4,
  5,
  6,
  7,
  8,
  9,
  10
];


/*
 * Setores reais dos prêmios.
 *
 * 0
 * 10
 * 20
 * 30
 * 40
 * 50
 * 60
 * 70
 * 80
 *
 * Cada prêmio é separado por
 * 9 setores de perda.
 */

const PRIZE_INDEXES = [
  0,
  10,
  20,
  30,
  40,
  50,
  60,
  70,
  80
];


let MIN_BET =
  DEFAULT_MIN_BET;


let PRIZES =
  [
    ...DEFAULT_PRIZES
  ];


let user =
  null;


let spinning =
  false;


/*
 * A posição visual inicial.
 *
 * O centro da primeira fatia amarela
 * está em 10 graus.
 *
 * A roda começa em -10 graus,
 * portanto o centro da primeira fatia
 * fica exatamente no ponteiro.
 */

let rotation =
  -10;


let configLoaded =
  false;


/* =========================================================
   HELPERS
   ========================================================= */

const $ =
  id =>
    document.getElementById(id);


const money =
  v =>
    Number(
      v || 0
    ).toLocaleString(
      'pt-BR',
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );


/* =========================================================
   USUÁRIO
   ========================================================= */

function getUser(){

  try{

    user =
      JSON.parse(
        localStorage.getItem(
          'jpbet_user'
        ) || 'null'
      );

  }catch(e){

    user =
      null;

  }


  if(
    !user?.id
  ){

    location.href =
      '/';

    return false;

  }


  renderUser(
    user
  );

  return true;

}


function renderUser(u){

  user =
    {
      ...user,
      ...u
    };


  $('balance')
    .textContent =
      'R$ ' +
      money(
        user.balance
      );


  localStorage.setItem(
    'jpbet_user',
    JSON.stringify(user)
  );

}


/* =========================================================
   APOSTA
   ========================================================= */

function getBet(){

  const input =
    $('betAmount');


  if(!input){

    return MIN_BET;

  }


  let v =
    Number(
      String(
        input.value
      )
      .replace(
        ',',
        '.'
      )
    );


  if(
    !Number.isFinite(v)
  ){

    return MIN_BET;

  }


  return Number(
    v.toFixed(2)
  );

}


function normalizeBet(){

  const input =
    $('betAmount');


  if(!input){

    return;

  }


  let v =
    getBet();


  if(
    !Number.isFinite(v)
  ){

    v =
      MIN_BET;

  }


  v =
    Math.max(
      MIN_BET,
      v
    );


  input.min =
    MIN_BET.toFixed(2);


  input.value =
    v.toFixed(2);

}


function changeBet(delta){

  const current =
    getBet();


  const next =
    Math.max(
      MIN_BET,

      Number(
        (
          current +
          delta
        ).toFixed(2)
      )
    );


  $('betAmount').value =
    next.toFixed(2);

}


/* =========================================================
   GEOMETRIA
   ========================================================= */

function polar(
  cx,
  cy,
  r,
  a
){

  const rad =
    (
      a - 90
    ) *
    Math.PI /
    180;


  return [

    cx +
      r *
      Math.cos(rad),

    cy +
      r *
      Math.sin(rad)

  ];

}


function wedge(
  cx,
  cy,
  r,
  a0,
  a1
){

  const p0 =
    polar(
      cx,
      cy,
      r,
      a0
    );


  const p1 =
    polar(
      cx,
      cy,
      r,
      a1
    );


  const large =
    (
      a1 -
      a0
    ) > 180
      ? 1
      : 0;


  return `
    M ${cx} ${cy}
    L ${p0[0]} ${p0[1]}
    A ${r} ${r}
      0 ${large} 1
      ${p1[0]} ${p1[1]}
    Z
  `;

}


/* =========================================================
   DESENHO VISUAL
   ========================================================= */

/*
 * A roleta possui:
 *
 * 18 FATIAS VISUAIS
 *
 * 9 amarelas
 * 9 pretas
 *
 * Todas exatamente do mesmo tamanho.
 *
 * Cada fatia visual:
 *
 * 360 / 18 = 20 graus
 *
 *
 * AMARELA:
 * representa 1 setor lógico de prêmio.
 *
 *
 * PRETA:
 * representa 9 setores lógicos de perda.
 *
 *
 * Portanto:
 *
 * 9 amarelas = 9 setores de prêmio
 *
 * 9 pretas × 9 perdas = 81 perdas
 *
 * Total:
 *
 * 9 + 81 = 90
 */

function drawWheel(){

  const svg =
    $('wheelSvg');


  if(!svg){

    return;

  }


  svg.innerHTML =
    '';


  const ns =
    'http://www.w3.org/2000/svg';


  const VISUAL_SLICES =
    18;


  const visualAngle =
    360 /
    VISUAL_SLICES;


  const radius =
    186;


  /* =======================================================
     FUNDO
     ======================================================= */

  const background =
    document.createElementNS(
      ns,
      'circle'
    );


  background.setAttribute(
    'cx',
    '200'
  );

  background.setAttribute(
    'cy',
    '200'
  );

  background.setAttribute(
    'r',
    radius
  );

  background.setAttribute(
    'fill',
    '#080a0d'
  );


  svg.appendChild(
    background
  );


  /* =======================================================
     18 FATIAS
     ======================================================= */

  for(
    let visual = 0;
    visual < VISUAL_SLICES;
    visual++
  ){

    const start =
      visual *
      visualAngle;


    const end =
      start +
      visualAngle;


    const path =
      document.createElementNS(
        ns,
        'path'
      );


    path.setAttribute(
      'd',
      wedge(
        200,
        200,
        radius,
        start,
        end
      )
    );


    /*
     * Fatias pares:
     *
     * AMARELAS
     *
     * 0,2,4,6,8,10,12,14,16
     */

    const isPrize =
      visual % 2 === 0;


    if(isPrize){

      path.setAttribute(
        'fill',
        '#d6a51e'
      );

      path.setAttribute(
        'stroke',
        '#ffe36a'
      );

      path.setAttribute(
        'stroke-width',
        '3'
      );

    }


    /*
     * Fatias ímpares:
     *
     * PRETAS
     *
     * 1,3,5,7,9,11,13,15,17
     */

    else{

      path.setAttribute(
        'fill',
        '#080a0d'
      );

      path.setAttribute(
        'stroke',
        '#5e4510'
      );

      path.setAttribute(
        'stroke-width',
        '2'
      );

    }


    svg.appendChild(
      path
    );


    /* =====================================================
       TEXTO DOS PRÊMIOS
       ===================================================== */

    if(isPrize){

      /*
       * Cada fatia amarela corresponde
       * a um dos 9 prêmios.
       *
       * visual 0 → 2x
       * visual 2 → 3x
       * visual 4 → 4x
       * ...
       * visual 16 → 10x
       */

      const prizePosition =
        visual / 2;


      const center =
        start +
        visualAngle / 2;


      /*
       * Texto mais próximo da borda.
       */

      const [
        x,
        y
      ] =
        polar(
          200,
          200,
          145,
          center
        );


      const text =
        document.createElementNS(
          ns,
          'text'
        );


      text.setAttribute(
        'x',
        x
      );

      text.setAttribute(
        'y',
        y
      );

      text.setAttribute(
        'fill',
        '#ffffff'
      );

      text.setAttribute(
        'font-size',
        '14'
      );

      text.setAttribute(
        'font-family',
        'Arial, Helvetica, sans-serif'
      );

      text.setAttribute(
        'font-weight',
        '900'
      );

      text.setAttribute(
        'text-anchor',
        'middle'
      );

      text.setAttribute(
        'dominant-baseline',
        'middle'
      );

      text.setAttribute(
        'paint-order',
        'stroke'
      );

      text.setAttribute(
        'stroke',
        '#000000'
      );

      text.setAttribute(
        'stroke-width',
        '3'
      );


      text.textContent =
        PRIZES[
          prizePosition
        ] +
        'x';


      svg.appendChild(
        text
      );

    }

  }


  /* =======================================================
     ANEL INTERNO
     ======================================================= */

  const innerRing =
    document.createElementNS(
      ns,
      'circle'
    );


  innerRing.setAttribute(
    'cx',
    '200'
  );

  innerRing.setAttribute(
    'cy',
    '200'
  );

  innerRing.setAttribute(
    'r',
    '187'
  );

  innerRing.setAttribute(
    'fill',
    'none'
  );

  innerRing.setAttribute(
    'stroke',
    '#f3c33b'
  );

  innerRing.setAttribute(
    'stroke-width',
    '3'
  );


  svg.appendChild(
    innerRing
  );

}


/* =========================================================
   CONFIGURAÇÃO DO SERVIDOR
   ========================================================= */

async function loadConfig(){

  try{

    const r =
      await fetch(
        '/api/roulette207/config',
        {
          cache:
            'no-store'
        }
      );


    if(!r.ok){

      throw new Error(
        'Configuração indisponível.'
      );

    }


    const d =
      await r.json();


    if(
      !d.ok ||
      !d.roulette
    ){

      throw new Error(
        'Configuração inválida.'
      );

    }


    /* -----------------------------------------------------
       MÍNIMO
       ----------------------------------------------------- */

    const serverMin =
      Number(
        d.roulette.minBet
      );


    if(
      Number.isFinite(
        serverMin
      ) &&
      serverMin >=
        DEFAULT_MIN_BET
    ){

      MIN_BET =
        Number(
          serverMin.toFixed(2)
        );

    }else{

      MIN_BET =
        DEFAULT_MIN_BET;

    }


    /* -----------------------------------------------------
       PRÊMIOS
       ----------------------------------------------------- */

    if(
      Array.isArray(
        d.roulette.prizes
      ) &&
      d.roulette.prizes.length === 9
    ){

      const loaded =
        d.roulette.prizes
          .map(
            x =>
              Number(
                x.multiplier
              )
          );


      if(
        loaded.every(
          x =>
            Number.isFinite(x) &&
            x > 0
        )
      ){

        PRIZES =
          loaded;

      }

    }


    $('betAmount').min =
      MIN_BET.toFixed(2);


    normalizeBet();


    drawWheel();


    configLoaded =
      true;


  }catch(e){

    console.error(
      'Configuração da Roleta:',
      e
    );


    /*
     * Mesmo se o servidor demorar,
     * a roleta visual continua aparecendo.
     */

    MIN_BET =
      DEFAULT_MIN_BET;


    PRIZES =
      [
        ...DEFAULT_PRIZES
      ];


    $('betAmount').min =
      MIN_BET.toFixed(2);


    normalizeBet();


    drawWheel();


    configLoaded =
      true;

  }

}


/* =========================================================
   ATUALIZA SALDO
   ========================================================= */

function refresh(){

  try{

    fetch(
      '/api/account/' +
      encodeURIComponent(
        user.id
      ),
      {
        cache:
          'no-store'
      }
    )
    .then(
      async x => {

        if(x.ok){

          const d =
            await x.json();


          renderUser(
            d.user ||
            d
          );

        }

      }
    );

  }catch(e){}

}


/* =========================================================
   SETOR LÓGICO → POSIÇÃO VISUAL
   ========================================================= */

/*
 * IMPORTANTE:
 *
 * O backend continua trabalhando
 * com 90 setores.
 *
 * Visualmente temos 18 fatias.
 *
 * Para cada grupo:
 *
 * setor de prêmio:
 * 0, 10, 20, 30...
 *
 * vai para a fatia amarela.
 *
 * Os setores de perda daquele grupo:
 *
 * 1-9
 * 11-19
 * 21-29
 * ...
 *
 * ficam dentro da fatia preta.
 */

function visualTargetForSector(
  sector
){

  /*
   * Segurança.
   */

  if(
    !Number.isInteger(
      sector
    ) ||
    sector < 0 ||
    sector >= TOTAL
  ){

    return 10;

  }


  /*
   * Grupo de 10 setores.
   *
   * 0-9
   * 10-19
   * 20-29
   * ...
   */

  const group =
    Math.floor(
      sector / 10
    );


  /*
   * Cada grupo ocupa:
   *
   * 20° amarelo
   * +
   * 20° preto
   *
   * = 40°
   */


  /*
   * Se for prêmio:
   *
   * posição central da fatia amarela.
   */

  if(
    sector % 10 === 0
  ){

    return (
      group *
      40 +
      10
    );

  }


  /*
   * Se for perda:
   *
   * centro da fatia preta.
   *
   * Os 9 setores lógicos de perda
   * compartilham visualmente essa fatia.
   */

  return (
    group *
    40 +
    30
  );

}


/* =========================================================
   GIRAR
   ========================================================= */

async function spin(){

  if(
    spinning ||
    !configLoaded
  ){

    return;

  }


  normalizeBet();


  const bet =
    getBet();


  if(
    !Number.isFinite(bet) ||
    bet < MIN_BET
  ){

    normalizeBet();

    return;

  }


  spinning =
    true;


  $('spinButton').disabled =
    true;


  try{

    /*
     * Solicita o resultado ao servidor.
     *
     * O servidor é quem decide
     * qual dos 90 setores saiu.
     */

    const r =
      await fetch(
        '/api/roulette207/spin',
        {

          method:
            'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              userId:
                user.id,

              betAmount:
                bet

            })

        }
      );


    const d =
      await r.json();


    if(
      !r.ok ||
      !d.ok
    ){

      throw new Error(
        d.message ||
        'Não foi possível girar.'
      );

    }


    /*
     * Resultado oficial.
     */

    const sector =
      Number(
        d.spin.sector
      );


    /*
     * Segurança.
     */

    if(
      !Number.isInteger(
        sector
      ) ||
      sector < 0 ||
      sector >= TOTAL
    ){

      throw new Error(
        'Setor recebido inválido.'
      );

    }


    /*
     * Encontra a posição visual
     * correspondente.
     */

    const target =
      visualTargetForSector(
        sector
      );


    /*
     * Posição atual da roda.
     */

    const current =
      rotation %
      360;


    /*
     * Calcula quanto precisa girar
     * para colocar a fatia correspondente
     * no ponteiro.
     */

    const delta =
      (
        360 -
        target -
        current +
        360
      ) % 360;


    /*
     * Cinco voltas completas.
     */

    rotation +=
      360 * 5 +
      delta;


    $('wheel').style.transform =
      `rotate(${rotation}deg)`;


    /*
     * Aguarda a animação.
     */

    setTimeout(
      () => {

        renderUser(
          d.user
        );


        spinning =
          false;


        $('spinButton').disabled =
          false;

      },
      4100
    );


  }catch(e){

    console.error(
      'Erro ao girar Roleta:',
      e
    );


    spinning =
      false;


    $('spinButton').disabled =
      false;

  }

}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

if(
  getUser()
){

  /*
   * Desenha imediatamente.
   *
   * Assim a roda não fica preta
   * enquanto espera a API.
   */

  drawWheel();


  /*
   * Carrega as configurações.
   */

  loadConfig();


  /*
   * Atualiza o saldo.
   */

  refresh();

}

</script>
