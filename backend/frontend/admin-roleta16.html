<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Bets — Roleta</title><style>body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif;padding:18px}main{max-width:760px;margin:auto}h1{margin:0 0 6px}.muted{color:#aeb4c0;margin-bottom:18px}.grid{display:grid;gap:10px}.row{display:grid;grid-template-columns:42px 1fr 110px 105px;gap:8px;align-items:center;background:#151922;padding:10px;border-radius:12px}.row input,.row select{width:100%;box-sizing:border-box;background:#0d1017;color:#fff;border:1px solid #343a48;border-radius:8px;padding:10px;font-size:16px}.save{margin-top:16px;width:100%;padding:14px;border:0;border-radius:12px;background:#f4c542;color:#111;font-weight:800;font-size:16px}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#151922}.head{display:grid;grid-template-columns:42px 1fr 110px 105px;gap:8px;color:#8f96a3;font-size:12px;padding:0 10px}@media(max-width:560px){.row,.head{grid-template-columns:32px 1fr 86px 78px}.row input,.row select{padding:9px 6px}.row{padding:8px}.head{padding:0 8px}}</style></head><body><main><h1>My Bets — Roleta</h1><div class="muted">16 fatias. O multiplicador é editável diretamente pelo celular.</div><div class="head"><span>#</span><span>Tipo</span><span>Multiplicador</span><span>Prob. %</span></div><div id="editor" class="grid"></div><button id="save" class="save">SALVAR ROLETA</button><div id="msg" class="msg">Carregando...</div></main><script>
const API='/api';
const defaults=[['2x','prize',2,5],['❌','zero',0,5],['❌','zero',0,5],['❌','zero',0,5],['❌','zero',0,6],['3x','prize',3,4],['❌','zero',0,5],['❌','zero',0,5],['❌','zero',0,5],['❌','zero',0,6],['2x','prize',2,3],['❌','zero',0,6],['❌','zero',0,5],['❌','zero',0,5],['❌','zero',0,6],['5x','prize',5,2]];
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function render(items){document.querySelector('#editor').innerHTML=items.map((x,i)=>`<div class="row" data-i="${i}"><span>${i+1}</span><select class="type"><option value="zero" ${x[1]==='zero'?'selected':''}>Perda</option><option value="sorte" ${x[1]==='sorte'?'selected':''}>Giro grátis</option><option value="prize" ${x[1]==='prize'?'selected':''}>Prêmio</option></select><input class="mult" inputmode="numeric" type="number" min="0" max="100" step="1" value="${esc(x[2])}"><input class="prob" inputmode="decimal" type="number" min="0" step="0.01" value="${esc(x[3])}"></div>`).join('');document.querySelectorAll('.row').forEach(r=>{const t=r.querySelector('.type'),m=r.querySelector('.mult');t.addEventListener('change',()=>{if(t.value!=='prize')m.value=0;else if(Number(m.value)<2)m.value=2})})}
async function load(){try{const r=await fetch(API+'/settings',{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(d.message||'Acesso administrativo necessário.');let v=d.settings?.find(x=>x.setting_key==='roulette_segments_json')?.setting_value;let a=[];try{a=JSON.parse(v||'[]')}catch{};if(!Array.isArray(a)||a.length<16)a=defaults;else a=a.slice(0,16).map(x=>[x.label||'❌',x.type||'zero',Number(x.multiplier)||0,Number(x.probability)||0]);render(a);msg('Pronto para editar.')}catch(e){msg(e.message,true)}}
function msg(t,err=false){const m=document.querySelector('#msg');m.textContent=t;m.style.color=err?'#ff8f8f':'#fff'}
document.querySelector('#save').onclick=async()=>{const rows=[...document.querySelectorAll('.row')];const a=rows.map(r=>({label:r.querySelector('.type').value==='prize'?`${Math.max(2,Number(r.querySelector('.mult').value)||2)}x`:(r.querySelector('.type').value==='sorte'?'🍀':'❌'),type:r.querySelector('.type').value,multiplier:r.querySelector('.type').value==='prize'?Math.max(2,Math.min(100,Math.round(Number(r.querySelector('.mult').value)||2))):0,probability:Math.max(0,Number(r.querySelector('.prob').value)||0)}));if(a.length!==16)return msg('A roleta precisa ter 16 fatias.',true);if(a.reduce((s,x)=>s+x.probability,0)<=0)return msg('A soma das probabilidades deve ser maior que zero.',true);const internal=a.concat([0,0,0,0].map(()=>({label:'',type:'zero',multiplier:0,probability:0})));try{const r=await fetch(`${API}/settings/roulette_segments_json`,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({value:JSON.stringify(internal)})});const d=await r.json();if(!r.ok)throw Error(d.message||'Erro ao salvar.');msg('Roleta salva com 16 fatias.')}catch(e){msg(e.message,true)}};load();
</script></body></html>
