<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Gems — MyBets</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18385c,#080b13 60%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:900}.brand b{color:#f6bd24}.back{color:#fff;text-decoration:none;font-size:13px}.card{background:rgba(15,22,36,.94);border:1px solid #365b82;border-radius:22px;padding:18px;box-shadow:0 15px 45px #0008}.title{text-align:center;font-size:28px;font-weight:900;margin:4px 0}.sub{text-align:center;color:#9fc2df;margin-bottom:14px}.balance{display:flex;justify-content:space-between;background:#0b1320;border-radius:14px;padding:12px;margin-bottom:14px}.balance strong{color:#5ee7ff}.machine{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;background:#07101b;padding:10px;border-radius:17px;border:2px solid #2d7196}.cell{aspect-ratio:1;background:linear-gradient(145deg,#102b42,#07131e);border-radius:11px;display:grid;place-items:center;font-size:31px}.cell.win{animation:pulse .35s infinite alternate}@keyframes pulse{to{transform:scale(1.06);box-shadow:0 0 20px #5ee7ff}}.betrow{display:flex;gap:8px;align-items:center;margin:15px 0}.betrow input{flex:1;padding:13px;border-radius:12px;border:1px solid #41637d;background:#09131f;color:#fff;font-size:18px}.spin{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#21b7e6,#6ee7ff);font-weight:900;font-size:18px;color:#03101a}.status{text-align:center;min-height:25px;margin:13px 0;color:#b9d7ec}.pay{font-size:13px;color:#a9c5d9;line-height:1.8}.pay b{color:#fff}.note{text-align:center;font-size:11px;color:#718ca2;margin-top:14px}</style></head><body><main class="wrap"><div class="top"><div class="brand"><span>My</span> <b>Gems</b></div><a class="back" href="/dashboard.html">← Voltar</a></div><section class="card"><div class="title">💎 MY GEMS</div><div class="sub">Slot demonstrativo de créditos virtuais</div><div class="balance"><span>Saldo demonstrativo</span><strong id="balance">1.000</strong></div><div id="machine" class="machine"></div><div class="betrow"><label for="bet">Aposta</label><input id="bet" type="number" min="1" step="1" value="10"></div><button id="spin" class="spin">GIRAR</button><div id="status" class="status">Escolha o valor e gire.</div><div class="pay"><b>Tabela demonstrativa</b><br>💎💎💎 = 80 créditos<br>🔷🔷🔷 = 45 créditos<br>👑👑👑 = 30 créditos<br>🍀🍀🍀 = 20 créditos<br>⭐️⭐️⭐️ = 12 créditos</div><div class="note">Modo independente: não usa saldo nem API de produção.</div></section></main><script>const symbols=['💎','🔷','👑','🍀','⭐️','🪙','🔔','7️⃣'];const pay={'💎':80,'🔷':45,'👑':30,'🍀':20,'⭐️':12};let bal=1000;const machine=document.getElementById('machine');for(let i=0;i<15;i++){const d=document.createElement('div');d.className='cell';d.textContent=symbols[Math.floor(Math.random()*symbols.length)];machine.appendChild(d)}const cells=[...document.querySelectorAll('.cell')];function render(){cells.forEach(c=>c.textContent=symbols[Math.floor(Math.random()*symbols.length)])}document.getElementById('spin').onclick=()=>{const bet=Math.max(1,Number(document.getElementById('bet').value)||0);if(bet>bal){document.getElementById('status').textContent='Saldo demonstrativo insuficiente.';return}bal-=bet;document.getElementById('balance').textContent=bal.toLocaleString('pt-BR');let n=0;const timer=setInterval(()=>{render();if(++n>=12){clearInterval(timer);const row=cells.slice(10,15);const s=row.map(x=>x.textContent);let prize=0;if(s.every(x=>x===s[0]))prize=pay[s[0]]||0;if(prize){bal+=prize;row.forEach(x=>x.classList.add('win'));setTimeout(()=>row.forEach(x=>x.classList.remove('win')),900)}document.getElementById('balance').textContent=bal.toLocaleString('pt-BR');document.getElementById('status').textContent=prize?'Resultado demonstrativo: +'+prize+' créditos.':'Resultado demonstrativo: sem prêmio.'}},70)};</script></body></html>
