<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Royal — MyBets</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#3b2b0c,#11100b 55%,#060606);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{position:relative;padding-bottom:7px;font-size:25px;font-weight:900;color:#f6bd24}.brand b{color:#fff}.brand:after{content:"";position:absolute;left:1px;right:-2px;bottom:0;height:4px;background:#f6bd24;border-radius:70%;transform:skewX(-18deg) rotate(-2deg)}.back{color:#fff;text-decoration:none;font-size:13px}.card{margin-top:18px;padding:18px;border-radius:22px;background:#16140d;border:1px solid #a8842e;box-shadow:0 18px 60px #000}.title{text-align:center;font-size:30px;font-weight:900}.sub{text-align:center;color:#d7c68b;margin:5px 0 16px}.balance{display:flex;justify-content:space-between;padding:12px;background:#211d0e;border-radius:13px}.balance strong{color:#ffd84e}.machine{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;margin-top:14px;background:#090909;border:2px solid #c49b32;border-radius:17px}.cell{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,#2b2410,#111006);border-radius:11px;font-size:34px}.cell.win{animation:shine .3s infinite alternate}@keyframes shine{to{transform:scale(1.07);box-shadow:0 0 24px #ffd84e}}.bet{display:flex;align-items:center;gap:10px;margin:15px 0}.bet input{flex:1;padding:13px;border-radius:12px;border:1px solid #806b2b;background:#0b0b08;color:#fff;font-size:18px}.spin{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#b88a22,#ffe071);font-size:18px;font-weight:900;color:#201600}.status{text-align:center;min-height:25px;margin:13px 0;color:#f5dda0}.pay{font-size:13px;line-height:1.9;color:#c9bd91}.pay b{color:#fff}.note{text-align:center;font-size:11px;color:#81785c;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><div class="brand">My<b>Bets</b></div><a class="back" href="/dashboard.html">← Voltar</a></div><section class="card"><div class="title">👑 MY ROYAL</div><div class="sub">Slot demonstrativo de créditos virtuais</div><div class="balance"><span>Saldo demonstrativo</span><strong id="balance">1.000</strong></div><div id="machine" class="machine"></div><div class="bet"><label>Aposta</label><input id="bet" type="number" min="1" step="1" value="20"></div><button id="spin" class="spin">👑 GIRAR</button><div id="status" class="status">Escolha a aposta e gire.</div><div class="pay"><b>Tabela demonstrativa</b><br>👑👑👑👑 = 100 créditos<br>💎💎💎💎 = 70 créditos<br>🏆🏆🏆🏆 = 50 créditos<br>7️⃣7️⃣7️⃣7️⃣ = 35 créditos<br>⭐️⭐️⭐️⭐️ = 18 créditos</div><div class="note">Modo independente: não usa saldo nem API de produção.</div></section></main><script>const symbols=['👑','💎','🏆','7️⃣','⭐️','💰','🔔','🍒'];const pay={'👑':100,'💎':70,'🏆':50,'7️⃣':35,'⭐️':18};let bal=1000;const machine=document.getElementById('machine');for(let i=0;i<12;i++){const d=document.createElement('div');d.className='cell';d.textContent=symbols[Math.floor(Math.random()*symbols.length)];machine.appendChild(d)}const cells=[...document.querySelectorAll('.cell')];function render(){cells.forEach(c=>c.textContent=symbols[Math.floor(Math.random()*symbols.length)])}document.getElementById('spin').onclick=()=>{const bet=Math.max(1,Number(document.getElementById('bet').value)||0);if(bet>bal){document.getElementById('status').textContent='Saldo demonstrativo insuficiente.';return}bal-=bet;document.getElementById('balance').textContent=bal.toLocaleString('pt-BR');let n=0;const timer=setInterval(()=>{render();if(++n>=12){clearInterval(timer);let prize=0;for(let r=0;r<3;r++){const row=cells.slice(r*4,r*4+4);if(row.every(x=>x.textContent===row[0].textContent)){prize=Math.max(prize,pay[row[0].textContent]||0);row.forEach(x=>x.classList.add('win'));setTimeout(()=>row.forEach(x=>x.classList.remove('win')),850)}}if(prize)bal+=prize;document.getElementById('balance').textContent=bal.toLocaleString('pt-BR');document.getElementById('status').textContent=prize?'Resultado demonstrativo: +'+prize+' créditos.':'Resultado demonstrativo: sem prêmio.'}},70)};</script></body></html>
