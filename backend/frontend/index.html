<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="description" content="MyBets — Roleta MyBets e área do jogador.">
<title>MyBets | Roleta MyBets</title>

<link rel="stylesheet" href="style.css">

<style>
:root{--gold:#f5c542;--gold2:#ffcf3f;--bg:#050505;--muted:#a9a9a9}
html,body{margin:0;background:var(--bg);color:#fff;overflow-x:hidden}
.topbar{position:relative;z-index:20;min-height:68px;padding:9px clamp(16px,5vw,70px);display:flex;align-items:center;justify-content:space-between;gap:20px;background:rgba(5,5,5,.97);border-bottom:1px solid rgba(245,197,66,.25)}
.brand-main{position:relative;display:inline-block;padding-bottom:6px;font-size:22px;font-weight:950;letter-spacing:-1.2px;color:#fff}
.brand-main:after{content:"";position:absolute;left:2px;right:-3px;bottom:0;height:6px;border-bottom:3px solid var(--gold);border-radius:0 0 70% 55%;transform:skewX(-18deg) rotate(-2deg);filter:drop-shadow(0 0 3px rgba(245,197,66,.35));pointer-events:none}
.brand-main span{color:var(--gold)}
.main-nav{gap:26px}.main-nav a{font-size:12px}.login-button{min-height:44px;padding:0 19px;border-radius:11px}
.hero{position:relative;height:430px;min-height:430px;overflow:hidden;border-bottom:1px solid var(--gold);background:#080808}
.hero-visual{position:absolute;inset:0;background-image:url("assets/jpbet-hero-luxo-clean.PNG");background-repeat:no-repeat;background-size:cover;background-position:center;filter:saturate(1.08) contrast(1.04) brightness(1.05)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.16))}.hero-content{display:none!important}
.home-main{width:min(1180px,92vw);margin:0 auto;padding:28px 0 58px}.roulette-list{display:grid;grid-template-columns:minmax(0,520px);justify-content:center;gap:16px;margin:0 auto}
.roulette-card{position:relative;min-height:270px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;border:1px solid rgba(245,197,66,.30);border-radius:20px;background:linear-gradient(145deg,#111923,#070c12);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.roulette-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(245,197,66,.18),transparent 48%);pointer-events:none}.roulette-art{position:relative;z-index:2;width:96px;height:96px;margin:0 auto 16px;border-radius:50%;border:6px solid #d89d1b;background:repeating-conic-gradient(#151515 0 18deg,#8f1414 18deg 36deg);box-shadow:0 0 0 2px #4c3309,0 0 24px rgba(245,197,66,.28);display:flex;align-items:center;justify-content:center;flex-shrink:0}.roulette-art:before{content:"";width:40px;height:40px;border-radius:50%;border:3px solid #d89d1b;background:#090909;box-shadow:inset 0 0 0 6px #181818}.roulette-art:after{content:"MyBets";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:900;font-style:italic;color:#fff;white-space:nowrap}.roulette-content{position:relative;z-index:3;width:100%;padding:0;text-align:center}.roulette-icon{display:none}.roulette-card h3{margin:0;font-size:30px;letter-spacing:-.9px;font-weight:950;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}.roulette-card .title-my{color:var(--gold);text-shadow:0 0 8px rgba(245,197,66,.18)}.roulette-card p,.roulette-card .max-prize,.roulette-card .status{display:none}.roulette-card button{position:relative;z-index:3;width:100%;min-height:50px;margin-top:18px;border:0;border-radius:11px;background:linear-gradient(180deg,#ffe47b,#e0a51a);color:#07090d;font-size:13px;font-weight:900;letter-spacing:.5px;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.30)}
footer{margin-top:45px;padding:34px 18px 40px;background:#030303;border-top:1px solid rgba(255,255,255,.08);text-align:center}.footer-brand{position:relative;display:inline-block;padding-bottom:7px;font-weight:950;color:var(--gold)}.footer-brand:after,.modal-brand:after{content:"";position:absolute;left:2px;right:-3px;bottom:0;height:7px;border-bottom:4px solid var(--gold);border-radius:0 0 70% 55%;transform:skewX(-18deg) rotate(-2deg);filter:drop-shadow(0 0 3px rgba(245,197,66,.35));pointer-events:none}.footer-brand span,.modal-brand span{color:#fff}.footer-links{gap:13px;justify-content:center}.footer-links a{font-size:11px}footer p{font-size:10px;color:#777}
@media(max-width:720px){.topbar{min-height:62px;padding:8px 15px}.brand-main{font-size:20px;padding-bottom:5px}.brand-main:after{height:5px;border-bottom-width:3px}.main-nav{display:none}.login-button{min-height:40px;padding:0 14px;font-size:10px}.hero{height:300px;min-height:300px}.hero-visual{background-position:center}.home-main{width:92vw;padding:20px 0 45px}.roulette-list{grid-template-columns:1fr;gap:13px}.roulette-card{min-height:255px;border-radius:18px;padding:18px}.roulette-art{width:84px;height:84px;margin-bottom:13px;border-width:5px}.roulette-art:before{width:32px;height:32px;border-width:3px;box-shadow:inset 0 0 0 5px #181818}.roulette-art:after{font-size:7px}.roulette-card h3{font-size:27px}.roulette-card button{min-height:48px;margin-top:16px;font-size:12px}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#inicio" aria-label="MyBets início"><span class="brand-main">MyBets</span></a>
  <nav class="main-nav" aria-label="Navegação principal"><a href="#inicio" class="active">Início</a><a href="#roletas">Roletas</a><a href="termos-uso.html">Termos</a></nav>
  <button class="login-button" id="homeAccountButton" onclick="abrirLogin()">Minha Conta</button>
</header>
<main><section class="hero" id="inicio"><div class="hero-visual" aria-hidden="true"></div></section><section class="home-main" id="roletas" aria-label="Roleta MyBets"><div class="roulette-list"><article class="roulette-card active"><div class="roulette-art" aria-hidden="true"></div><div class="roulette-content"><h3>Roleta <span class="title-my">My</span>Bets</h3><button type="button" onclick="location.href='/roulette207.html'">JOGAR AGORA</button></div></article></div></section></main>
<div id="loginModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle"><div class="modal-box"><button class="close-button" onclick="fecharLogin()" aria-label="Fechar">×</button><div id="loginForm"><div class="modal-brand">My<span>Bets</span></div><h2 id="loginTitle">Entrar</h2><p>Acesse sua conta MyBets.</p><input type="text" id="username" placeholder="Usuário" autocomplete="username"><input type="password" id="password" placeholder="Senha" autocomplete="current-password"><button class="primary-button" onclick="entrar()">ENTRAR</button><p id="loginMessage" class="login-message"></p><button type="button" class="secondary-button modal-secondary" onclick="mostrarCadastro()">CRIAR CONTA</button></div><div id="registerForm" style="display:none"><div class="modal-brand">My<span>Bets</span></div><h2>Criar conta</h2><p>Crie sua conta MyBets.</p><input type="text" id="registerUsername" placeholder="Escolha um usuário" autocomplete="username"><input type="password" id="registerPassword" placeholder="Crie uma senha" autocomplete="new-password"><input type="password" id="registerPasswordConfirm" placeholder="Confirme sua senha" autocomplete="new-password"><button class="primary-button" onclick="cadastrar()">CRIAR CONTA</button><p id="registerMessage" class="login-message"></p><button type="button" class="secondary-button modal-secondary" onclick="mostrarLogin()">JÁ TENHO UMA CONTA</button></div></div></div>
<footer><div class="footer-brand">My<span>Bets</span></div><div class="footer-links"><a href="#inicio">Início</a><span>•</span><a href="#roletas">Roletas</a><span>•</span><a href="termos-uso.html">Termos de Uso</a></div><p>© 2026 MyBets — Todos os direitos reservados.</p></footer>
<script src="app.js"></script><script src="/brand-standard.js?v=1"></script><script src="/brand-standard.js?v=2"></script>
</body>
</html>
