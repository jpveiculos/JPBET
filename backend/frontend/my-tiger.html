<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Tiger — MyBets</title>
<style>
:root{--bg:#05070b;--panel:#0d131c;--gold:#ffd34d;--gold2:#e8a817;--muted:#9da7b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% 0,#241704 0,#05070b 42%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding-bottom:35px}.wrap{max-width:520px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;height:54px}.brand{font-size:25px;font-weight:900;font-style:italic;letter-spacing:-2px}.brand b{color:var(--gold)}.top-right{display:flex;align-items:center;gap:7px}.balance-box{min-width:112px;padding:6px 10px;border:1px solid rgba(245,197,66,.38);border-radius:13px;background:linear-gradient(180deg,#111923,#080d13);font-size:10px;color:#9da7b5;text-align:left}.balance-box strong{display:block;color:#ffda52;font-size:16px;margin-top:1px}.back{border:1px solid #343b46;background:#111823;color:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.hero{text-align:center;padding:12px 0 10px}.tiger{font-size:72px;filter:drop-shadow(0 0 18px rgba(255,190,35,.35));animation:pulse 2s ease-in-out infinite}.hero h1{margin:2px 0;color:var(--gold);font-size:34px;text-transform:uppercase;letter-spacing:1px}.hero p{margin:4px 0;color:var(--muted);font-size:13px}.machine{background:linear-gradient(145deg,#17100a,#0a0d12);border:2px solid #8e6514;border-radius:24px;padding:13px;box-shadow:0 18px 45px rgba(0,0,0,.55)}.reels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:9px;background:#05070a;border-radius:16px;border:1px solid #47330d}.cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(145deg,#242b34,#0c1118);border:1px solid #4b5360;font-size:37px;box-shadow:inset 0 2px 8px #000}.cell.win{animation:win .7s ease-in-out infinite alternate;border-color:var(--gold);box-shadow:0 0 18px rgba(255,211,77,.4),inset 0 2px 8px #000}.bet-panel{margin-top:12px;padding:10px;background:#090d13;border:1px solid #49360d;border-radius:15px}.bet-label{display:block;text-align:center;color:#9da7b5;font-size:11px;margin-bottom:6px}.bet-input-wrap{display:flex;align-items:center;gap:7px}.bet-input{width:100%;height:45px;border:1px solid #72571a;border-radius:11px;background:#05070b;color:#ffda52;text-align:center;font-size:18px;font-weight:900;outline:none}.bet-input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,211,77,.12)}.ctrl{width:52px;flex:0 0 52px;height:45px;border:1px solid #3a424d;border-radius:11px;background:#111923;color:#fff;font-weight:900;font-size:22px}.controls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;margin-top:10px}.spin{height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffe57a,#dfa313);color:#07090d;font-weight:1000;font-size:16px;box-shadow:0 6px 18px rgba(225,169,25,.25)}.status{text-align:center;min-height:25px;margin-top:11px;color:var(--gold);font-weight:900}.paytable{margin-top:15px;background:#0b1118;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:13px}.paytable h2{font-size:15px;margin:0 0 9px;color:var(--gold)}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}.row:last-child{border:0}.note{text-align:center;color:#727d8c;font-size:11px;margin-top:13px}@keyframes pulse{50%{transform:scale(1.04)}}@keyframes win{to{transform:translateY(-2px) scale(1.04)}}@media(max-width:430px){.balance-box{min-width:98px}.back{padding:10px 10px}.cell{font-size:31px}.tiger{font-size:62px}}@media(max-width:360px){.balance-box{display:none}.cell{font-size:27px}}
</style></head>
<body><main class="wrap"><header class="top"><div class="brand">My<b>Bets</b></div><div class="top-right"><div class="balance-box"><span>Saldo disponível</span><strong id="balance">R$ 0,00</strong></div><button class="back" onclick="location.href='/dashboard.html'">← Voltar</button></div></header>
<section class="hero"><div class="tiger">🐯</div><h1>My Tiger</h1><p>Slot demonstrativo • créditos virtuais</p></section>
<section class="machine"><div class="reels" id="reels"></div><div class="bet-panel"><label class="bet-label" for="betInput">VALOR DA APOSTA</label><div class="bet-input-wrap"><button class="ctrl" onclick="changeBet(-1)">−</button><input class="bet-input" id="betInput" type="number" min="1" max="20" step="1" value="1" inputmode="numeric" aria-label="Valor da aposta"><button class="ctrl" onclick="changeBet(1)">+</button></div></div><div class="controls"><div></div><button class="spin" id="spin" onclick="spin()">GIRAR</button><div></div></div><div class="status" id="status">Aposta: 1 crédito virtual</div></section>
<section class="paytable"><h2>🐯 Tabela de símbolos</h2><div class="row"><span>🐯 Tigre</span><strong>50x</strong></div><div class="row"><span>👑 Coroa</span><strong>25x</strong></div><div class="row"><span>💎 Diamante</span><strong>15x</strong></div><div class="row"><span>🪙 Moeda</span><strong>8x</strong></div><div class="row"><span>🍊 Laranja</span><strong>4x</strong></div></section>
<p class="note">Versão demonstrativa independente. Não movimenta saldo real.</p></main>
<script>
const symbols=['🐯','👑','💎','🪙','🍊','🍋','🔔','7️⃣'];let bet=1,busy=false;const reels=document.getElementById('reels'),status=document.getElementById('status'),spinBtn=document.getElementById('spin'),betInput=document.getElementById('betInput'),balanceEl=document.getElementById('balance');
function money(v){return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function loadBalance(){try{const u=JSON.parse(localStorage.getItem('jpbet_user')||'null');const b=Number(u?.balance??u?.cash_balance??0);balanceEl.textContent='R$ '+money(b)}catch(e){balanceEl.textContent='R$ 0,00'}}
function draw(arr,win=[]){reels.innerHTML='';arr.forEach((s,i)=>{const d=document.createElement('div');d.className='cell'+(win.includes(i)?' win':'');d.textContent=s;reels.appendChild(d)})}
function randomBoard(){return Array.from({length:15},()=>symbols[Math.floor(Math.random()*symbols.length)])}
draw(randomBoard());loadBalance();
function syncBet(){let v=Number(betInput.value);if(!Number.isFinite(v))v=1;bet=Math.max(1,Math.min(20,Math.round(v)));betInput.value=bet;status.textContent='Aposta: '+bet+' crédito'+(bet===1?'':'s')+' virtual(is)'}
function changeBet(dir){if(busy)return;bet=Math.max(1,Math.min(20,bet+dir));betInput.value=bet;syncBet()}
betInput.addEventListener('input',syncBet);betInput.addEventListener('blur',syncBet);
function spin(){if(busy)return;syncBet();busy=true;spinBtn.disabled=true;status.textContent='Girando...';let n=0;const timer=setInterval(()=>{draw(randomBoard());n++;if(n>=12){clearInterval(timer);finish()}},75)}
function finish(){let b=randomBoard();const s=symbols[Math.floor(Math.random()*symbols.length)];const start=Math.floor(Math.random()*10);if(Math.random()<.32){for(let i=0;i<3;i++)b[start+i]=s;draw(b,[start,start+1,start+2]);status.textContent='🎉 Combinação encontrada! Resultado demonstrativo.'}else{draw(b);status.textContent='Nenhuma combinação desta rodada.'}busy=false;spinBtn.disabled=false;loadBalance()}
</script></body></html>
