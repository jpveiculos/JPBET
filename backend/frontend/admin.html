<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1.0”

  <title>JPBET - Administração</title>
  <style>
  * {
    box-sizing: border-box;
  }
  html {
    font-size: 18px;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: #080b10;
    color: #ffffff;
    font-size: 1rem;
  }
  button,
  input,
  textarea {
    font: inherit;
  }
  /* =========================
     LOGIN
  ========================== */
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 520px;
    background: #11161d;
    border: 1px solid #252d38;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .login-logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .login-subtitle {
    text-align: center;
    color: #aab4c0;
    font-size: 19px;
    margin-bottom: 34px;
  }
  .login-field {
    margin-bottom: 22px;
  }
  .login-field label {
    display: block;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: 700;
  }
  .login-field input {
    width: 100%;
    padding: 17px;
    min-height: 58px;
    border: 1px solid #303945;
    border-radius: 11px;
    background: #0b0f14;
    color: #ffffff;
    outline: none;
    font-size: 18px;
  }
  .login-field input:focus {
    border-color: #ffffff;
  }
  .login-button {
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 11px;
    padding: 15px;
    background: #ffffff;
    color: #080b10;
    font-size: 19px;
    font-weight: 900;
    cursor: pointer;
    margin-top: 8px;
  }
  .login-button:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  .login-message {
    min-height: 26px;
    margin-top: 18px;
    text-align: center;
    color: #ff7373;
    font-size: 16px;
  }
  /* =========================
     PAINEL
  ========================== */
  .admin-page {
    min-height: 100vh;
    padding: 24px;
  }
  .admin-container {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
  }
  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
    padding: 25px;
    background: #11161d;
    border: 1px solid #252d38;
    border-radius: 16px;
  }
  .admin-title {
    margin: 0;
    font-size: 32px;
  }
  .admin-subtitle {
    margin: 7px 0 0;
    color: #aab4c0;
    font-size: 17px;
  }
  .logout-button {
    border: 1px solid #303945;
    border-radius: 10px;
    padding: 13px 22px;
    background: transparent;
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
  }
  .logout-button:hover {
    background: #1a2028;
  }
  .admin-message {
    margin-bottom: 24px;
    color: #aab4c0;
    font-size: 17px;
  }
  /* =========================
     CARDS
  ========================== */
  .overview {
    display: grid;
    grid-template-columns:
      repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 28px;
  }
  .overview-card {
    background: #11161d;
    border: 1px solid #252d38;
    border-radius: 16px;
    padding: 28px;
  }
  .overview-card-title {
    color: #aab4c0;
    font-size: 17px;
    margin-bottom: 12px;
  }
  .overview-card-value {
    font-size: 36px;
    font-weight: 900;
  }
  /* =========================
     CONFIGURAÇÕES
  ========================== */
  .settings {
    background: #11161d;
    border: 1px solid #252d38;
    border-radius: 16px;
    padding: 28px;
  }
  .settings h2 {
    margin-top: 0;
    font-size: 28px;
    margin-bottom: 25px;
  }
  .setting-row {
    display: flex;
    gap: 15px;
    margin-bottom: 22px;
  }
  .setting-row label {
    font-size: 17px !important;
    font-weight: 700;
  }
  .setting-row input,
  .setting-row textarea {
    font-size: 17px !important;
    min-height: 55px;
  }
  /* =========================
     CELULAR
  ========================== */
  @media (max-width: 600px) {
    html {
      font-size: 18px;
    }
    .login-page {
      padding: 18px;
    }
    .login-card {
      padding: 30px 22px;
      border-radius: 18px;
    }
    .login-logo {
      font-size: 38px;
    }
    .login-subtitle {
      font-size: 18px;
    }
    .login-field label {
      font-size: 18px;
    }
    .login-field input {
      min-height: 60px;
      font-size: 18px;
      padding: 17px;
    }
    .login-button {
      min-height: 60px;
      font-size: 19px;
    }
    .admin-page {
      padding: 15px;
    }
    .admin-header {
      flex-direction: column;
      align-items: stretch;
      padding: 22px;
    }
    .admin-title {
      font-size: 30px;
    }
    .admin-subtitle {
      font-size: 17px;
    }
    .logout-button {
      width: 100%;
      min-height: 52px;
      font-size: 17px;
    }
    .overview {
      grid-template-columns: 1fr;
    }
    .overview-card {
      padding: 24px;
    }
    .overview-card-title {
      font-size: 17px;
    }
    .overview-card-value {
      font-size: 34px;
    }
    .settings {
      padding: 22px;
    }
    .settings h2 {
      font-size: 27px;
    }
  }
</style>
</head>
<body>
  <!-- =========================
       LOGIN ADMINISTRATIVO
  ========================== -->
  <section
    id="loginContainer"
    class="login-page"
  >
<div class="login-card">
  <div class="login-logo">
    JPBET
  </div>
  <div class="login-subtitle">
    Acesso administrativo
  </div>
  <form id="adminLoginForm">
    <div class="login-field">
      <label for="adminUsername">
        Usuário
      </label>
      <input
        id="adminUsername"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="Digite o usuário"
        required
      >
    </div>
    <div class="login-field">
      <label for="adminPassword">
        Senha
      </label>
      <input
        id="adminPassword"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Digite a senha"
        required
      >
    </div>
    <button
      id="loginButton"
      class="login-button"
      type="submit"
    >
      Entrar
    </button>
    <div
      id="loginMessage"
      class="login-message"
    ></div>
  </form>
</div>
  </section>
  <!-- =========================
       PAINEL ADMINISTRATIVO
  ========================== -->
  <section
    id="dashboardContainer"
    class="admin-page"
    style="display: none;"
  >
<div class="admin-container">
  <header class="admin-header">
    <div>
      <h1 class="admin-title">
        JPBET
      </h1>
      <p class="admin-subtitle">
        Painel administrativo
      </p>
    </div>
    <button
      type="button"
      class="logout-button"
      onclick="sairAdmin()"
    >
      Sair
    </button>
  </header>
  <p
    id="adminMessage"
    class="admin-message"
  >
    Verificando sessão...
  </p>
  <!-- =========================
       VISÃO GERAL
  ========================== -->
  <section class="overview">
    <div class="overview-card">
      <div class="overview-card-title">
        Total de jogadores
      </div>
      <div
        id="totalUsers"
        class="overview-card-value"
      >
        0
      </div>
    </div>
    <div class="overview-card">
      <div class="overview-card-title">
        Saldo total
      </div>
      <div
        id="totalBalance"
        class="overview-card-value"
      >
        R$ 0,00
      </div>
    </div>
  </section>
  <!-- =========================
       CONFIGURAÇÕES
  ========================== -->
  <section class="settings">
    <h2>
      Configurações
    </h2>
    <div id="settingsContainer">
      Carregando configurações...
    </div>
  </section>
</div>
  </section>
  <!-- =========================
       JAVASCRIPT DO PAINEL
  ========================== -->
  <script src="admin.js"></script>
  <!-- =========================
       LOGIN / SESSÃO
  ========================== -->
  <script>
    document.addEventListener(
      "DOMContentLoaded",
      async () => {
        const loginContainer =
          document.getElementById(
            "loginContainer"
          );
        const dashboardContainer =
          document.getElementById(
            "dashboardContainer"
          );
        const loginForm =
          document.getElementById(
            "adminLoginForm"
          );
        const loginButton =
          document.getElementById(
            "loginButton"
          );
        const loginMessage =
          document.getElementById(
            "loginMessage"
          );
        /*
         * Mostra o painel e esconde o login.
         */
        function mostrarPainel() {
          loginContainer.style.display =
            "none";
          dashboardContainer.style.display =
            "block";
        }
        /*
         * Mostra o login e esconde o painel.
         */
        function mostrarLogin() {
          loginContainer.style.display =
            "flex";
          dashboardContainer.style.display =
            "none";
        }
        /*
         * Verifica se já existe uma sessão
         * administrativa válida.
         */
        async function verificarSessao() {
          try {
            const response =
              await fetch(
                "/api/admin-session",
                {
                  method: "GET",
                  credentials: "include"
                }
              );
            const data =
              await response
                .json()
                .catch(() => ({}));
            if (
              response.ok &&
              data.authenticated === true
            ) {
              mostrarPainel();
              return true;
            }
            mostrarLogin();
            return false;
          } catch (error) {
            console.error(
              "Erro ao verificar sessão:",
              error
            );
            mostrarLogin();
            return false;
          }
        }
        /*
         * Login administrativo.
         */
        loginForm.addEventListener(
          "submit",
          async (event) => {
            event.preventDefault();
            const username =
              document
                .getElementById(
                  "adminUsername"
                )
                .value
                .trim();
            const password =
              document
                .getElementById(
                  "adminPassword"
                )
                .value;
            loginMessage.textContent =
              "";
            if (
              !username ||
              !password
            ) {
              loginMessage.textContent =
                "Digite o usuário e a senha.";
              return;
            }
            loginButton.disabled =
              true;
            loginButton.textContent =
              "Entrando...";
            try {
              const response =
                await fetch(
                  "/api/admin-login",
                  {
                    method: "POST",
                    headers: {
                      "Content-Type":
                        "application/json"
                    },
                    credentials:
                      "include",
                    body:
                      JSON.stringify({
                        username,
                        password
                      })
                  }
                );
              const data =
                await response
                  .json()
                  .catch(() => ({}));
              if (
                !response.ok ||
                data.success !== true ||
                data.authenticated !== true
              ) {
                throw new Error(
                  data.message ||
                  "Usuário ou senha inválidos."
                );
              }
              loginMessage.style.color =
                "#7ee787";
              loginMessage.textContent =
                "Login realizado com sucesso.";
              /*
               * Aguardar o navegador registrar
               * o cookie da sessão antes de
               * acessar as rotas protegidas.
               */
              await new Promise(
                resolve =>
                  setTimeout(
                    resolve,
                    100
                  )
              );
              mostrarPainel();
              /*
               * Atualiza imediatamente
               * o painel após o login.
               */
              if (
                typeof carregarDashboardAdmin ===
                "function"
              ) {
                await carregarDashboardAdmin();
              }
              if (
                typeof carregarConfiguracoes ===
                "function"
              ) {
                await carregarConfiguracoes();
              }
            } catch (error) {
              console.error(
                "Erro no login administrativo:",
                error
              );
              loginMessage.style.color =
                "#ff7373";
              loginMessage.textContent =
                error.message ||
                "Não foi possível realizar o login.";
            } finally {
              loginButton.disabled =
                false;
              loginButton.textContent =
                "Entrar";
            }
          }
        );
        /*
         * Verifica automaticamente
         * uma sessão já existente.
         */
        await verificarSessao();
      }
    );
  </script>
</body>
</html>
