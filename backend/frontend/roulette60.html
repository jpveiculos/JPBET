<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#03070c"><title>MyBets</title><style>:root{--gold:#ffd83d;--bg:#03070c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;min-height:100%;background:var(--bg);color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}.header{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:linear-gradient(180deg,#060b12,#03070c);border-bottom:1px solid rgba(255,255,255,.13);position:relative;z-index:20;box-shadow:0 5px 20px rgba(0,0,0,.28)}.logo{position:relative;padding-bottom:7px;font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px;color:#fff;text-decoration:none}.logo b{color:#f6bd24}.logo:after{content:"";position:absolute;left:0;right:-4px;bottom:0;height:7px;border-bottom:4px solid #f6bd24;border-radius:0 0 70% 55%;transform:skewX(-18deg) rotate(-2deg)}.header-right{display:flex;align-items:center;gap:7px}.header-balance{min-width:122px;padding:5px 10px;border:1px solid rgba(245,197,66,.38);border-radius:15px;background:linear-gradient(180deg,#0c121a,#070b11);font-size:11px;color:#aeb5c2}.header-balance strong{display:block;color:#ffda52;font-size:17px;margin-top:1px}.menu-button{width:40px;height:40px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:linear-gradient(180deg,#111a25,#0b121b);color:#fff;font-size:23px}.page{width:100%;height:calc(100vh - 66px);max-width:720px;margin:0 auto;padding:0 8px 74px;text-align:center;background:radial-gradient(circle at 50% 12%,rgba(255,205,49,.055),transparent 32%),linear-gradient(180deg,#03070c,#050a10);overflow:hidden}.wheel{position:relative;width:min(350px,calc(100vw - 34px));aspect-ratio:1;margin:0 auto 5px;filter:drop-shadow(0 16px 28px rgba(0,0,0,.8))}.wheel:before{content:"";position:absolute;inset:-9px;border-radius:50%;background:radial-gradient(circle,transparent 0 87%,#6b3c00 87.2%,#a96500 87.8%,#f1a51b 88.5%,#fff2a3 89.25%,#ffd43b 90%,#c77b05 91%,#6f3e00 92.3%,#2a1800 93.1%,transparent 93.7%);box-shadow:0 2px 5px rgba(0,0,0,.9)}.wheel:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(255,241,157,.85);box-shadow:inset 0 0 0 1px rgba(107,60,0,.9);pointer-events:none;z-index:4}#wheel{position:absolute;inset:0;width:100%;height:100%;z-index:3;transform-origin:50% 50%;will-change:transform;overflow:visible}.pointer{position:absolute;z-index:10;left:50%;top:-13px;transform:translateX(-50%);width:50px;height:56px;background:linear-gradient(180deg,#ffe98a,#dca51c 24%,#9d6908 68%,#5d3a00);clip-path:polygon(4% 0,96% 0,78% 58%,50% 100%,22% 58%);filter:drop-shadow(0 5px 7px rgba(0,0,0,.95));pointer-events:none}.pointer:before{content:"";position:absolute;left:9px;top:7px;width:32px;height:38px;background:#05070a;clip-path:polygon(4% 0,96% 0,72% 58%,50% 100%,28% 58%)}.pointer:after{content:"";position:absolute;left:15px;top:10px;width:20px;height:29px;background:linear-gradient(180deg,#ff6673,#ff3045 55%,#b5001b);clip-path:polygon(0 0,100% 0,50% 100%)}.center{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;border:4px solid #d99a13;border-radius:50%;background:radial-gradient(circle at 45% 30%,#302510,#050505 72%);box-shadow:0 0 0 2px #5b3a09,0 0 0 5px rgba(255,203,52,.35),inset 0 0 14px rgba(255,190,30,.2);color:#ffd23d;padding:0}.brand{display:block;font-size:17px;font-weight:900;font-style:italic;line-height:1;margin-bottom:7px}.brand .my{color:#f6bd24}.brand .bets{color:#fff}.go{display:block;font-size:23px;font-weight:900;line-height:1}.result{min-height:18px;font-size:14px;font-weight:900;margin:0 0 3px}.win{color:#25f477}.loss{color:#ff3948}.error{color:#ffd24a}.bet-area{max-width:570px;margin:0 auto;padding:0 7px}.bet-title{text-align:left;color:#d2d7df;font-size:13px;margin:0 0 4px 3px}.bet-row{display:grid;grid-template-columns:46px 1fr 46px;gap:7px}.bet-row button,.bet-value{height:46px;border-radius:13px;background:linear-gradient(180deg,#151e28,#0c131c);color:#fff}.bet-row button{border:1px solid #77580e;font-size:27px;font-weight:900}.bet-value{border:1px solid #566171;display:flex;align-items:center;padding:0 15px;font-size:24px;font-weight:900;text-align:left}.hint{margin-top:5px;color:#8993a2;font-size:11px}.bottom{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(180deg,rgba(7,12,18,.97),rgba(2,5,9,.99));border-top:1px solid rgba(255,255,255,.15)}.bottom a{color:#8993a3;text-decoration:none;text-align:center;font-size:11px;font-weight:800;padding-top:7px}.bottom a span{display:block;font-size:21px;line-height:23px}.bottom a.active{color:#ffdf45}.bottom a.active:after{content:"";display:block;width:66px;height:3px;border-radius:4px;background:#ffdf45;margin:2px auto 0}@media(max-width:430px){.wheel{width:min(350px,calc(100vw - 34px));margin-top:0}.header-balance{min-width:116px}.logo{font-size:27px}}</style></head><body><header class="header"><a class="logo" href="/">My<b>Bets</b></a><div class="header-right"><div class="header-balance">Saldo<strong id="headerBalance">R$ 0,00</strong></div><button class="menu-button" onclick="location.href='/dashboard.html'">☰</button></div></header><main class="page"><div class="wheel"><svg id="wheel" viewBox="0 0 500 500" aria-label="Roleta 60"><g id="rouletteSvg"></g></svg><div class="pointer"></div><button id="spinButton" class="center" aria-label="Girar roleta"><span class="brand"><span class="my">My</span><span class="bets">Bets</span></span><span class="go">GIRAR</span></button></div><div id="result" class="result"></div><section class="bet-area"><div class="bet-title">Valor da aposta</div><div class="bet-row"><button type="button" disabled>−</button><div class="bet-value">R$ 20,00</div><button type="button" disabled>+</button></div><div id="authHint" class="hint">Faça login para jogar.</div></section></main><nav class="bottom"><a href="/"><span>⌂</span>Início</a><a href="/dashboard.html"><span>👤</span>Área do jogador</a><a class="active" href="/roulette60.html"><span>◉</span>Roleta</a></nav><script>window.MYBETS_LARGE_ROULETTE={id:'roleta60',slices:60,bet:20,prizes:[200,400,600,800],prizeIndexes:[0,15,30,45]};</script><script src="/roulette-large.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{try{const u=JSON.parse(localStorage.getItem('jpbet_user')||'null');if(u)document.getElementById('headerBalance').textContent='R$ '+Number(u.balance||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}catch(e){}})</script></body></html>
