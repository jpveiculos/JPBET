<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">

  <title>MyBets — Jogos</title>

  <link rel="stylesheet" href="/games.css?v=20260908-mybets-02">
</head>

<body>

  <header class="game-header">

    <button
      class="header-back"
      id="backButton"
      type="button"
      aria-label="Voltar"
    >
      ←
    </button>

    <a
      class="game-brand"
      href="index.html"
      aria-label="MyBets"
    >
      My<span>Bets</span>
    </a>

    <div class="header-balance">
      R$ <strong id="balance">0,00</strong>
    </div>

  </header>


  <main class="games-page">

    <section
      class="games-lobby"
      id="gamesLobby"
    >

      <div class="page-kicker">
        MyBets CASINO
      </div>

      <h1>
        Jogos
      </h1>

      <p>
        Escolha sua experiência.
      </p>

      <div
        id="gamesMessage"
        class="games-message"
      >
        Carregando jogos...
      </div>

      <div
        id="gamesContainer"
        class="games-container"
      ></div>

    </section>


    <section
      class="game-stage"
      id="gameStage"
      hidden
    >

      <div class="game-stage-top">

        <button
          class="stage-back"
          id="stageBack"
          type="button"
        >
          ← Jogos
        </button>

        <div class="stage-balance">
          R$ <strong id="stageBalance">0,00</strong>
        </div>

      </div>


      <div class="game-title-row">

        <div>

          <div
            class="game-kicker"
            id="gameTypeLabel"
          >
            ROLETA
          </div>

          <h2 id="gameTitle">
            Roleta da Sorte
          </h2>

        </div>

        <div
          class="win-display"
          id="winDisplay"
        >
          R$ 0,00
        </div>

      </div>


      <!-- =====================================================
           ROLETA DA SORTE
      ====================================================== -->

      <div
        class="roulette-panel"
        id="roulettePanel"
        hidden
      >

        <div class="roulette-heading">

          <div>

            <div class="roulette-crown">
              ♛
            </div>

            <div class="roulette-name">
              Roleta da Sorte
            </div>

            <div class="roulette-subtitle">
              GIRE E DESCUBRA A SUA SORTE
            </div>

          </div>


          <div
            class="roulette-free-badge"
            id="rouletteFreeBadge"
            hidden
          >
            🍀
            <strong>
              GIRO GRÁTIS
            </strong>
          </div>

        </div>


        <div class="roulette-machine">

          <div
            class="roulette-pointer"
            aria-hidden="true"
          >
            <span class="pointer-gem"></span>
          </div>


          <div class="roulette-wheel-shell">

            <div
              class="roulette-bulbs"
              id="rouletteBulbs"
            ></div>


            <div
              class="roulette-wheel"
              id="rouletteWheel"
              aria-label="Roleta da Sorte"
            ></div>


            <div class="roulette-inner-ring"></div>


            <button
              class="roulette-hub"
              id="rouletteCenterButton"
              type="button"
              aria-label="Girar roleta"
            >

              <span>
                ♛
              </span>

              <strong>
                GIRAR
              </strong>

              <small>
                MYBETS
              </small>

            </button>

          </div>

        </div>


        <div
          class="roulette-free-spin-status"
          id="rouletteFreeSpinStatus"
          hidden
        ></div>


        <div
          class="roulette-result"
          id="rouletteResult"
        >
          Faça sua aposta
        </div>


        <div class="roulette-betting">

          <div class="roulette-selection-label">
            ESCOLHA O VALOR DA APOSTA
          </div>


          <div class="roulette-bet-row">

            <button
              type="button"
              id="rouletteBetMinus"
              aria-label="Diminuir aposta"
            >
              −
            </button>


            <div>

              <small>
                VALOR DA APOSTA
              </small>

              <strong id="rouletteBetValue">
                R$ 0,50
              </strong>

            </div>


            <button
              type="button"
              id="rouletteBetPlus"
              aria-label="Aumentar aposta"
            >
              +
            </button>

          </div>


          <!-- 6 BOTÕES RÁPIDOS -->

          <div
            class="quick-bets roulette-quick-bets"
            id="rouletteQuickBets"
          >

            <button
              type="button"
              data-roulette-bet="0.5"
            >
              R$ 0,50
            </button>

            <button
              type="button"
              data-roulette-bet="1"
            >
              R$ 1
            </button>

            <button
              type="button"
              data-roulette-bet="2"
            >
              R$ 2
            </button>

            <button
              type="button"
              data-roulette-bet="5"
            >
              R$ 5
            </button>

            <button
              type="button"
              data-roulette-bet="10"
            >
              R$ 10
            </button>

            <button
              type="button"
              data-roulette-bet="50"
            >
              R$ 50
            </button>

          </div>


          <!-- OUTROS VALORES -->

          <button
            class="other-value-button"
            id="rouletteOtherValue"
            type="button"
          >
            OUTROS VALORES
          </button>


          <!-- GIRAR -->

          <button
            class="spin-button roulette-spin-button"
            id="rouletteSpinButton"
            type="button"
          >
            GIRAR
          </button>


          <div class="roulette-legend">

            <span>
              <i class="legend-x">X</i>
              Perde
            </span>

            <span>
              <i class="legend-2">2×</i>
            </span>

            <span>
              <i class="legend-3">3×</i>
            </span>

            <span>
              <i class="legend-4">4×</i>
            </span>

            <span>
              <i class="legend-5">5×</i>
            </span>

            <span>
              <i class="legend-clover">🍀</i>
              Giro grátis
            </span>

          </div>

        </div>

      </div>

    </section>

  </main>


  <div
    class="toast"
    id="toast"
  ></div>


  <script src="/games.js?v=20260908-mybets-02"></script>

</body>
</html>
