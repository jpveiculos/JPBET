<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JPBET - Jogos</title>

  <link
    rel="stylesheet"
    href="/games.css?v=20260907-03"
  >
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <span class="brand-main">JP</span>
      <span class="brand-sub">BET</span>
    </div>

    <div class="topbar-right">

      <div class="balance-box">
        <span class="balance-label">
          Saldo
        </span>

        <strong id="balance">
          R$ 0,00
        </strong>
      </div>

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        Voltar
      </button>

    </div>

  </header>


  <main class="page">

    <section class="hero">

      <div>
        <p class="eyebrow">
          JPBET
        </p>

        <h1>
          Jogos
        </h1>

        <p class="hero-description">
          Escolha sua máquina e faça sua aposta.
        </p>
      </div>

    </section>


    <section
      id="gamesContainer"
      class="games-container"
    >
      <div class="loading">
        Carregando jogos...
      </div>
    </section>


    <div
      id="gamesMessage"
      class="message"
      hidden
    ></div>

  </main>


  <!-- =====================================================
       MODAL DO JOGO
  ====================================================== -->

  <div
    id="gameModal"
    class="modal"
    hidden
  >

    <div class="modal-backdrop"></div>

    <div
      class="game-modal-content"
      role="dialog"
      aria-modal="true"
    >

      <button
        id="closeGameButton"
        class="close-button"
        type="button"
        aria-label="Fechar"
      >
        ×
      </button>


      <div class="game-header">

        <div>
          <p
            id="gameEyebrow"
            class="eyebrow"
          >
            JOGO
          </p>

          <h2 id="gameTitle">
            Jogo
          </h2>
        </div>

        <div class="game-balance">

          <span>
            Saldo
          </span>

          <strong id="gameBalance">
            R$ 0,00
          </strong>

        </div>

      </div>


      <!-- =================================================
           MÁQUINA
      ================================================== -->

      <div
        id="slotMachine"
        class="slot-machine"
      >

        <div
          id="slotReels"
          class="slot-reels"
        ></div>

      </div>


      <!-- =================================================
           ROLETA EUROPEIA
      ================================================== -->

      <div
        id="rouletteMachine"
        class="roulette-machine"
        hidden
      >

        <div class="roulette-wheel-area">

          <div
            id="rouletteWheel"
            class="roulette-wheel"
          >

            <div
              id="rouletteWheelNumbers"
              class="roulette-wheel-numbers"
            ></div>

            <div class="roulette-wheel-center">
              <span>JP</span>
              <small>BET</small>
            </div>

          </div>

          <div
            id="rouletteResult"
            class="roulette-result"
          >
            Faça sua aposta
          </div>

        </div>


        <div class="roulette-controls">

          <div class="roulette-bet-type">

            <label for="rouletteBetType">
              Tipo de aposta
            </label>

            <select
              id="rouletteBetType"
            >

              <option value="straight">
                Número
              </option>

              <option value="red">
                Vermelho
              </option>

              <option value="black">
                Preto
              </option>

              <option value="odd">
                Ímpar
              </option>

              <option value="even">
                Par
              </option>

              <option value="low">
                1 - 18
              </option>

              <option value="high">
                19 - 36
              </option>

              <option value="dozen1">
                1ª Dúzia
              </option>

              <option value="dozen2">
                2ª Dúzia
              </option>

              <option value="dozen3">
                3ª Dúzia
              </option>

              <option value="column1">
                Coluna 1
              </option>

              <option value="column2">
                Coluna 2
              </option>

              <option value="column3">
                Coluna 3
              </option>

            </select>

          </div>


          <div
            id="rouletteSelectionArea"
            class="roulette-selection-area"
          >

            <label>
              Escolha o número
            </label>

            <div
              id="rouletteNumberGrid"
              class="roulette-number-grid"
            ></div>

          </div>


          <div class="roulette-bet-summary">

            <span>
              Multiplicador:
            </span>

            <strong id="rouletteMultiplier">
              35x
            </strong>

          </div>

        </div>

      </div>


      <!-- =================================================
           RESULTADO
      ================================================== -->

      <div
        id="winMessage"
        class="win-message"
        hidden
      ></div>


      <!-- =================================================
           CONTROLES DE APOSTA
      ================================================== -->

      <div
        id="slotControls"
        class="game-controls"
      >

        <div class="bet-control">

          <label for="betInput">
            Valor da aposta
          </label>

          <div class="bet-input-row">

            <button
              type="button"
              class="bet-adjust"
              data-action="decrease"
            >
              −
            </button>

            <div class="bet-input-wrapper">

              <span>
                R$
              </span>

              <input
                id="betInput"
                type="number"
                min="0.01"
                step="0.01"
                inputmode="decimal"
                value="1"
              >

            </div>

            <button
              type="button"
              class="bet-adjust"
              data-action="increase"
            >
              +
            </button>

          </div>

        </div>


        <div class="quick-bets">

          <button
            type="button"
            data-bet="1"
          >
            R$ 1
          </button>

          <button
            type="button"
            data-bet="5"
          >
            R$ 5
          </button>

          <button
            type="button"
            data-bet="10"
          >
            R$ 10
          </button>

          <button
            type="button"
            data-bet="25"
          >
            R$ 25
          </button>

          <button
            type="button"
            data-bet="50"
          >
            R$ 50
          </button>

        </div>


        <button
          id="spinButton"
          class="spin-button"
          type="button"
        >
          GIRAR
        </button>

      </div>


      <!-- =================================================
           CONTROLES DA ROLETA
      ================================================== -->

      <div
        id="rouletteControls"
        class="game-controls roulette-game-controls"
        hidden
      >

        <div class="bet-control">

          <label for="rouletteBetInput">
            Valor da aposta
          </label>

          <div class="bet-input-row">

            <button
              type="button"
              class="bet-adjust roulette-bet-adjust"
              data-roulette-action="decrease"
            >
              −
            </button>

            <div class="bet-input-wrapper">

              <span>
                R$
              </span>

              <input
                id="rouletteBetInput"
                type="number"
                min="0.01"
                step="0.01"
                inputmode="decimal"
                value="1"
              >

            </div>

            <button
              type="button"
              class="bet-adjust roulette-bet-adjust"
              data-roulette-action="increase"
            >
              +
            </button>

          </div>

        </div>


        <div class="quick-bets">

          <button
            type="button"
            data-roulette-bet="1"
          >
            R$ 1
          </button>

          <button
            type="button"
            data-roulette-bet="5"
          >
            R$ 5
          </button>

          <button
            type="button"
            data-roulette-bet="10"
          >
            R$ 10
          </button>

          <button
            type="button"
            data-roulette-bet="25"
          >
            R$ 25
          </button>

          <button
            type="button"
            data-roulette-bet="50"
          >
            R$ 50
          </button>

        </div>


        <button
          id="rouletteSpinButton"
          class="spin-button"
          type="button"
        >
          GIRAR ROLETA
        </button>

      </div>


      <!-- =================================================
           TABELA DE PRÊMIOS
      ================================================== -->

      <section
        id="paytableSection"
        class="paytable-section"
      >

        <div class="section-title">
          Tabela de prêmios
        </div>

        <div
          id="paytable"
          class="paytable"
        ></div>

      </section>


      <!-- =================================================
           INFORMAÇÕES
      ================================================== -->

      <div class="game-info">

        <span>
          Aposta mínima:
          <strong id="minBet">
            R$ 0,00
          </strong>
        </span>

        <span>
          Aposta máxima:
          <strong id="maxBet">
            R$ 0,00
          </strong>
        </span>

      </div>

    </div>

  </div>


  <script src="/games.js?v=20260907-03"></script>

</body>
</html>
