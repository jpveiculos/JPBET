<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>JPBET - Jogos</title>

  <link
    rel="stylesheet"
    href="/games.css"
  >
</head>

<body>

  <header class="topbar">

    <div class="brand">
      <span class="brand-main">JP</span>
      <span class="brand-sub">BET</span>
    </div>

    <div class="topbar-right">

      <div class="balance-box">
        <span class="balance-label">
          Saldo
        </span>

        <strong id="balance">
          R$ 0,00
        </strong>
      </div>

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        Voltar
      </button>

    </div>

  </header>


  <main class="page">

    <section class="hero">

      <div>
        <p class="eyebrow">
          JPBET
        </p>

        <h1>
          Jogos
        </h1>

        <p class="hero-description">
          Escolha sua máquina e faça sua aposta.
        </p>
      </div>

    </section>


    <section
      id="gamesContainer"
      class="games-container"
    >

      <div class="loading">
        Carregando jogos...
      </div>

    </section>


    <div
      id="gamesMessage"
      class="message"
      hidden
    ></div>

  </main>


  <!-- MODAL DO JOGO -->

  <div
    id="gameModal"
    class="modal"
    hidden
  >

    <div class="modal-backdrop"></div>

    <div
      class="game-modal-content"
      role="dialog"
      aria-modal="true"
    >

      <button
        id="closeGameButton"
        class="close-button"
        type="button"
        aria-label="Fechar"
      >
        ×
      </button>


      <div class="game-header">

        <div>
          <p
            id="gameEyebrow"
            class="eyebrow"
          >
            JOGO
          </p>

          <h2 id="gameTitle">
            Jogo
          </h2>
        </div>

        <div class="game-balance">

          <span>
            Saldo
          </span>

          <strong id="gameBalance">
            R$ 0,00
          </strong>

        </div>

      </div>


      <!-- MÁQUINA -->

      <div
        id="slotMachine"
        class="slot-machine"
      >

        <div
          id="slotReels"
          class="slot-reels"
        ></div>

      </div>


      <!-- RESULTADO -->

      <div
        id="winMessage"
        class="win-message"
        hidden
      ></div>


      <!-- CONTROLES -->

      <div class="game-controls">

        <div class="bet-control">

          <label for="betInput">
            Valor da aposta
          </label>

          <div class="bet-input-row">

            <button
              type="button"
              class="bet-adjust"
              data-action="decrease"
            >
              −
            </button>

            <div class="bet-input-wrapper">

              <span>
                R$
              </span>

              <input
                id="betInput"
                type="number"
                min="0.01"
                step="0.01"
                inputmode="decimal"
                value="1"
              >

            </div>

            <button
              type="button"
              class="bet-adjust"
              data-action="increase"
            >
              +
            </button>

          </div>

        </div>


        <div class="quick-bets">

          <button
            type="button"
            data-bet="1"
          >
            R$ 1
          </button>

          <button
            type="button"
            data-bet="5"
          >
            R$ 5
          </button>

          <button
            type="button"
            data-bet="10"
          >
            R$ 10
          </button>

          <button
            type="button"
            data-bet="25"
          >
            R$ 25
          </button>

          <button
            type="button"
            data-bet="50"
          >
            R$ 50
          </button>

        </div>


        <button
          id="spinButton"
          class="spin-button"
          type="button"
        >
          GIRAR
        </button>

      </div>


      <!-- TABELA DE PRÊMIOS -->

      <section class="paytable-section">

        <div class="section-title">
          Tabela de prêmios
        </div>

        <div
          id="paytable"
          class="paytable"
        ></div>

      </section>


      <!-- INFORMAÇÕES -->

      <div class="game-info">

        <span>
          Aposta mínima:
          <strong id="minBet">
            R$ 0,00
          </strong>
        </span>

        <span>
          Aposta máxima:
          <strong id="maxBet">
            R$ 0,00
          </strong>
        </span>

      </div>

    </div>

  </div>


  <script src="/games.js"></script>

</body>
</html>
