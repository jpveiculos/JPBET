<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>MyBets — Jogos</title>

  <link
    rel="stylesheet"
    href="/games.css?v=20260908-mybets-04"
  >
</head>

<body>

  <header class="games-header">

    <div class="games-header-brand">

      <button
        type="button"
        class="games-back"
        id="gamesBack"
        aria-label="Voltar"
      >
        ←
      </button>

      <strong>MYBETS</strong>

    </div>

    <div
      class="games-balance"
      id="balance"
      data-balance
    >
      R$ 0,00
    </div>

  </header>


  <main class="games-page">

    <section
      class="games-lobby"
      id="gamesLobby"
    >

      <article
        class="game-card"
        data-game="roulette"
        role="button"
        tabindex="0"
        aria-label="Abrir Roleta da Sorte"
      >

        <div>
          <h2>🎰 Roleta da Sorte</h2>

          <p>
            Gire a roleta e tente multiplicar
            sua aposta.
          </p>
        </div>

      </article>

    </section>


    <section
      id="roulettePanel"
      hidden
    >

      <h1 class="roulette-title">
        Roleta da Sorte
      </h1>

      <p class="roulette-subtitle">
        Escolha sua aposta e gire a roleta
      </p>


      <div
        id="rouletteFreeBadge"
        hidden
      >
        🍀 GIRO GRÁTIS
      </div>

      <div
        id="rouletteFreeSpinStatus"
      ></div>


      <!-- ROLETA EXATA DA IMAGEM -->

      <div class="roulette-stage">

        <div class="roulette-wheel-shell">

          <div
            id="rouletteWheel"
            class="roulette-wheel"
            aria-label="Roleta da Sorte"
          >

            <img
              src="/Roleta%20da%20Sorte.png"
              alt="Roleta da Sorte MyBets"
              class="roulette-wheel-image"
              draggable="false"
            >

            <!-- Área invisível sobre o botão GIRAR da própria imagem -->
            <button
              type="button"
              id="rouletteCenterButton"
              class="roulette-image-center-button"
              aria-label="Girar roleta"
            ></button>

          </div>

        </div>

      </div>


      <div
        id="rouletteResult"
        class="roulette-result"
        aria-live="polite"
      >
        Boa sorte! 🎰
      </div>


      <div class="roulette-controls">

        <div class="roulette-bet-row">

          <button
            type="button"
            id="rouletteBetMinus"
            aria-label="Diminuir aposta"
          >
            −
          </button>

          <div id="rouletteBetValue">
            R$ 0,50
          </div>

          <button
            type="button"
            id="rouletteBetPlus"
            aria-label="Aumentar aposta"
          >
            +
          </button>

        </div>


        <div
          id="rouletteQuickBets"
          aria-label="Apostas rápidas"
        ></div>


        <button
          type="button"
          id="rouletteOtherValue"
        >
          Escolher outro valor
        </button>


        <button
          type="button"
          id="rouletteSpinButton"
        >
          🎰 GIRAR ROLETA
        </button>

      </div>


      <div
        class="roulette-legend"
        aria-label="Legenda da roleta"
      >

        <span class="legend-x">
          ✕ X
        </span>

        <span class="legend-2">
          2×
        </span>

        <span class="legend-3">
          3×
        </span>

        <span class="legend-4">
          4×
        </span>

        <span class="legend-5">
          5×
        </span>

        <span class="legend-free">
          🍀 Giro grátis
        </span>

      </div>

    </section>

  </main>


  <script
    src="/games.js?v=20260908-mybets-04"
    defer
  ></script>

</body>
</html>
