<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0f">
  <title>JPBET - Minha Conta</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <div class="logo">JP<span>BET</span></div>

    <button class="login-button" onclick="sair()">
      Sair
    </button>
  </header>

  <main class="dashboard">

    <section class="welcome">
      <p>Bem-vindo</p>
      <h1 id="userName">Jogador</h1>
    </section>

    <section class="balance-card">
      <span>Saldo</span>
      <strong id="balance">R$ 0,00</strong>
    </section>

    <section class="dashboard-grid">

      <div class="dashboard-card">
        <div class="card-icon">🎰</div>
        <h2>Roleta</h2>
        <p>Jogue e confira seus resultados.</p>
        <button class="primary-button" onclick="abrirRoleta()">
          JOGAR
        </button>
      </div>

      <div class="dashboard-card">
        <div class="card-icon">🏆</div>
        <h2>Prêmios</h2>
        <p>Confira seus prêmios e resultados.</p>
        <button class="secondary-button" onclick="mostrarMensagem('Área de prêmios em breve.')">
          VER PRÊMIOS
        </button>
      </div>

      <div class="dashboard-card">
        <div class="card-icon">📜</div>
        <h2>Histórico</h2>
        <p>Veja suas últimas movimentações.</p>
        <button class="secondary-button" onclick="mostrarMensagem('Histórico em breve.')">
          HISTÓRICO
        </button>
      </div>

      <div class="dashboard-card">
        <div class="card-icon">🧾</div>
        <h2>QR Code</h2>
        <p>Acesso disponível somente dentro da sua conta.</p>
        <button class="secondary-button" onclick="mostrarQrCode()">
          VER QR CODE
        </button>
      </div>

    </section>

    <p id="dashboardMessage" class="dashboard-message"></p>

  </main>

  <script>
    const savedUser = localStorage.getItem("jpbet_user");

    if (!savedUser) {
      window.location.href = "index.html";
    }

    const user = savedUser ? JSON.parse(savedUser) : null;

    if (user) {
      document.getElementById("userName").textContent =
        user.username || "Jogador";

      document.getElementById("balance").textContent =
        formatarSaldo(user.balance || 0);
    }

    function formatarSaldo(valor) {
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function sair() {
      localStorage.removeItem("jpbet_user");
      window.location.href = "index.html";
    }

    function abrirRoleta() {
      mostrarMensagem("A roleta será adicionada na próxima etapa.");
    }

    function mostrarQrCode() {
      mostrarMensagem(
        "O QR Code ficará disponível aqui somente para usuários logados."
      );
    }

    function mostrarMensagem(texto) {
      document.getElementById("dashboardMessage").textContent = texto;
    }
  </script>

</body>
</html>
